</style></head><body><div class="wrap"><header class="plazas-hero"><div class="plazas-hero-copy"><div class="brand">CARTEL GESTIÓN · RRHH</div><div class="plazas-title-row"><span class="plazas-title-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"></rect><path d="M8 4V2.8h8V4"></path><path d="M3.5 9.5h17"></path><path d="M10 9.5v2h4v-2"></path></svg></span><div><h1>Plazas</h1><div class="muted">Gestiona las posiciones de la empresa organizadas por departamento.</div></div></div></div><button class="btn primary plazas-new-btn" onclick="newRole()"><span>＋</span><div><b>Nueva plaza</b><small>Crear desde Modelo Maestro v1</small></div></button></header><section id="plazasKpis" class="plazas-kpis"></section><section class="plazas-control"><div class="plazas-search-wrap"><span class="plazas-search-icon">⌕</span><input id="roleSearch" class="role-search" placeholder="Buscar plazas o departamentos…" oninput="renderRoles()"></div><div class="plazas-filters"><select id="departmentFilter" class="department-filter" onchange="renderRoles()"><option value="">Todos los departamentos</option></select><select id="statusFilter" class="department-filter" onchange="renderRoles()"><option value="">Todos los estados</option><option value="active">Activas</option><option value="inactive">Inactivas</option><option value="review">En revisión</option></select><select id="modalityFilter" class="department-filter" onchange="renderRoles()"><option value="">Todas las modalidades</option><option>Presencial</option><option>Semipresencial</option><option>Remoto</option></select><div class="view-switch" role="group" aria-label="Vista de plazas"><button id="viewListBtn" class="active" type="button" onclick="setViewMode('list')" title="Vista de lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle function statusLabel(r){const s=normalizedStatus(r);return s==='active'?'Activa':s==='inactive'?'Inactiva':'En revisión'}

function renderKpis(){const el=$('plazasKpis');if(!el)return;const departments=new Set(roles.map(departmentName)),activeCount=roles.filter(r=>normalizedStatus(r)==='active').length,reviewCount=roles.filter(r=>normalizedStatus(r)==='review').length;el.innerHTML='<article class="plazas-kpi"><span class="plazas-kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="13" rx="2.5"></rect><path d="M9 6V4h6v2"></path><path d="M4 11h16"></path></svg></span><div><small>Total de plazas</small><b>'+roles.length+'</b><span>Posiciones registradas</span></div></article><article class="plazas-kpi"><span class="plazas-kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 8h3v3H8zM13 8h3v3h-3zM8 13h3v3H8zM13 13h3v3h-3z"></path></svg></span><div><small>Departamentos</small><b>'+departments.size+'</b><span>Áreas con plazas creadas</span></div></article><article class="plazas-kpi"><span class="plazas-kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m8.8 12 2.1 2.1 4.4-4.4"></path></svg></span><div><small>Plazas activas</small><b>'+activeCount+'</b><span>Disponibles para operar</span></div></article><article class="plazas-kpi"><span class="plazas-kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.8 1.8"></path></svg></span><div><small>En revisión</small><b>'+reviewCount+'</b><span>Pendientes de validar</span></div></article>'}
function departmentName(x){const a=String(x.area||'').trim().toLowerCase();if(a.includes('dirección')||a.includes('direccion')||String(x.title||'').toLowerCase().includes('asistente personal'))return 'Dirección General';if(a.includes('audio')||String(x.title||'').toLowerCase().includes('gestor técnico'))return 'Audiovisuales';if(a.includes('gráf')||a.includes('graf')||a.includes('diseño'))return 'Diseño y Gráfica';return x.area||'Otros'}function renderDepartmentFilter(){const ds=[...new Set(roles.map(departmentName))].sort((a,b)=>a.localeCompare(b,'es'));$('departmentFilter').innerHTML='<option value="">Todos los departamentos</option>'+ds.map(d=>'<option>'+e(d)+'</option>').join('')}function toggleDepartment(name){openDepartments.has(name)?openDepartments.delete(name):openDepartments.add(name);renderRoles()}function setViewMode(mode){viewMode=mode==='grid'?'grid':'list';const listBtn=$('viewListBtn'),gridBtn=$('viewGridBtn');if(listBtn)listBtn.classList.toggle('active',viewMode==='list');if(gridBtn)gridBtn.classList.toggle('active',viewMode==='grid');renderRoles()}
function renderRoles(){
 const el=$('roles'),q=String($('roleSearch')?.value||'').trim().toLowerCase(),filter=$('departmentFilter')?.value||'',statusFilter=$('statusFilter')?.value||'',modalityFilter=$('modalityFilter')?.value||'',groups={};el.className='departments '+(viewMode==='grid'?'grid-view':'list-view');
 roles.forEach(r=>{
  const d=departmentName(r),status=normalizedStatus(r),modality=String(r.modality||'Presencial');
  if(filter&&d!==filter)return;

  if(modalityFilter&&modality!==modalityFilter)return;
  if(q&&!String((r.title||'')+' '+d+' '+(r.area||'')+' '+modality+' '+statusLabel(r)).toLowerCase().includes(q))return;
  (groups[d]||(groups[d]=[])).push(r)
 });
 const order=['Dirección General','Audiovisuales','Diseño y Gráfica'];
 const names=Object.keys(groups).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,'es')});
 el.innerHTML=names.map(d=>{
  const arr=groups[d],open=openDepartments.has(d)||!!q,tone=departmentTone(d),activeCount=arr.filter(r=>normalizedStatus(r)==='active').length;
  return '<section class="department '+tone+' '+(open?'open':'')+'"><div class="department-head" onclick="toggleDepartment(\''+d.replace(/'/g,"\\'")+'\')"><div class="department-icon">'+departmentIcon(d)+'</div><div class="department-title"><b>'+e(d)+'</b><small>'+arr.length+' '+(arr.length===1?'plaza registrada':'plazas registradas')+'</small></div><div class="department-meta"><span class="department-active-count">'+activeCount+' activa'+(activeCount===1?'':'s')+'</span><span class="department-count">'+arr.length+'</span><span class="department-arrow '+(open?'open':'')+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7.5 9.5 4.5 4.5 4.5-4.5"></path></svg></span></div></div><div class="department-roles">'+arr.map(r=>{const status=normalizedStatus(r),master=Number(r?.work_content?.master_template_version||0)>=1;return '<article class="department-role" onclick="openRole(\''+r.id+'\')"><div class="role-main"><span class="role-mini-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6.5" width="16" height="12.5" rx="2.5"></rect><path d="M9 6.5V4.5h6v2"></path><path d="M4 11h16"></path><path d="M10.2 11v1.8h3.6V11"></path></svg></span><div class="role-copy"><b>'+e(r.title)+'</b><div class="muted role-area">'+e(r.area||d)+'</div></div></div><div class="role-badges"><span class="role-badge modality">'+e(r.modality||'Presencial')+'</span>'+(master?'<span class="role-badge master">Modelo Maestro v1</span>':'')+'</div><span class="pill '+status+'">'+statusLabel(r)+'</span><span class="role-enter">›</span></article>'}).join('')+'</div></section>'
 }).join('')||'<div class="plazas-empty"><div><b>No hay plazas con estos filtros</b><small>Prueba otra búsqueda o cambia los filtros seleccionados.</small></div></div>'
}function openRole(id){location.href='/plaza-ficha.html?id='+encodeURIComponent(id)}function newRoleMasterWorkContent(){

async function newRole(){const title=prompt('Nombre de la nueva plaza');if(!title)return;const area=prompt('Área de la plaza')||'';const{data,error}=await sb.from('hr_roles').insert({title:title.trim(),area:area.trim(),status:'active',work_content:newRoleMasterWorkContent(),automatic_replies:newRoleMasterAutomaticReplies()}).select().single();if(error)return alert(error.message);roles.push(data);openRole(data.id)}async function editRole(){const description=prompt('Descripción general',current.description||'');if(description===null)return;const schedule=prompt('Horario',current.schedule||'');if(schedule===null)return;const{data,error}=await sb.from('hr_roles').update({description,schedule,updated_at:new Date().toISOString()}).eq('id',current.id).select().single();if(error)return alert(error.message);roles=roles.map(x=>x.id===data.id?data:x);current=data;openRole(data.id)}async function newCycle(){const title=prompt('Título de la convocatoria',current.title+' · '+new Date().getFullYear());if(!title)return;const snap={title:current.title,area:current.area,direct_manager:current.direct_manager,description:current.description,functions:current.functions,requirements:current.requirements,schedule:current.schedule,modality:current.modality,employment_type:current.employment_type,compensation:current.compensation,location:current.location};const{data,error}=await sb.from('hr_recruitment_cycles').insert({role_id:current.id,title:title.trim(),status:'draft',role_snapshot:snap}).select().single();if(error)return alert(error.message);cycles.unshift(data);openRole(current.id)}boot();</script></body></html>
