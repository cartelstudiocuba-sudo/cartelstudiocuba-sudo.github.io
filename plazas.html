openPlazasModal('Crear nueva plaza','Selecciona el departamento, icono y condiciones laborales antes de crearla.',fields,async values=>{const dept=departmentRows.find(d=>d.id===values.department_id);if(!dept)throw Error('Selecciona un departamento válido');if(!values.title?.trim())throw Error('Introduce el nombre de la plaza');const trialDiff=values.trial_compensation_mode==='Remuneración diferente',trainingDiff=values.training_compensation_mode==='Remuneración diferente';const payload={title:values.title.trim(),area:dept.name,department_id:dept.id,icon_code:values.icon_code,modality:values.modality,employment_type:values.employment_type,compensation:values.compensation.trim(),currency:values.currency,payment_frequency:values.payment_frequency,payment_method:values.payment_method||null,work_days:values.work_days||null,schedule:values.schedule||null,location:values.location||null,direct_manager:values.direct_manager||null,extra_availability_required:values.extra_availability_mode==='Sí',extra_availability_details:values.extra_availability_mode==='Sí'?values.extra_availability_details||null:null,trial_period:values.trial_period||null,trial_compensation_different:trialDiff,trial_compensation_amount:trialDiff?values.trial_compensation_amount||null:null,training_period:values.training_period||null,training_compensation_different:trainingDiff,training_compensation_amount:trainingDiff?values.training_compensation_amount||null:null,status:({'En revisión':'review','Activa':'active','Inactiva':'inactive'})[values.status]||'review',description:values.description||null,functions:values.functions||null,requirements:values.requirements||null,work_content:newRoleMasterWorkContent(),automatic_replies:newRoleMasterAutomaticReplies()};const {data,error}=await sb.from('hr_roles').insert(payload).select().single();if(error)throw error;roles.push(data);renderDepartmentFilter();renderKpis();renderRoles();openRole(data.id)});

async function editRole(){const description=prompt('Descripción general',current.description||'');if(description===null)return;const schedule=prompt('Horario',current.schedule||'');if(schedule===null)return;const{data,error}=await sb.from('hr_roles').update({description,schedule,updated_at:new Date().toISOString()}).eq('id',current.id).select().single();if(error)return alert(error.message);roles=roles.map(x=>x.id===data.id?data:x);current=data;openRole(data.id)}async function newCycle(){const title=prompt('Título de la convocatoria',current.title+' · '+new Date().getFullYear());if(!title)return;const snap={title:current.title,area:current.area,direct_manager:current.direct_manager,description:current.description,functions:current.functions,requirements:current.requirements,schedule:current.schedule,modality:current.modality,employment_type:current.employment_type,compensation:current.compensation,location:current.location};const{data,error}=await sb.from('hr_recruitment_cycles').insert({role_id:current.id,title:title.trim(),status:'draft',role_snapshot:snap}).select().single();if(error)return alert(error.message);cycles.unshift(data);openRole(current.id)}CartelLoad.run("boot",boot);</script></body></html>
