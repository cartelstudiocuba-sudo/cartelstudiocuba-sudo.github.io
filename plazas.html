 el.innerHTML=names.map(d=>{

function closePlazasModal(){$('plazasModal').classList.remove('open');$('plazasModalForm').onsubmit=null}
function openPlazasModal(title,help,fields,onSubmit){$('plazasModalTitle').textContent=title;$('plazasModalHelp').textContent=help;$('plazasModalError').textContent='';$('plazasModalFields').innerHTML=fields;$('plazasModal').classList.add('open');$('plazasModalForm').reset();$('plazasModalForm').onsubmit=async ev=>{ev.preventDefault();const btn=$('plazasModalSubmit');btn.disabled=true;$('plazasModalError').textContent='';try{await onSubmit(Object.fromEntries(new FormData(ev.currentTarget).entries()));closePlazasModal()}catch(err){$('plazasModalError').textContent=err.message||String(err)}finally{btn.disabled=false}}}
const roleField=(name,label,required=false,type='text',wide=false)=>'<label class="'+(wide?'wide':'')+'">'+e(label)+(type==='textarea'?'<textarea name="'+name+'" '+(required?'required':'')+'></textarea>':'<input type="'+type+'" name="'+name+'" '+(required?'required':'')+'>')+'</label>';
async function reloadDepartmentData(){const [r,d]=await Promise.all([sb.from('hr_roles').select('*').order('title'),sb.from('hr_departments').select('id,name').order('name')]);if(r.error||d.error)throw Error(r.error?.message||d.error?.message);roles=r.data||[];departmentRows=d.data||[];departments=departmentRows.map(x=>x.name);renderDepartmentFilter();renderRoles()}
function departmentOptions(excludeId){return '<option value="">Sin departamento</option>'+departmentRows.filter(d=>d.id!==excludeId).map(d=>'<option value="'+e(d.id)+'">'+e(d.name)+'</option>').join('')}
async function manageDepartment(name){const d=departmentRows.find(x=>x.name===name),members=roles.filter(r=>departmentName(r)===name);const action=await new Promise(resolve=>{const fields='<div class="wide department-manage-menu"><button type="button" data-action="rename">✎ Cambiar nombre</button><button type="button" data-action="move">↗ Mover plazas</button>'+(d?'<button type="button" data-action="delete" class="danger">♢ Eliminar departamento</button>':'')+'</div>';openPlazasModal('Administrar · '+name,members.length+' plazas vinculadas. Nunca se eliminarán las plazas al eliminar un departamento.',fields,async()=>{});$('plazasModalSubmit').style.display='none';$('plazasModalFields').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const value=b.dataset.action;closePlazasModal();$('plazasModalSubmit').style.display='';resolve(value)});const cancel=$('plazasModalForm').querySelector('[type="button"]');cancel.onclick=()=>{closePlazasModal();$('plazasModalSubmit').style.display='';resolve(null)}});if(!action)return;
if(action==='rename'){if(!d)return;openPlazasModal('Cambiar nombre · '+name,'Las plazas vinculadas conservarán su departamento.',roleField('name','Nuevo nombre',true),async values=>{const {error}=await sb.rpc('hr_owner_manage_department',{p_action:'rename',p_department:d.id,p_name:values.name.trim()});if(error)throw error;await reloadDepartmentData()});$('plazasModalFields').querySelector('[name=name]').value=name;return}
if(action==='delete'){if(!d)return;openPlazasModal('Eliminar · '+name,'Se conservarán las '+members.length+' plazas, que pasarán a Sin departamento. Esta acción requiere confirmación.', '<label class="wide">Escribe ELIMINAR para confirmar<input name="confirmation" required autocomplete="off" placeholder="ELIMINAR"></label>',async values=>{if(values.confirmation!=='ELIMINAR')throw Error('Escribe ELIMINAR para confirmar');const {error}=await sb.rpc('hr_owner_manage_department',{p_action:'delete',p_department:d.id});if(error)throw error;await reloadDepartmentData()});return}
if(action==='move'){if(!members.length){alert('Este departamento no tiene plazas para mover.');return}const fields='<label class="wide">Departamento de destino<select name="target">'+departmentOptions(d?.id)+'</select></label><div class="wide department-move-list">'+members.map(r=>'<label><input type="checkbox" name="role_'+e(r.id)+'" value="1" checked> '+e(r.title)+'</label>').join('')+'</div>';openPlazasModal('Mover plazas · '+name,'Selecciona una o varias plazas y su departamento de destino.',fields,async values=>{const ids=members.filter(r=>values['role_'+r.id]).map(r=>r.id);if(!ids.length)throw Error('Selecciona al menos una plaza');const {error}=await sb.rpc('hr_owner_manage_department',{p_action:'move',p_department:d?.id||null,p_target:values.target||null,p_role_ids:ids});if(error)throw error;await reloadDepartmentData()})}
}
async function newDepartment(){openPlazasModal('Nuevo departamento','Crea un departamento para agrupar plazas. Podrás añadir sus plazas después.',roleField('name','Nombre del departamento',true),async values=>{const name=values.name.trim();if(name.length<2)throw Error('Introduce un nombre válido');const {data,error}=await sb.from('hr_departments').insert({name}).select('id,name').single();if(error)throw error;departmentRows.push(data);departments.push(data.name);openDepartments.add(data.name);renderDepartmentFilter();renderKpis();renderRoles()})}
async function newRole(){const opts=[...new Set([...departments,...roles.map(departmentName)])].sort((a,b)=>a.localeCompare(b,'es'));const options=opts.map(x=>'<option value="'+e(x)+'">'+e(x)+'</option>').join('');const fields=roleField('title','Nombre de la plaza',true)+'<label>Departamento<select name="area" required><option value="">Seleccionar departamento</option>'+options+'</select></label>'+roleField('direct_manager','Jefe directo')+roleField('schedule','Horario')+roleField('work_days','Días de trabajo')+roleField('location','Lugar de trabajo')+'<label>Modalidad<select name="modality"><option>Presencial</option><option>Híbrida</option><option>Remota</option></select></label><label>Tipo de contratación<select name="employment_type"><option>Tiempo completo</option><option>Tiempo parcial</option><option>Por proyecto</option></select></label>'+roleField('compensation','Remuneración')+'<label>Estado<select name="status"><option value="review">En revisión</option><option value="active">Activa</option><option value="inactive">Inactiva</option></select></label>'+roleField('description','Descripción de la plaza',false,'textarea',true)+roleField('functions','Funciones y responsabilidades',false,'textarea',true)+roleField('requirements','Requisitos',false,'textarea',true);openPlazasModal('Crear nueva plaza','Completa los datos iniciales. Podrás continuar editando su Modelo Maestro después.',fields,async values=>{if(!values.title.trim()||!values.area)throw Error('Nombre y departamento son obligatorios');const {data,error}=await sb.from('hr_roles').insert({...values,title:values.title.trim(),area:values.area.trim(),department_id:departmentRows.find(d=>d.name===values.area)?.id||null,work_content:newRoleMasterWorkContent(),automatic_replies:newRoleMasterAutomaticReplies()}).select().single();if(error)throw error;roles.push(data);renderDepartmentFilter();renderKpis();renderRoles();openRole(data.id)})}
async function editRole(){const description=prompt('Descripción general',current.description||'');if(description===null)return;const schedule=prompt('Horario',current.schedule||'');if(schedule===null)return;const{data,error}=await sb.from('hr_roles').update({description,schedule,updated_at:new Date().toISOString()}).eq('id',current.id).select().single();if(error)return alert(error.message);roles=roles.map(x=>x.id===data.id?data:x);current=data;openRole(data.id)}async function newCycle(){const title=prompt('Título de la convocatoria',current.title+' · '+new Date().getFullYear());if(!title)return;const snap={title:current.title,area:current.area,direct_manager:current.direct_manager,description:current.description,functions:current.functions,requirements:current.requirements,schedule:current.schedule,modality:current.modality,employment_type:current.employment_type,compensation:current.compensation,location:current.location};const{data,error}=await sb.from('hr_recruitment_cycles').insert({role_id:current.id,title:title.trim(),status:'draft',role_snapshot:snap}).select().single();if(error)return alert(error.message);cycles.unshift(data);openRole(current.id)}CartelLoad.run("boot",boot);</script></body></html>
