<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFDA03"><title>Contratación · Cartel Gestión</title><link rel="apple-touch-icon" href="/api/rrhh-icon?v=3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>:root{--y:#FFDA03;--bg:#0a0a0a;--card:#151515;--line:#2d2d2d;--muted:#9a9a9a;--green:#91e7b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 18px 80px}.brand{font-size:12px;font-weight:950;letter-spacing:.08em;color:var(--y)}header{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}h1{font-size:36px;margin:7px 0 4px}.muted{color:var(--muted);line-height:1.45}.btn{border:1px solid #333;border-radius:12px;padding:12px 14px;background:#222;color:#fff;font-weight:850;text-decoration:none;cursor:pointer}.primary{background:var(--y);color:#080808;border-color:var(--y)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px}.stat{padding:17px}.stat b{display:block;font-size:29px}.stat span{font-size:12px;color:var(--muted)}.cards{display:grid;gap:12px}.card{padding:18px}.top{display:flex;justify-content:space-between;gap:14px}.name{font-size:21px;font-weight:900}.pill{display:inline-flex;background:#123026;color:var(--green);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850;white-space:nowrap}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#222;padding:7px 9px;border-radius:9px;font-size:12px;color:#ddd}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.step{border:1px solid #303030;border-radius:11px;padding:10px;font-size:12px;color:#aaa}.step:first-child{border-color:#7d6c00;color:var(--y);background:#201d08}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty{padding:34px;text-align:center;color:#999}.panel{padding:18px}@media(max-width:700px){header{display:block}header .btn{display:inline-block;margin-top:15px}.stats{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}h1{font-size:30px}}</style><style id="cartel-light">:root{--y:#FFDA03;--bg:#fafaf8;--card:#fff;--line:#e8e8e8;--muted:#777;--green:#26773c}body{background:var(--bg);color:#111}.stat,.card,.panel{background:#fff;border-color:var(--line)}.btn{background:#f3f3f1;color:#111;border-color:#ddd}.btn.primary{background:var(--y);color:#111;border-color:var(--y)}.pill{background:#e9f7ee;color:#26773c}.chip{background:#f4f4f1;color:#444}.step{border-color:#e4e4e4;color:#777;background:#fff}.step:first-child{border-color:#d0b900;color:#6f5e00;background:#fffbea}.muted{color:#777}.trialbox{display:none;margin-top:14px;padding:15px;border:1px solid #e4e4e4;border-radius:14px;background:#fafaf8}.trialgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.trialbox label{display:block;font-size:12px;font-weight:800;margin:9px 0 5px}.trialbox input,.trialbox select,.trialbox textarea{width:100%;padding:11px;border:1px solid #d8d8d8;border-radius:10px;background:#fff;color:#111;font:inherit}.trialbox textarea{min-height:75px}.pill.trial{background:#fff4c2;color:#725d00}@media(max-width:700px){.trialgrid{grid-template-columns:1fr}}</style><style id="mobile-embedded-fix">@media(max-width:700px){html,body{width:100%;max-width:100%;overflow-x:hidden}.wrap{width:100%;max-width:100%;margin:0!important;padding:18px 14px 56px!important}h1{font-size:29px!important}.head,.top,header{max-width:100%}.cards,.card,.panel{max-width:100%;min-width:0}.grid,.info-grid,.hiring-grid,.master-edit{grid-template-columns:minmax(0,1fr)!important}.tabs{max-width:100%;overflow-x:auto;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch}.tab{flex:0 0 auto;white-space:nowrap}.flow{max-width:100%;overflow-x:auto}.doc-row,.row{min-width:0}.doc-row b,.row b{overflow-wrap:anywhere}}</style></head>
<body><div class="wrap"><header><div><div class="brand">CARTEL GESTIÓN · RRHH</div><h1>Contratación</h1><div class="muted">Segunda etapa · candidatos seleccionados después de la entrevista</div></div><a class="btn" href="/rrhh-inicio.html">← Recursos Humanos</a></header>
<div class="stats"><div class="stat"><b id="total">0</b><span>Seleccionados</span></div><div class="stat"><b id="inProcess">0</b><span>En período de prueba</span></div><div class="stat"><b id="hired">0</b><span>Contratados</span></div></div>
<div class="panel"><div class="brand">CANDIDATOS EN SEGUNDA ETAPA</div><div id="cards" class="cards" style="margin-top:14px"><div class="empty">Cargando…</div></div></div></div>
<script>const U='https://jhumvctocphyiwhszeaz.supabase.co',K='sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn',MAIL='cartelstudiocuba@gmail.com';const sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});let candidates=[],answers=[];const e=s=>String(s??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function amap(id){const o={};answers.filter(a=>a.candidate_id===id).forEach(a=>o[a.question_key]=a.answer);return o}function phone(x){return String(x.whatsapp||'').replace(/\D/g,'')}function wa(p,m){window.open('https://wa.me/'+p+'?text='+encodeURIComponent(m),'_blank')}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session||String(session.user.email||'').toLowerCase()!==MAIL){location.href='/rrhh.html';return}const[c,a]=await Promise.all([sb.from('hr_candidates').select('*').in('status',['selected','hired']).order('decision_updated_at',{ascending:false}),sb.from('hr_candidate_answers').select('*')]);if(c.error){cards.innerHTML='<div class="empty">Error: '+e(c.error.message)+'</div>';return}candidates=c.data||[];answers=a.data||[];render()}function isTrial(x){return x.status==='selected'&&x.decision_status==='trial'}function render(){total.textContent=candidates.filter(x=>x.status==='selected'&&!isTrial(x)).length;inProcess.textContent=candidates.filter(isTrial).length;hired.textContent=candidates.filter(x=>x.status==='hired').length;cards.innerHTML=candidates.map(x=>{const a=amap(x.id),trial=isTrial(x),label=x.status==='hired'?'Contratado':trial?'En período de prueba':'Seleccionado';return '<div class="card"><div class="top"><div><div class="name">'+e(x.full_name)+'</div><div class="muted">'+e(x.whatsapp)+' · '+e(x.municipality||'Zona no indicada')+'</div></div><span class="pill '+(trial?'trial':'')+'">'+label+'</span></div><div class="meta"><span class="chip">Plaza: '+e(x.profiled_target_role||'Asistente Personal / Ejecutivo')+'</span><span class="chip">Edad: '+e(a.age)+'</span><span class="chip">Estudios: '+e(a.education_level)+'</span><span class="chip">Inicio: '+e(x.start_availability||a.start_availability)+'</span>'+(trial?'<span class="chip">'+e(x.decision_note||'Período de prueba activo')+'</span>':'')+'</div><div class="steps"><div class="step">1 · Selección</div><div class="step">2 · Período de prueba</div><div class="step">3 · Evaluación</div><div class="step">4 · Contratación</div></div><div class="actions">'+(x.status==='selected'&&!trial?'<button class="btn primary" onclick="toggleTrial(\''+x.id+'\')">Iniciar período de prueba</button>':'')+(trial?'<button class="btn primary" onclick="markHired(\''+x.id+'\')">✓ Aprobar prueba y contratar</button>':'')+'<a class="btn" href="/rrhh.html">Abrir ficha completa</a></div>'+(x.status==='selected'&&!trial?'<div class="trialbox" id="trial-'+x.id+'"><div class="brand">PROPUESTA DE PERÍODO DE PRUEBA</div><div class="trialgrid"><div><label>Cantidad</label><input id="qty-'+x.id+'" type="number" min="1" value="1"></div><div><label>Unidad</label><select id="unit-'+x.id+'"><option value="semana">Semana(s)</option><option value="día">Día(s)</option><option value="mes">Mes(es)</option></select></div><div><label>Pago</label><input id="pay-'+x.id+'" placeholder="Ej. 5 000 CUP"></div></div><label>Condición / nota adicional</label><textarea id="note-'+x.id+'" placeholder="Opcional"></textarea><button class="btn primary" style="margin-top:10px" onclick="sendTrial(\''+x.id+'\')">Enviar propuesta por WhatsApp y pasar a prueba</button></div>':'')+'</div>'}).join('')||'<div class="empty">Todavía no hay candidatos en esta etapa.</div>'}function toggleTrial(id){const el=document.getElementById('trial-'+id);el.style.display=el.style.display==='block'?'none':'block'}async function sendTrial(id){const x=candidates.find(v=>v.id===id),p=phone(x),qty=document.getElementById('qty-'+id).value,unit=document.getElementById('unit-'+id).value,pay=document.getElementById('pay-'+id).value.trim(),note=document.getElementById('note-'+id).value.trim();if(!qty||Number(qty)<1)return alert('Indica la duración del período de prueba.');if(!pay)return alert('Indica el pago correspondiente al período de prueba.');if(!p)return alert('El candidato no tiene un teléfono válido.');const first=String(x.full_name||'').trim().split(/\s+/)[0]||x.full_name,duration=qty+' '+unit+(Number(qty)>1?'s':''),msg='Hola, '+first+'. Gracias por participar en nuestro proceso de selección. Después de la entrevista, nos gustaría continuar contigo mediante un período de prueba de '+duration+', con un pago de '+pay+'.'+(note?' '+note:'')+' Esta etapa nos permitirá evaluar la adaptación a las funciones de la plaza y que tú también puedas conocer mejor la dinámica de trabajo. Si estás de acuerdo con realizar este período de prueba bajo estas condiciones, por favor confírmanos por esta misma vía para coordinar el inicio.';const now=new Date().toISOString(),summary='Prueba: '+duration+' · Pago: '+pay+(note?' · '+note:'');const{error}=await sb.from('hr_candidates').update({decision_status:'trial',decision_note:summary,decision_updated_at:now}).eq('id',id);if(error)return alert(error.message);x.decision_status='trial';x.decision_note=summary;x.decision_updated_at=now;render();wa(p,msg)}async function markHired(id){if(!confirm('¿Confirmar que el candidato aprobó el período de prueba y pasa a contratado?'))return;const now=new Date().toISOString();const{error}=await sb.from('hr_candidates').update({status:'hired',decision_status:'hired',decision_updated_at:now}).eq('id',id);if(error)return alert(error.message);const x=candidates.find(v=>v.id===id);x.status='hired';x.decision_status='hired';render()}boot();</script></body></html>
