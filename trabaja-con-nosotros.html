<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trabaja con nosotros · El Cartel Studio</title><style>:root{--y:#FFDA03;--bg:#090909;--card:#151515;--line:#292929;--muted:#9a9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}main{max-width:860px;margin:auto;padding:32px 18px 70px}.brand{font-weight:950;color:var(--y);letter-spacing:.04em}.hero{padding:42px 0 24px}.hero h1{font-size:46px;line-height:1;margin:10px 0}.sub{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.job{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column}.job .tag{color:var(--y);font-size:12px;font-weight:900;text-transform:uppercase}.job h2{font-size:25px;margin:9px 0}.facts{color:#ccc;font-size:14px;line-height:1.7;flex:1}.btn{display:block;margin-top:18px;background:var(--y);color:#090909;text-decoration:none;text-align:center;padding:14px;border-radius:13px;font-weight:900}.small{font-size:12px;color:#777;margin-top:28px}.empty{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 22px;text-align:center}.empty h2{margin:0 0 8px}.loading{grid-column:1/-1;color:#999;padding:24px 0}@media(max-width:620px){.hero h1{font-size:37px}.grid{grid-template-columns:1fr}}</style></head><body><main><div class="brand">CARTEL STUDIO</div><section class="hero"><div class="sub">OPORTUNIDADES</div><h1>Trabaja con nosotros</h1><p class="sub">Conoce nuestras convocatorias abiertas y aplica a la plaza que corresponda con tu experiencia e intereses.</p></section><div id="jobs" class="grid"><div class="loading">Cargando convocatorias activas…</div></div><p class="small">Los datos enviados se utilizan exclusivamente para gestionar el proceso de candidatura en El Cartel Studio.</p></main><script>
const SB='https://jhumvctocphyiwhszeaz.supabase.co',KEY='sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cleanLocation(v){return String(v||'').replace(/,\s*La Habana$/i,'')}
async function loadOpenings(){
 const box=document.getElementById('jobs');
 try{
  const res=await fetch(SB+'/rest/v1/rpc/get_hr_active_vacancies_public',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store'});
  if(!res.ok)throw new Error('No se pudieron cargar las convocatorias.');
  const rows=await res.json();
  if(!Array.isArray(rows)||!rows.length){
   box.innerHTML='<section class="empty"><h2>No hay convocatorias activas en este momento</h2><p class="sub">Cuando abramos una nueva plaza aparecerá aquí automáticamente.</p></section>';
   return;
  }
  box.innerHTML=rows.map(v=>'<article class="job"><div class="tag">Convocatoria activa</div><h2>'+esc(v.title||'Plaza disponible')+'</h2><div class="facts">'+
   (v.area?esc(v.area)+'<br>':'')+
   esc(v.modality||'Presencial')+(v.location?' · '+esc(cleanLocation(v.location)):'')+'<br>'+
   esc(v.schedule||'Horario por definir')+'<br>'+
   esc(v.compensation||'Compensación por definir')+
   '</div><a class="btn" href="/aplicar.html?plaza='+encodeURIComponent(v.slug||'')+'">Ver convocatoria y aplicar →</a></article>').join('');
 }catch(e){
  box.innerHTML='<section class="empty"><h2>No pudimos cargar las convocatorias</h2><p class="sub">Inténtalo nuevamente en unos minutos.</p></section>';
 }
}
loadOpenings();
</script></body></html>
