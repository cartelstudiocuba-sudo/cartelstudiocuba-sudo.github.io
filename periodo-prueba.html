<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Período de prueba · El Cartel Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--y:#FFDA03;--line:#e7e7e3;--muted:#70757f}*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#111;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 24px}.brand{color:#d9b900;font-weight:950;letter-spacing:.08em}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.head h1{font-size:42px;margin:8px 0}.back{padding:12px 16px;border:1px solid #ddd;border-radius:12px;color:#111;text-decoration:none;background:#fff;font-weight:800}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:28px 0}.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:12px;font-weight:800}.step b{display:block;font-size:20px;margin-bottom:5px}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:14px}.name{font-size:21px;font-weight:900}.muted{color:var(--muted)}.pill{background:#fff4bd;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850}.empty{padding:40px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;color:#777}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #ddd;border-radius:11px;padding:11px 14px;background:#fff;color:#111;font-weight:850;cursor:pointer}.primary{background:var(--y);border-color:#e0c000}.done{background:#e9f7ee;border-color:#b9ddc2}.field{margin-top:12px}.field input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}@media(max-width:760px){.flow{display:flex;overflow:auto}.step{min-width:150px}.head h1{font-size:32px}}</style><style id="mobile-embedded-fix">@media(max-width:700px){html,body{width:100%;max-width:100%;overflow-x:hidden}.wrap{width:100%;max-width:100%;margin:0!important;padding:18px 14px 56px!important}h1{font-size:29px!important}.head,.top,header{max-width:100%}.cards,.card,.panel{max-width:100%;min-width:0}.grid,.info-grid,.hiring-grid,.master-edit{grid-template-columns:minmax(0,1fr)!important}.tabs{max-width:100%;overflow-x:auto;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch}.tab{flex:0 0 auto;white-space:nowrap}.flow{max-width:100%;overflow-x:auto}.doc-row,.row{min-width:0}.doc-row b,.row b{overflow-wrap:anywhere}}</style></head><body><div class="wrap"><div class="head"><div><div class="brand">CARTEL STUDIO · RRHH</div><h1>Período de prueba</h1><div class="muted">Seguimiento desde el acuerdo hasta la evaluación final.</div></div><a class="back" href="/rrhh-inicio.html">← RRHH</a></div><div class="flow"><div class="step"><b>1</b>Pendiente de acuerdo</div><div class="step"><b>2</b>Acuerdo enviado</div><div class="step"><b>3</b>Acuerdo aceptado</div><div class="step"><b>4</b>En período de prueba</div><div class="step"><b>5</b>Evaluación pendiente</div><div class="step"><b>6</b>Finalizado</div></div><div id="cards" class="cards"><div class="empty">Cargando…</div></div></div><script>const sb=window.supabase.createClient('https://jhumvctocphyiwhszeaz.supabase.co','sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn',{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});const labels={pending_confirmation:'Pendiente de confirmación',pending_agreement:'Pendiente de acuerdo',agreement_sent:'Acuerdo enviado',agreement_accepted:'Acuerdo aceptado',in_trial:'En período de prueba',evaluation_pending:'Evaluación pendiente',completed:'Finalizado'};(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/rrhh.html';return}const{data,error}=await sb.from('hr_trial_periods').select('*,hr_candidates(full_name,whatsapp,municipality)').order('created_at',{ascending:false});if(error){cards.innerHTML='<div class="empty">No se pudo cargar: '+error.message+'</div>';return}cards.innerHTML=(data||[]).map(x=>{const phone=String(x.hr_candidates.whatsapp||'').replace(/\D/g,''),date=x.start_date?new Date(x.start_date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'Por definir';return '<div class="card"><div class="top"><div><div class="name">'+x.hr_candidates.full_name+'</div><div class="muted">'+x.role_title+' · '+(x.duration_days||7)+' días</div></div><span class="pill">'+(labels[x.stage]||x.stage)+'</span></div><p><b>Inicio:</b> '+date+' &nbsp; · &nbsp; <b>Remuneración:</b> '+(x.compensation||'Por definir')+'</p><div class="muted">'+(x.schedule||'Horario por definir')+(x.location?' · '+x.location:'')+'</div>'+(x.stage==='pending_confirmation'?'<div class="actions"><button class="btn primary" onclick="confirmCandidate(\''+x.id+'\')">✓ Candidato confirmó</button></div>':'')+(x.stage==='pending_agreement'?'<div class="field"><input id="url-'+x.id+'" placeholder="Enlace al PDF del acuerdo" value="'+(x.agreement_url||'')+'"></div><div class="actions"><button class="btn primary" onclick="sendAgreement(\''+x.id+'\')">📄 Enviar acuerdo por WhatsApp</button></div>':'')+(x.stage==='agreement_sent'?'<div class="actions"><button class="btn done" onclick="markReceived(\''+x.id+'\')">✓ Acuerdo recibido y firmado</button></div>':'')+(['agreement_accepted','in_trial','evaluation_pending','completed'].includes(x.stage)?'<div class="actions"><button class="btn primary" onclick="hireCandidate(\''+x.id+'\')">✓ Contratar</button><button class="btn" onclick="closeTrial(\''+x.id+'\',\'talent_pool\')">Cantera</button><button class="btn" onclick="closeTrial(\''+x.id+'\',\'not_selected\')">No seleccionado</button></div>':'')+'</div>'}).join('')||'<div class="empty">Todavía no hay candidatos en período de prueba.</div>'})();async function reload(){location.reload()}async function confirmCandidate(id){const{error}=await sb.from('hr_trial_periods').update({stage:'pending_agreement',updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);reload()}async function sendAgreement(id){const x=(await sb.from('hr_trial_periods').select('*,hr_candidates(full_name,whatsapp)').eq('id',id).single()).data;if(!x)return;const url=document.getElementById('url-'+id).value.trim();if(!url)return alert('Pega primero el enlace al PDF del acuerdo.');const phone=String(x.hr_candidates.whatsapp||'').replace(/\D/g,''),first=String(x.hr_candidates.full_name||'').trim().split(/\s+/)[0],date=x.start_date?new Date(x.start_date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'';const msg='Perfecto, '+first+'. Queda confirmada tu participación en el período de prueba para la plaza de '+x.role_title+'.\n\nTe enviamos el Acuerdo de Período de Prueba y Confidencialidad, donde aparecen las condiciones de esta etapa y las obligaciones de confidencialidad correspondientes.\n\n📄 '+url+'\n\nPor favor, descarga e imprime el documento, léelo detenidamente y tráelo firmado el '+date+', día en que comienza tu período de prueba. La entrega del documento firmado será necesaria antes de iniciar las actividades previstas.\n\nSi tienes alguna duda sobre alguna condición, puedes consultarnos antes de firmarlo.';const{error}=await sb.from('hr_trial_periods').update({stage:'agreement_sent',agreement_url:url,agreement_sent_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');setTimeout(reload,700)}async function markReceived(id){const now=new Date().toISOString();const{error}=await sb.from('hr_trial_periods').update({stage:'agreement_accepted',agreement_received_at:now,agreement_accepted_at:now,updated_at:now}).eq('id',id);if(error)return alert(error.message);reload()}async function hireCandidate(id){if(!confirm('¿Confirmar contratación y crear la ficha de trabajador?'))return;const{data:t,error:te}=await sb.from('hr_trial_periods').select('*,hr_candidates(*)').eq('id',id).single();if(te||!t)return alert(te?.message||'No se encontró el período de prueba.');const cand=t.hr_candidates;let roleId=null;if(t.vacancy_id){const{data:v}=await sb.from('hr_vacancies').select('recruitment_cycle_id').eq('id',t.vacancy_id).maybeSingle();if(v?.recruitment_cycle_id){const{data:cy}=await sb.from('hr_recruitment_cycles').select('role_id').eq('id',v.recruitment_cycle_id).maybeSingle();roleId=cy?.role_id||null}}const now=new Date().toISOString();const{error:ee}=await sb.from('hr_employees').upsert({candidate_id:cand.id,role_id:roleId,vacancy_id:t.vacancy_id||cand.vacancy_id||null,full_name:cand.full_name,email:cand.email||null,whatsapp:cand.whatsapp||null,role_title:t.role_title||cand.profiled_target_role||null,status:'active',hired_at:now,updated_at:now},{onConflict:'candidate_id'});if(ee)return alert(ee.message);const{error:ce}=await sb.from('hr_candidates').update({status:'hired',decision_status:'hired',decision_updated_at:now}).eq('id',cand.id);if(ce)return alert(ce.message);await sb.from('hr_trial_periods').update({stage:'completed',completed_at:now,updated_at:now}).eq('id',id);alert('Trabajador contratado. Su ficha ya está disponible en Contratados.');reload()}async function closeTrial(id,status){const label=status==='talent_pool'?'Cantera':'No seleccionado';if(!confirm('¿Mover este candidato a '+label+'?'))return;const{data:t}=await sb.from('hr_trial_periods').select('candidate_id').eq('id',id).single();if(!t)return;const now=new Date().toISOString();const{error}=await sb.from('hr_candidates').update({status,decision_status:status,decision_updated_at:now}).eq('id',t.candidate_id);if(error)return alert(error.message);await sb.from('hr_trial_periods').update({stage:'completed',completed_at:now,updated_at:now}).eq('id',id);reload()}</script></body></html>
