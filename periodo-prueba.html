-box{margin-top:18px;padding:17px;border-radius:17px;border:1px solid #718198;background:linear-gradient(120deg,#273b48,#1d2b37)}.decision-box>strong{display:block;color:#ffda03;font-size:16px;margin-bottom:7px}.decision-box>small{color:#c7d6e5;display:block;margin-bottom:13px}.decision-box .actions{margin-top:0}.decision-box .btn{flex:1;min-width:145px}.decision-box .btn.danger{background:linear-gradient(135deg,#aa5962,#653d4b);border-color:#d08891}.decision-box .btn.pool{background:linear-gradient(135deg,#7388b4,#485b83)}@media(max-width:760px){.head{padding:18px}.decision-box .btn{min-width:100%}}</style></head><body><div class="wrap"><div class="head"><div><div class="brand">CARTEL STUDIO · RRHH</div><h1>Período de prueba</h1><div class="muted">Seguimiento desde el acuerdo hasta la evaluación final.</div></div><a class="back" href="/rrhh-inicio.html">← RRHH</a></div><div class="flow"><div class="step"><b>1</b>Pendiente de acuerdo</div><div class="step"><b>2</b>Acuerdo enviado</div><div class="step"><b>3</b>Acuerdo aceptado</div><div class="step"><b>4</b>En período de prueba</div><div class="step"><b>5</b>Evaluación pendiente</div><div class="step"><b>6</b>Finalizado</div></div><div id="cards" class="cards"><div class="empty">Cargando…</div></div></div><script>const sb=CartelLoad.createClient('https://jhumvctocphyiwhszeaz.supabase.co','sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn',{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}});const labels={pending_confirmation:'Pendiente de confirmación',pending_agreement:'Pendiente de acuerdo',agreement_sent:'Acuerdo enviado',agreement_accepted:'Acuerdo aceptado',in_trial:'En período de prueba',evaluation_pending:'Evaluación pendiente',completed:'Finalizado'};CartelLoad.run("initialization",async()=>{const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/rrhh.html';return}const{data,error}=await sb.from('hr_trial_periods').select('*,hr_candidates(full_name,whatsapp,municipality)').order('created_at',{ascending:false});if(error){cards.innerHTML='<div class="empty">No se pudo cargar: '+error.message+'</div>';return}cards.innerHTML=(data||[]).map(x=>{const phone=String(x.hr_candidates.whatsapp||'').replace(/\D/g,''),date=x.start_date?new Date(x.start_date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'Por definir';return '<div class="card"><div class="top"><div><div class="name">'+x.hr_candidates.full_name+'</div><div class="muted">'+x.role_title+' · '+(x.duration_days||7)+' días</div></div><span class="pill">'+(labels[x.stage]||x.stage)+'</span></div><p><b>Inicio:</b> '+date+' &nbsp; · &nbsp; <b>Remuneración:</b> '+(x.compensation||'Por definir')+'</p><div class="muted">'+(x.schedule||'Horario por definir')+(x.location?' · '+x.location:'')+'</div>'+(x.stage==='pending_confirmation'?'<div class="actions"><button class="btn primary" onclick="confirmCandidate(\''+x.id+'\')">✓ Candidato confirmó</button></div>':'')+(x.stage==='pending_agreement'?'<div class="field"><input id="url-'+x.id+'" placeholder="Enlace al PDF del acuerdo" value="'+(x.agreement_url||'')+'"></div><div class="actions"><button class="btn primary" onclick="sendAgreement(\''+x.id+'\')">📄 Enviar acuerdo por WhatsApp</button></div>':'')+(x.stage==='agreement_sent'?'<div class="actions"><button class="btn done" onclick="markReceived(\''+x.id+'\')">✓ Acuerdo recibido y firmado</button></div>':'')+(['in_trial','evaluation_pending'].includes(x.stage)?'<div class="decision-box"><strong>Decisión final del período de prueba</strong><small>Selecciona el resultado de la evaluación. Contratar crea o actualiza el expediente laboral.</small><div class="actions"><button class="btn primary" onclick="hireCandidate(\\''+x.id+'\\')">✓ Aprobar y contratar</button><button class="btn pool" onclick="closeTrial(\\''+x.id+'\\',\\'talent_pool\\')">Guardar en cantera</button><button class="btn danger" onclick="closeTrial(\\''+x.id+'\\',\\'not_selected\\')">No contratar</button></div></div>':'')+'</div>'}).join('')||'<div class="empty">Todavía no hay candidatos en período de prueba.</div>'});async function reload(){location.reload()}async function confirmCandidate(id){const{error}=await sb.from('hr_trial_periods').update({stage:'pending_agreement',updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);reload()}async function sendAgreement(id){const x=(await sb.from('hr_trial_periods').select('*,hr_candidates(full_name,whatsapp)').eq('id',id).single()).data;if(!x)return;const url=document.getElementById('url-'+id).value.trim();if(!url)return alert('Pega primero el enlace al PDF del acuerdo.');const phone=String(x.hr_candidates.whatsapp||'').replace(/\D/g,''),first=String(x.hr_candidates.full_name||'').trim().split(/\s+/)[0],date=x.start_date?new Date(x.start_date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'';const msg='Perfecto, '+first+'. Queda confirmada tu participación en el período de prueba para la plaza de '+x.role_title+'.\n\nTe enviamos el Acuerdo de Período de Prueba y Confidencialidad, donde aparecen las condiciones de esta etapa y las obligaciones de confidencialidad correspondientes.\n\n📄 '+url+'\n\nPor favor, descarga e imprime el documento, léelo detenidamente y tráelo firmado el '+date+', día en que comienza tu período de prueba. La entrega del documento firmado será necesaria antes de iniciar las actividades previstas.\n\nSi tienes alguna duda sobre alguna condición, puedes consultarnos antes de firmarlo.';const{error}=await sb.from('hr_trial_periods').update({stage:'agreement_sent',agreement_url:url,agreement_sent_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');setTimeout(reload,700)}async function markReceived(id){const now=new Date().toISOString();const{error}=await sb.from('hr_trial_periods').update({stage:'agreement_accepted',agreement_received_at:now,agreement_accepted_at:now,updated_at:now}).eq('id',id);if(error)return alert(error.message);reload()}async function hireCandidate(id){
 if(!confirm('¿Confirmas que terminó y aprobó el período de prueba, que la contratación fue autorizada y que deseas crear el expediente laboral?'))return;
 const {data:t,error:te}=await sb.from('hr_trial_periods').select('*,hr_candidates(*)').eq('id',id).single();
 if(te||!t)return alert(te?.message||'No se encontró el período de prueba.');
 if(!['in_trial','evaluation_pending'].includes(t.stage))return alert('Para contratar, la prueba debe estar en curso o pendiente de evaluación.');
 const cand=t.hr_candidates;if(!cand)return alert('No se encontró el candidato asociado.');
 const {data:existing,error:lookupError}=await sb.from('hr_employees').select('id,status,role_id,vacancy_id,hired_at').eq('candidate_id',cand.id).maybeSingle();
 if(lookupError)return alert('No se pudo comprobar el expediente existente: '+lookupError.message);
 if(cand.status==='hired'&&existing?.status==='active')return alert('Esta persona ya tiene un expediente laboral activo. Consulta Contratados.');
 let roleId=existing?.role_id||null;
 if(t.vacancy_id){const {data:v,error:ve}=await sb.from('hr_vacancies').select('recruitment_cycle_id').eq('id',t.vacancy_id).maybeSingle();if(ve)return alert(ve.message);if(v?.recruitment_cycle_id){const {data:cy,error:ce}=await sb.from('hr_recruitment_cycles').select('role_id').eq('id',v.recruitment_cycle_id).maybeSingle();if(ce)return alert(ce.message);roleId=cy?.role_id||roleId}}
 const now=new Date().toISOString();
 const record={candidate_id:cand.id,role_id:roleId,vacancy_id:t.vacancy_id||cand.vacancy_id||existing?.vacancy_id||null,full_name:cand.full_name,email:cand.email||null,whatsapp:cand.whatsapp||null,role_title:t.role_title||cand.profiled_target_role||null,status:'active',hired_at:existing?.hired_at||now,updated_at:now};
 const {error:ee}=await sb.from('hr_employees').upsert(record,{onConflict:'candidate_id'});
 if(ee)return alert('No se creó el expediente laboral. No se modificó el estado del candidato. '+ee.message);
 const {error:ce}=await sb.from('hr_candidates').update({status:'hired',decision_status:'hired',decision_updated_at:now}).eq('id',cand.id);
 if(ce)return alert('El expediente laboral se guardó, pero no se pudo actualizar el candidato. Requiere revisión antes de continuar: '+ce.message);
 const {error:trialError}=await sb.from('hr_trial_periods').update({stage:'completed',completed_at:now,updated_at:now}).eq('id',id);
 if(trialError)return alert('El expediente y el candidato están actualizados, pero no se pudo cerrar el período de prueba. Requiere revisión: '+trialError.message);
 alert('Contratación registrada. El expediente laboral está disponible en Contratados.');
 location.href='/contratados.html?embedded=1';
}
async function closeTrial(id,status){const label=status==='talent_pool'?'Cantera':'No seleccionado';if(!confirm('¿Mover este candidato a '+label+'?'))return;const{data:t}=await sb.from('hr_trial_periods').select('candidate_id').eq('id',id).single();if(!t)return;const now=new Date().toISOString();const{error}=await sb.from('hr_candidates').update({status,decision_status:status,decision_updated_at:now}).eq('id',t.candidate_id);if(error)return alert(error.message);await sb.from('hr_trial_periods').update({stage:'completed',completed_at:now,updated_at:now}).eq('id',id);reload()}</script></body></html>
