<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Diagnóstico RRHH · El Cartel Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><style>:root{--y:#FFDA03}*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.box{max-width:480px;margin:7vh auto;padding:24px 18px}.card{background:#151515;border:1px solid #2b2b2b;border-radius:20px;padding:22px}.brand{font-size:13px;font-weight:900;color:var(--y)}h1{margin:8px 0 6px}.muted{color:#999;line-height:1.45}.field{margin-top:16px}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;background:#0d0d0d;color:#fff;border:1px solid #363636;border-radius:13px;padding:15px;font-size:16px}button{width:100%;margin-top:18px;border:0;border-radius:13px;padding:14px;background:var(--y);color:#080808;font-size:16px;font-weight:900}.result{display:none;margin-top:16px;padding:14px;border-radius:13px;background:#111;border:1px solid #444;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.ok{border-color:#345f3b}.bad{border-color:#744;color:#ffb1b1}</style></head><body><div class="box"><div class="card"><div class="brand">CARTEL STUDIO · DIAGNÓSTICO</div><h1>Prueba de acceso RRHH</h1><p class="muted">Esta pantalla muestra el error técnico real del inicio de sesión para detectar por qué Firefox se comporta diferente.</p><form id="f"><div class="field"><label>Correo</label><input id="email" type="email" value="cartelstudiocuba@gmail.com" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button id="b">Probar acceso</button></form><div id="r" class="result"></div></div></div><script>const U='https://jhumvctocphyiwhszeaz.supabase.co',K='sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn';const r=document.getElementById('r'),b=document.getElementById('b');function out(ok,text){r.style.display='block';r.className='result '+(ok?'ok':'bad');r.textContent=text}document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Comprobando…';r.style.display='none';try{if(!window.supabase)throw new Error('La librería de Supabase no pudo cargarse. Posible bloqueo de Firefox/extensión.');const sb=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.localStorage}});const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){out(false,'ERROR DE SUPABASE\nmessage: '+error.message+'\nstatus: '+(error.status??'—')+'\ncode: '+(error.code??'—')+'\nname: '+(error.name??'—')+'\n\nNavegador: '+navigator.userAgent);return}if(!data.session){out(false,'SIN SESIÓN\nSupabase no devolvió una sesión después de autenticar.\n\nNavegador: '+navigator.userAgent);return}out(true,'ACCESO CORRECTO\nUsuario autenticado: '+(data.user?.email||email)+'\nSesión creada correctamente en este navegador.\n\nYa puedes abrir /rrhh.html en esta misma pestaña.')}catch(err){out(false,'ERROR DEL NAVEGADOR\nmessage: '+(err?.message||String(err))+'\nname: '+(err?.name||'—')+'\n\nNavegador: '+navigator.userAgent)}finally{b.disabled=false;b.textContent='Probar acceso'}});</script></body></html>
