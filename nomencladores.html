<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nomencladores · RRHH</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--y:#FFDA03;--line:#e7e7e7}*{box-sizing:border-box}body{margin:0;background:#fafaf8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.shell{min-height:100vh;display:grid;grid-template-columns:184px 1fr}aside{background:#151515;color:#fff;padding:24px 12px;display:flex;flex-direction:column}.logo{color:var(--y);font-weight:950;font-size:22px;font-style:italic;padding:4px 10px 28px}.nav{display:grid;gap:6px}.nav a{color:#eee;text-decoration:none;padding:12px;border-radius:10px}.nav a.active{background:var(--y);color:#111;font-weight:850}main{padding:28px;max-width:1400px;width:100%}h1{font-size:38px;margin:5px 0}.muted{color:#777}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tabs button,.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:11px 14px;font-weight:750}.btn.danger{color:#b42318;border-color:#f0c7c3;background:#fff7f6}.btn.danger:hover{background:#ffebe8;border-color:#e9aaa4}.tabs button.active,.btn.primary{background:var(--y);border-color:var(--y)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.row{display:grid;grid-template-columns:122px minmax(280px,1fr) 190px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.row.editing{grid-template-columns:122px minmax(180px,1fr) minmax(280px,2fr) 190px auto}.row.dragging{opacity:.45}.row.drag-over{box-shadow:inset 0 3px 0 var(--y)}.row:last-child{border:0}.row b{font-size:14px}.row small{color:#777}.row-main{min-width:0}.row-description{margin-top:5px;color:#777;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:2.7em}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.order-controls{display:flex;align-items:center;gap:4px;min-width:0;padding-right:4px}.order-handle,.order-btn{border:1px solid #ddd;background:#fff;border-radius:8px;height:32px;min-width:30px;display:grid;place-items:center;font-weight:900;color:#666;cursor:pointer;padding:0 7px}.order-handle{cursor:grab;font-size:16px}.order-handle:active{cursor:grabbing}.order-btn:disabled{opacity:.3;cursor:default}.order-index{font-size:10px;color:#999;font-weight:900;min-width:18px;text-align:center}.inline-edit-input,.inline-edit-textarea,.newbox input,.newbox textarea,.newbox select{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px;font:inherit;background:#fff}.inline-edit-textarea{min-height:110px;resize:none;overflow:hidden}.inline-edit-notes{margin-top:8px;min-height:74px}.row.editing{align-items:start;background:#fafafa;border-radius:12px;padding:12px}.btn.save-inline{background:var(--y);border-color:var(--y)}.newbox{display:none;margin-bottom:14px;gap:9px}.newbox.open{display:grid}.head{display:flex;justify-content:space-between;align-items:end;gap:15px}.global-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 13px;border:1px solid #dfe5e0;border-radius:11px;background:#fff}.global-inline{display:flex;align-items:center;justify-content:flex-end;gap:9px}.global-inline span{font-size:12px;font-weight:850;color:#777;white-space:nowrap}.global-inline.on span{color:#18743a}.global-toggle-copy b{display:block;font-size:13px}.global-toggle-copy small{display:block;color:#777;margin-top:3px}.switch{width:48px;height:28px;border:0;border-radius:999px;background:#cfd3d7;padding:3px;cursor:pointer;position:relative;flex:0 0 auto}.switch:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0002;transition:.18s}.switch.on{background:#20ad57}.switch.on:after{transform:translateX(20px)}.global-pill{display:inline-flex;align-items:center;margin-top:6px;padding:5px 8px;border-radius:999px;background:#e9f8ee;color:#18743a;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{min-height:auto}.nav{grid-template-columns:repeat(2,1fr)}main{padding:18px}.row{grid-template-columns:112px minmax(0,1fr);align-items:start}.row>.global-inline,.row>.actions{grid-column:2}.row>.actions{justify-content:flex-start}.row.editing{grid-template-columns:112px minmax(0,1fr)}.row.editing>div:nth-child(3),.row.editing>.global-inline,.row.editing>.actions{grid-column:2}.head{align-items:start;flex-direction:column}}</style></head><body><div class="shell"><aside><div class="logo">El Cartel Studio</div><div class="nav"><a href="/rrhh-inicio.html">⌂ Inicio</a><a href="/plazas.html">▣ Plazas</a><a href="/rrhh.html">♙ Candidatos</a><a href="/entrevistas.html">◷ Entrevistas</a><a href="/periodo-prueba.html">⚡ Período de prueba</a><a href="/contratacion.html">✓ Contratación</a><a class="active" href="/nomencladores.html">⚙ Nomencladores</a></div></aside><main><div class="head"><div><b>Recursos Humanos</b><h1>Nomencladores</h1><div class="muted">Datos reutilizables y configuraciones del flujo de RRHH.</div></div><button class="btn primary" onclick="toggleNew()">＋ Nuevo valor</button></div><div class="tabs" id="tabs"></div><div class="panel"><div class="newbox" id="newbox"><select id="newcat"></select><input id="newlabel" placeholder="Nombre"><textarea id="newvalue" placeholder="Valor"></textarea><textarea id="newnotes" placeholder="Notas / referencias"></textarea><div id="newGlobalWrap" class="global-toggle-row" style="display:none"><div class="global-toggle-copy"><b>Aplica a todas las plazas</b><small>La política aparecerá automáticamente en todas las plazas.</small></div><button type="button" id="newglobal" class="switch" aria-pressed="false" onclick="toggleGlobalSwitch(this)"></button></div><button class="btn primary" onclick="createItem()">Guardar</button></div><div id="list"></div></div></main></div><script>const sb=window.supabase.createClient('https://jhumvctocphyiwhszeaz.supabase.co','sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn',{auth:{persistSession:true,storage:localStorage}});const cats={informacion_institucional:'Información institucional de la agencia',datos_contractuales_empresa:'Datos contractuales de El Cartel Studio',clausulas_contractuales:'Cláusulas contractuales maestras',sedes:'Sedes y direcciones',contactos:'Contactos',entrevistas:'Entrevistas',respuestas_rapidas:'Respuestas rápidas',formularios:'Formularios',plazas:'Plazas y cargos',estados:'Estados y etapas',horarios:'Horarios',remuneraciones:'Remuneraciones',periodo_prueba:'Período de prueba',contratos:'Contratos y acuerdos',normas_politicas:'Normas y políticas generales de la agencia',regimen_disciplinario:'Régimen disciplinario',parametros_evaluacion:'Parámetros maestros de evaluación'};let data=[],editingId=null,cat=(new URLSearchParams(location.search).get('cat')||'sedes');const $=id=>document.getElementById(id);async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/rrhh.html';return}const r=await sb.from('hr_nomenclators').select('*').order('sort_order').order('label');if(r.error)return alert(r.error.message);data=r.data||[];renderTabs();render()}function renderTabs(){$('tabs').innerHTML=Object.entries(cats).map(([k,v])=>'<button class="'+(k===cat?'active':'')+'" onclick="setCat(\''+k+'\')">'+v+'</button>').join('');$('newcat').innerHTML=Object.entries(cats).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');$('newcat').value=cat;$('newcat').onchange=syncNewGlobal;syncNewGlobal()}function setCat(k){cat=k;editingId=null;history.replaceState(null,'','?cat='+encodeURIComponent(k));renderTabs();syncNewGlobal();render()}function isGlobalCategory(category){return category==='normas_politicas'||category==='informacion_institucional'||category==='regimen_disciplinario'||category==='parametros_evaluacion'}
function categoryItems(){return data.filter(x=>x.category===cat&&x.active).sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.label||'').localeCompare(String(b.label||''),'es'))}
function orderControls(x,index,total){return '<div class="order-controls"><span class="order-index">'+(index+1)+'</span><span class="order-handle" title="Arrastrar para ordenar">⋮⋮</span><button class="order-btn" '+(index===0?'disabled':'')+' onclick="moveItem(\''+x.id+'\',-1)" title="Subir">↑</button><button class="order-btn" '+(index===total-1?'disabled':'')+' onclick="moveItem(\''+x.id+'\',1)" title="Bajar">↓</button></div>'}
function render(){const a=categoryItems();$('list').innerHTML=a.length?a.map((x,index)=>{const globalCat=isGlobalCategory(x.category),on=!!x.applies_to_all_roles,editing=x.id===editingId,order=orderControls(x,index,a.length);if(editing){return '<div class="row editing" data-id="'+x.id+'">'+order+'<div><input id="l-'+x.id+'" class="inline-edit-input" value="'+attr(x.label)+'" placeholder="Nombre"></div><div><textarea id="v-'+x.id+'" class="inline-edit-textarea" placeholder="Descripción" oninput="autoSizeTextarea(this)">'+esc(x.value)+'</textarea>'+(!globalCat?'<textarea id="n-'+x.id+'" class="inline-edit-textarea inline-edit-notes" placeholder="Notas / referencias" oninput="autoSizeTextarea(this)">'+esc(x.notes||'')+'</textarea>':'')+'</div>'+(globalCat?'<div class="global-inline '+(on?'on':'')+'"><span>'+(on?'Todas las plazas':'No global')+'</span><button type="button" class="switch '+(on?'on':'')+'" aria-pressed="'+(on?'true':'false')+'" onclick="toggleGlobalItem(\''+x.id+'\',this)"></button></div>':'<div></div>')+'<div class="actions"><button class="btn" onclick="cancelEdit()">Cancelar</button><button class="btn save-inline" onclick="save(\''+x.id+'\')">Guardar cambios</button><button class="btn danger" onclick="deleteItem(\''+x.id+'\')">Eliminar</button></div></div>'}return '<div class="row" draggable="true" data-id="'+x.id+'" ondragstart="orderDragStart(event)" ondragover="orderDragOver(event)" ondragleave="orderDragLeave(event)" ondrop="orderDrop(event)" ondragend="orderDragEnd(event)">'+order+'<div class="row-main"><b>'+esc(x.label)+'</b><div class="row-description">'+esc(x.value||'')+'</div></div>'+(globalCat?'<div class="global-inline '+(on?'on':'')+'"><span>'+(on?'Todas las plazas':'No global')+'</span><button type="button" class="switch '+(on?'on':'')+'" aria-pressed="'+(on?'true':'false')+'" onclick="toggleGlobalItem(\''+x.id+'\',this)"></button></div>':'<div></div>')+'<div class="actions"><button class="btn" onclick="startEdit(\''+x.id+'\')">Editar</button><button class="btn danger" onclick="deleteItem(\''+x.id+'\')">Eliminar</button></div></div>'}).join(''):'<div class="muted">Todavía no hay valores en este nomenclador.</div>';requestAnimationFrame(()=>document.querySelectorAll('.inline-edit-textarea').forEach(autoSizeTextarea))}
let draggedOrderId=null;
async function persistOrder(items){const updates=items.map((x,i)=>({id:x.id,sort_order:(i+1)*10}));const results=await Promise.all(updates.map(u=>sb.from('hr_nomenclators').update({sort_order:u.sort_order,updated_at:new Date().toISOString()}).eq('id',u.id)));const failed=results.find(r=>r.error);if(failed?.error){alert('No se pudo guardar el orden: '+failed.error.message);await boot();return false}const orderMap=new Map(updates.map(u=>[u.id,u.sort_order]));data=data.map(x=>orderMap.has(x.id)?{...x,sort_order:orderMap.get(x.id)}:x);return true}
async function moveItem(id,delta){const items=categoryItems(),from=items.findIndex(x=>x.id===id),to=from+delta;if(from<0||to<0||to>=items.length)return;[items[from],items[to]]=[items[to],items[from]];if(await persistOrder(items))render()}
function orderDragStart(ev){const row=ev.currentTarget;draggedOrderId=row.dataset.id;row.classList.add('dragging');ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',draggedOrderId)}
function orderDragOver(ev){ev.preventDefault();const row=ev.currentTarget;if(row.dataset.id!==draggedOrderId)row.classList.add('drag-over');ev.dataTransfer.dropEffect='move'}
function orderDragLeave(ev){ev.currentTarget.classList.remove('drag-over')}
async function orderDrop(ev){ev.preventDefault();const target=ev.currentTarget;target.classList.remove('drag-over');const targetId=target.dataset.id,sourceId=draggedOrderId||ev.dataTransfer.getData('text/plain');if(!sourceId||sourceId===targetId)return;const items=categoryItems(),from=items.findIndex(x=>x.id===sourceId),to=items.findIndex(x=>x.id===targetId);if(from<0||to<0)return;const [moved]=items.splice(from,1);items.splice(to,0,moved);if(await persistOrder(items))render()}
function orderDragEnd(){document.querySelectorAll('.row').forEach(r=>r.classList.remove('dragging','drag-over'));draggedOrderId=null}
function autoSizeTextarea(el){if(!el)return;el.style.height='auto';el.style.height=el.scrollHeight+'px'}
function toggleGlobalSwitch(btn){btn.classList.toggle('on');btn.setAttribute('aria-pressed',btn.classList.contains('on')?'true':'false')}function syncNewGlobal(){const w=$('newGlobalWrap'),notes=$('newnotes');if(!w)return;const category=$('newcat').value,globalCat=isGlobalCategory(category);w.style.display=globalCat?'flex':'none';if(notes)notes.style.display=globalCat?'none':'block';const copy=w.querySelector('small');if(copy)copy.textContent=category==='informacion_institucional'?'Este bloque aparecerá automáticamente en todas las plazas.':(category==='regimen_disciplinario'?'Esta medida aparecerá automáticamente en todas las plazas.':(category==='parametros_evaluacion'?'Este parámetro se incluirá automáticamente en la matriz de evaluación de todas las plazas.':'La política aparecerá automáticamente en todas las plazas.'))}function startEdit(id){editingId=id;render()}function cancelEdit(){editingId=null;render()}function toggleNew(){$('newbox').classList.toggle('open');$('newcat').value=cat;syncNewGlobal()}async function toggleGlobalItem(id,btn){const item=data.find(x=>x.id===id);if(!item||!isGlobalCategory(item.category))return;const next=!item.applies_to_all_roles;btn.disabled=true;const r=await sb.from('hr_nomenclators').update({applies_to_all_roles:next,updated_at:new Date().toISOString()}).eq('id',id).select().single();btn.disabled=false;if(r.error)return alert(r.error.message);data=data.map(x=>x.id===id?r.data:x);render()}
async function save(id){const item=data.find(x=>x.id===id),patch={label:$('l-'+id).value.trim(),value:$('v-'+id).value.trim(),updated_at:new Date().toISOString()};if(!isGlobalCategory(item?.category))patch.notes=$('n-'+id).value.trim();const r=await sb.from('hr_nomenclators').update(patch).eq('id',id).select().single();if(r.error)return alert(r.error.message);data=data.map(x=>x.id===id?r.data:x);editingId=null;render()}
async function deleteItem(id){const item=data.find(x=>x.id===id);if(!item)return;const ok=confirm('¿Eliminar “'+(item.label||'este valor')+'”? Dejará de mostrarse en el nomenclador y en las plazas donde estuviera aplicado.');if(!ok)return;const r=await sb.from('hr_nomenclators').update({active:false,updated_at:new Date().toISOString()}).eq('id',id).select().single();if(r.error)return alert('No se pudo eliminar: '+r.error.message);data=data.map(x=>x.id===id?r.data:x);if(editingId===id)editingId=null;render()}
async function createItem(){const category=$('newcat').value,label=$('newlabel').value.trim(),value=$('newvalue').value.trim(),notes=$('newnotes').value.trim(),applies_to_all_roles=isGlobalCategory(category)&&$('newglobal').classList.contains('on');if(!label)return alert('Escribe un nombre.');const key=(label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now()),same=data.filter(x=>x.category===category&&x.active),sort_order=(same.length?Math.max(...same.map(x=>Number(x.sort_order)||0)):0)+10;const r=await sb.from('hr_nomenclators').insert({category,key,label,value,notes,applies_to_all_roles,sort_order}).select().single();if(r.error)return alert(r.error.message);data.push(r.data);cat=category;$('newlabel').value=$('newvalue').value=$('newnotes').value='';$('newglobal').classList.remove('on');$('newglobal').setAttribute('aria-pressed','false');$('newbox').classList.remove('open');renderTabs();render()}function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function attr(s){return esc(s).replace(/'/g,'&#39;')}boot()</script></body></html>
