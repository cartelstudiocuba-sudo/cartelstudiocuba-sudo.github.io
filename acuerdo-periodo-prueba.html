<h2>9. DINERO, GASTOS Y CONFLICTOS DE INTERÉS</h2><p>No podrá utilizar fondos de El Cartel Studio sin autorización. Todo recurso recibido para una gestión deberá destinarse al fin indicado y justificarse. No podrá solicitar o recibir comisiones, pagos, favores o beneficios personales derivados de gestiones realizadas en nombre de El Cartel Studio y deberá informar posibles conflictos de interés.</p>

<h2>11. CONFIDENCIALIDAD POSTERIOR</h2><p>Las obligaciones respecto de información que conserve carácter confidencial continuarán después de finalizar esta etapa, independientemente de que exista o no una relación posterior.</p>
