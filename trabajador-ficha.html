<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expediente del trabajador · Cartel Gestión</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--y:#FFDA03;--line:#e7e7e4;--muted:#777}*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#111;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{padding:28px 32px 70px}.back{color:#555;text-decoration:none;font-weight:850}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px}.hero{margin-top:18px}.hero h1{margin:4px 0;font-size:32px}.muted{color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tab{border:0;background:#eee;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.tab.active{background:var(--y)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{background:#f6f6f3;border:1px solid #ecece8;border-radius:11px;padding:12px}.item small{display:block;color:#777;margin-bottom:5px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.badge{background:#f1f1ee;border-radius:999px;padding:5px 8px;font-size:11px}.security{background:#fff8d8;border:1px solid #f0df7b;border-radius:12px;padding:12px;margin-top:12px;font-size:12px}.empty{color:#888;padding:12px 0}@media(max-width:700px){.wrap{padding:20px 16px}.grid{grid-template-columns:1fr}}</style><style id="mobile-embedded-fix">@media(max-width:700px){html,body{width:100%;max-width:100%;overflow-x:hidden}.wrap{width:100%;max-width:100%;margin:0!important;padding:18px 14px 56px!important}h1{font-size:29px!important}.head,.top,header{max-width:100%}.cards,.card,.panel{max-width:100%;min-width:0}.grid,.info-grid,.hiring-grid,.master-edit{grid-template-columns:minmax(0,1fr)!important}.tabs{max-width:100%;overflow-x:auto;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch}.tab{flex:0 0 auto;white-space:nowrap}.flow{max-width:100%;overflow-x:auto}.doc-row,.row{min-width:0}.doc-row b,.row b{overflow-wrap:anywhere}}</style></head><body><div class="wrap"><a class="back" href="/contratados.html">← Contratados</a><div id="hero" class="hero"></div><div id="tabs" class="tabs"></div><div id="panel" class="panel"></div></div><script>const sb=supabase.createClient('https://jhumvctocphyiwhszeaz.supabase.co','sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn',{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage}}),id=new URLSearchParams(location.search).get('id'),e=s=>String(s??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let emp=null,docs=[],assets=[],access=[],active='Resumen';const tabNames=['Resumen','Contratación','Documentación','Medios','Transporte','Accesos y sistema','Historial'];async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.href='/rrhh.html';const[a,b,c,d]=await Promise.all([sb.from('hr_employees').select('*').eq('id',id).single(),sb.from('hr_employee_documents').select('*').eq('employee_id',id).order('created_at',{ascending:false}),sb.from('hr_employee_assets').select('*').eq('employee_id',id).order('assigned_at',{ascending:false}),sb.from('hr_employee_access').select('*').eq('employee_id',id).order('created_at',{ascending:false})]);if(a.error)return panel.innerHTML='No se encontró el trabajador.';emp=a.data;docs=b.data||[];assets=c.data||[];access=d.data||[];render()}function render(){hero.innerHTML='<div class="muted">'+e(emp.role_title||'Trabajador')+'</div><h1>'+e(emp.full_name)+'</h1><div class="muted">Expediente digital · Contratado '+new Date(emp.hired_at).toLocaleDateString('es-ES')+'</div>';tabs.innerHTML=tabNames.map(t=>'<button class="tab '+(t===active?'active':'')+'" onclick="active=\''+t+'\';render()">'+t+'</button>').join('');if(active==='Resumen')panel.innerHTML='<h2>Ficha del trabajador</h2><div class="grid"><div class="item"><small>Plaza</small><b>'+e(emp.role_title)+'</b></div><div class="item"><small>Correo</small><b>'+e(emp.email)+'</b></div><div class="item"><small>WhatsApp</small><b>'+e(emp.whatsapp)+'</b></div><div class="item"><small>Estado</small><b>'+e(emp.status)+'</b></div></div>';else if(active==='Accesos y sistema')renderAccess();else if(active==='Documentación')renderDocs();else if(active==='Medios'||active==='Transporte')renderAssets(active);else if(active==='Contratación')panel.innerHTML='<h2>Proceso de contratación</h2><div class="muted">Esta sección conservará el vínculo con el expediente original del candidato, entrevista y período de prueba.</div>';else panel.innerHTML='<h2>Historial</h2><div class="muted">Preparado para registrar cambios de plaza, contratos, asignaciones, incidencias y movimientos laborales.</div>'}function renderAccess(){panel.innerHTML='<h2>Accesos y sistema</h2><div class="grid"><div class="item"><small>Usuario / login</small><b>'+e(emp.system_username||emp.email||'Sin asignar')+'</b></div><div class="item"><small>Roles dentro del sistema</small><b>'+e(Array.isArray(emp.system_roles)&&emp.system_roles.length?emp.system_roles.join(', '):'Sin roles asignados')+'</b></div><div class="item"><small>Cuenta vinculada</small><b>'+(emp.system_auth_user_id?'Sí':'Pendiente')+'</b></div></div><div class="security"><b>Contraseña:</b> no se almacena ni se muestra en el expediente. La autenticación debe gestionarse de forma segura mediante la cuenta del sistema y recuperación/restablecimiento de contraseña.</div><h3>Otros accesos</h3>'+(access.length?access.map(x=>'<div class="row"><div><b>'+e(x.service)+'</b><div class="muted">'+e(x.username)+'</div></div><span class="badge">'+e(x.role_name||x.status)+'</span></div>').join(''):'<div class="empty">No hay accesos adicionales registrados.</div>')}function renderDocs(){panel.innerHTML='<h2>Documentación digital</h2>'+(docs.length?docs.map(x=>'<div class="row"><div><b>'+e(x.title)+'</b><div class="muted">'+e(x.category)+'</div></div><span class="badge">Documento</span></div>').join(''):'<div class="empty">Todavía no hay documentos adjuntos.</div>')}function renderAssets(kind){const filtered=assets.filter(x=>kind==='Transporte'?String(x.asset_type).toLowerCase().includes('transporte'):!String(x.asset_type).toLowerCase().includes('transporte'));panel.innerHTML='<h2>'+kind+'</h2>'+(filtered.length?filtered.map(x=>'<div class="row"><div><b>'+e(x.description||x.asset_type)+'</b><div class="muted">'+e(x.notes)+'</div></div><span class="badge">'+e(x.asset_type)+'</span></div>').join(''):'<div class="empty">No hay asignaciones registradas.</div>')}boot();</script></body></html>
