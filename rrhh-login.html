<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Acceso RRHH · El Cartel Studio</title><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>:root{--y:#FFDA03;--bg:#090909;--card:#141414;--line:#292929;--muted:#969696}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:480px;margin:10vh auto;padding:20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}.brand{font-weight:950;color:var(--y);letter-spacing:.035em;font-size:14px}h1{font-size:36px;line-height:1;margin:10px 0 12px}.muted{color:var(--muted);line-height:1.45}.field{margin-top:16px}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;background:#0d0d0d;color:#fff;border:1px solid #363636;border-radius:13px;padding:15px;font-size:16px}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:900;background:var(--y);color:#080808;margin-top:18px;cursor:pointer}.btn:disabled{opacity:.6}.error{display:none;margin-top:14px;padding:12px;border:1px solid #5a4300;background:#201b00;border-radius:12px;color:#ffe77a}.small{font-size:12px;color:#777;margin-top:14px}@media(max-width:520px){.wrap{margin:5vh auto;padding:16px}h1{font-size:32px}}</style></head><body><div class="wrap"><div class="panel"><div class="brand">CARTEL STUDIO</div><h1>Recursos Humanos</h1><p class="muted">Acceso privado para revisar candidaturas y gestionar el proceso de selección.</p><form id="loginForm"><div class="field"><label>Correo</label><input id="email" type="email" value="cartelstudiocuba@gmail.com" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required></div><button id="btn" class="btn" type="submit">Entrar →</button></form><div id="error" class="error"></div><p class="small">Acceso exclusivo del equipo autorizado de El Cartel Studio.</p></div></div><script>const SUPABASE_URL='https://jhumvctocphyiwhszeaz.supabase.co',KEY='sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn';const sb=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const form=document.getElementById('loginForm'),btn=document.getElementById('btn'),err=document.getElementById('error');const requestedNext=new URLSearchParams(location.search).get('next');if(requestedNext&&requestedNext.split(/[?#]/)[0]==='/dashboard.html'){document.title='Acceso Gestión · El Cartel Studio';document.querySelector('h1').textContent='Cartel Gestión';document.querySelector('p.muted').textContent='Acceso privado al Dashboard y los módulos de gestión de El Cartel Studio.'}function showError(t){err.textContent=t;err.style.display='block'}form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='Entrando…';const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(email!=='cartelstudiocuba@gmail.com'){showError('Este correo no está autorizado para acceder a RRHH.');btn.disabled=false;btn.textContent='Entrar →';return}const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){showError(error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':error.message);btn.disabled=false;btn.textContent='Entrar →';return}if((data.user?.email||'').toLowerCase()!=='cartelstudiocuba@gmail.com'){await sb.auth.signOut();showError('Usuario no autorizado.');btn.disabled=false;btn.textContent='Entrar →';return}if(!data.session){showError('No se pudo crear la sesión. Inténtalo nuevamente.');btn.disabled=false;btn.textContent='Entrar →';return}const next=new URLSearchParams(location.search).get('next');location.replace(next&&next.startsWith('/')&&!next.startsWith('//')?next:'/rrhh-inicio.html')});</script></body></html>
