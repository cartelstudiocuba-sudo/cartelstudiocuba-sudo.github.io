 if(/presencia|imagen personal/.test(t))return 'Mantén una imagen limpia, ordenada y profesional, acorde al entorno de trabajo y a la atención de artistas, clientes y colaboradores.';
 if(/comportamiento|conducta|trato/.test(t))return 'Trabaja con respeto, discreción y comunicación profesional. Evita gritos, bromas fuera de contexto o cualquier conducta que afecte el ambiente de trabajo.';
 if(/confidencial|discreci/.test(t))return 'Protege la información interna y la de nuestros clientes. Lo que ocurre dentro de un proyecto no se comparte fuera de los canales autorizados.';
 if(/uniform/.test(t))return 'Usa el uniforme cuando corresponda y mantenlo limpio y presentable. La imagen del equipo también forma parte de la experiencia del cliente.';
 if(/puntual|asistencia/.test(t))return 'Llega a tiempo y comunica con antelación cualquier situación que pueda afectar tu asistencia o el cumplimiento del trabajo.';
 if(/medio|equipo|recurso/.test(t))return 'Cuida los equipos, herramientas y recursos asignados. Revisa su estado, utilízalos correctamente y reporta cualquier incidencia de inmediato.';
 if(/derecho de imagen|cr[eé]dito/.test(t))return 'Respeta el uso institucional de imágenes, reels y créditos de la empresa según las reglas establecidas para cada proyecto.';
 return trainingPresentationSentenceSummary(text,270)
}
function trainingPresentationSplitText(title,text,max=390){
 const clean=String(text||'').replace(/\s+/g,' ').trim();if(!clean)return [];
 const parts=clean.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean),chunks=[];let current='';
 const push=()=>{if(current){chunks.push(current);current=''}};
 const splitLong=part=>{
  const clauses=part.split(/(?<=[,;:])\s+/).map(x=>x.trim()).filter(Boolean);
  if(clauses.length>1){
   let line='';
   clauses.forEach(c=>{const candidate=(line?line+' ':'')+c;if(candidate.length>max&&line){chunks.push(line);line=c}else line=candidate});
   if(line)chunks.push(line);return
  }
  const words=part.split(/\s+/);let line='';
  words.forEach(w=>{const candidate=(line?line+' ':'')+w;if(candidate.length>max&&line){chunks.push(line);line=w}else line=candidate});
  if(line)chunks.push(line)
 };
 parts.forEach(part=>{
  if(part.length>max){push();splitLong(part);return}
  const candidate=(current?current+' ':'')+part;
  if(candidate.length>max){push();current=part}else current=candidate
 });
 push();
 return chunks.map(chunk=>({title:String(title||'Punto clave'),text:chunk}))
}
function trainingPresentationPedagogicalItems(module){
 const items=trainingModuleItems(module)
  .map(x=>({title:String(x.title||''),text:String(x.text||'')}))
  .filter(x=>x.text)
  .filter(x=>!(module.source==='policies'&&/^uso de (este|el) documento$/i.test(x.title.trim())));
 return items.flatMap(x=>trainingPresentationSplitText(trainingPresentationFriendlyTitle(module,x.title),x.text,390))
}
function trainingPresentationPedagogicalSummary(module){
 if(module.id==='onboarding')return 'Cierra la capacitación con una ruta clara de incorporación, prioridades de los primeros días y una comprobación final de lo que debes dominar antes de comenzar.';
 if(module.source==='agency')return 'Conoce El Cartel Studio, su identidad, misión, visión, estructura, cultura, sedes y la información institucional vigente.';
 if(module.source==='policies')return 'Revisa las normas y políticas generales de la agencia que regulan la conducta, la presencia, la confidencialidad y la forma de trabajo.';
 if(module.source==='specific')return 'Comprende el propósito de la plaza y todo el contenido específico definido para su funcionamiento, responsabilidades, organización, herramientas y resultados esperados.';
 if(module.source==='protocols')return 'Estudia todos los protocolos operativos vinculados a la plaza, incluyendo objetivo, pasos y cierre de cada procedimiento.';
 if(module.source==='evaluation')return 'Entiende cómo funciona la evaluación, quién evalúa, con qué frecuencia, qué peso tiene cada parámetro y qué significa cada nivel del nomenclador.';
 if(module.source==='discipline')return 'Conoce el régimen disciplinario aplicable a la plaza, sus medidas, criterios y consecuencias según la configuración vigente.';
 return trainingModuleSummary(module)
}

function paginateTrainingVideoStoryboard(root){

  const page=document.createElement('section');page.className='training-video-page training-video-storyboard-page';

 };

  const pageRect=page.getBoundingClientRect(),sceneRect=scene.getBoundingClientRect();

 };

function trainingPresentationExcludedTextElement(el,slide){
 let node=el;
 while(node&&node!==slide){
  if(node.tagName==='SVG'||node.closest?.('svg'))return true;
  const cls=String(node.className||'');
  if(/(?:^|\s)training-[^\s]*(?:kicker|footer|brand|icon|accent|rule|corner)(?:\s|$)/.test(cls))return true;
  if(/(?:^|\s)training-[^\s]*(?:-num|-number)(?:\s|$)/.test(cls))return true;
  node=node.parentElement
 }
 const text=String(el.textContent||'').replace(/\s+/g,' ').trim();
 if(!text)return true;
 if(/^(?:0?\d+|✓|◎|↻|◇|☷|⌘|›|→)$/u.test(text))return true;
 if(/^CAPÍTULO\s+\d+/i.test(text))return true;
 if(/^EL CARTEL(?:\s+STUDIO)?$/i.test(text))return true;
 return false
}
function trainingPresentationPrepareEditableText(slide){
 const walker=document.createTreeWalker(slide,NodeFilter.SHOW_TEXT);
 const pending=[];
 let node;
 while((node=walker.nextNode())){
  const text=String(node.nodeValue||'').replace(/\s+/g,' ').trim();
  const parent=node.parentElement;
  if(!text||!parent||parent.children.length===0)continue;
  if(trainingPresentationExcludedTextElement(parent,slide))continue;
  pending.push({node,text})
 }
 pending.forEach(({node,text})=>{
  if(!node.parentNode)return;
  const span=document.createElement('span');
  span.className='training-editable-text-node';
  span.textContent=text;
  node.parentNode.replaceChild(span,node)
 });
 const candidates=[...slide.querySelectorAll('h1,h2,h3,p,b,strong,small,span,li,div')].filter(el=>{
  if(el.children.length)return false;
  return !trainingPresentationExcludedTextElement(el,slide)
 });
 const slotCounts={};
 candidates.forEach(el=>{
  const parentClass=String(el.parentElement?.className||'').split(/\s+/).filter(Boolean).find(x=>x.startsWith('training-'))||'text';
  const ownClass=String(el.className||'').split(/\s+/).filter(Boolean).find(x=>x.startsWith('training-'))||'';
  const base=trainingPresentationSlug(el.tagName.toLowerCase()+'-'+(ownClass||parentClass));
  slotCounts[base]=(slotCounts[base]||0)+1;
  const slot=base+'-'+String(slotCounts[base]).padStart(2,'0');
  el.dataset.trainingTextSlot=slot;
  const tag=el.tagName.toLowerCase();
  el.dataset.trainingTextKind=/^h[1-3]$/.test(tag)?'Título':tag==='p'||tag==='li'?'Texto':tag==='b'||tag==='strong'?'Encabezado':tag==='small'?'Etiqueta':'Texto'
 });
 return candidates
}

 const makeProtocolSlides=(chapter)=>{
  const sourceProtocols=protocolItems().filter(p=>String(p.title||p.objective||(p.steps||[]).join(' ')||p.closure).trim());

  const manager=String(role.direct_manager||'tu jefe directo').trim()||'tu jefe directo';
  const normalizeProtocol=p=>({title:p.title||'Protocolo',objective:p.objective||'',steps:[...(p.steps||[])],closure:p.closure||'',start:0});
  const cardHtml=p=>{
   const steps=p.steps||[],start=Number(p.start||0);

  };

   slide.innerHTML='<div class="training-protocol-inner"><div class="training-protocol-kicker">CAPÍTULO '+String(chapter).padStart(2,'0')+'</div><div class="training-protocol-grid"><div class="training-protocol-column">'+cardHtml(protocol)+'</div></div></div><div class="training-protocol-footer">El Cartel Studio · '+e(role.title||'Plaza')+'</div>';
   deck.insertBefore(slide,source);return slide
  };
  const updatePage=(slide,protocol)=>{
   const col=slide.querySelector('.training-protocol-column');if(col)col.innerHTML=cardHtml(protocol);
   slide.classList.toggle('protocol-continuation',!!protocol.continuation)
  };
  const fitsPage=slide=>{
   const card=slide.querySelector('.training-protocol-card'),sr=slide.getBoundingClientRect(),cr=card?.getBoundingClientRect();
   return !!card&&!!cr&&cr.bottom<=sr.bottom-31
  };
  const densityClasses=['',' long',' very-long'];
  const tryWhole=protocol=>{
   for(const density of densityClasses){
    const slide=makePage({...protocol,showEscalate:true},density);
    if(fitsPage(slide))return slide;
    slide.remove()
   }
   return null
  };
  const splitProtocol=protocol=>{
   const pages=[],steps=[...(protocol.steps||[])];
   if(!steps.length){
    let slide=null;
    for(const density of [...densityClasses,' ultra-long']){
     slide=makePage({...protocol,showEscalate:true},density);
     if(fitsPage(slide))return [slide];
     slide.remove()
    }
    slide=makePage({...protocol,showEscalate:true},' ultra-long');

   }
   let remaining=steps,offset=0,first=true;
   while(remaining.length){

    for(const density of [' long',' very-long',' ultra-long']){
     const slide=makePage({title:protocol.title,objective:first?protocol.objective:'',steps:[],closure:'',start:offset,continuation:!first,showEscalate:false},density);
     let accepted=0;
     for(let count=1;count<=remaining.length;count++){
      const finalChunk=count===remaining.length;
      const candidate={
       title:protocol.title,
       objective:first?protocol.objective:'',
       steps:remaining.slice(0,count),
       closure:finalChunk?protocol.closure:'',
       start:offset,
       continuation:!first,
       showEscalate:finalChunk
      };
      updatePage(slide,candidate);
      if(fitsPage(slide))accepted=count;else break
     }
     if(accepted){
      chosenSlide=slide;chosenCount=accepted;chosenDensity=density;
      break
     }
     slide.remove()

    if(!chosenSlide){

      steps:remaining.slice(0,chosenCount),
      closure:finalChunk?protocol.closure:'',
      start:offset,
      continuation:!first,
      showEscalate:finalChunk

 try{if(document.fonts?.ready)await document.fonts.ready}catch(_){}

 const selector=type==='presentation'?'.training-slide':type==='guide'?'.training-guide-page':'.training-video-page';

 // html2canvas necesita que el elemento objetivo esté conectado directamente al DOM
 // durante su proceso interno de clonación. Para evitar errores con el stage técnico
 // fuera de pantalla, cada página se copia a un contenedor temporal conectado al body.
 const capturePage=async(sourcePage,isPresentation)=>{
  const host=document.createElement('div');
  host.className='training-pdf-capture-host';
  host.style.position='fixed';
  host.style.left='-1400px';
  host.style.top='0';
  host.style.width=isPresentation?'1200px':'816px';
  host.style.height=isPresentation?'675px':'1056px';
  host.style.background='#fff';
  host.style.pointerEvents='none';
  host.style.zIndex='1';
  host.style.overflow='hidden';
  const page=sourcePage.cloneNode(true);
  page.style.width=isPresentation?'1200px':'816px';
  if(isPresentation){
   page.style.height='675px';
   page.style.aspectRatio='auto';
   page.style.boxShadow='none'
  }else{
   page.style.maxWidth='none';
   page.style.boxShadow='none'
  }
  host.appendChild(page);
  document.body.appendChild(host);
  try{
   await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
   const imgs=[...page.querySelectorAll('img')];
   if(imgs.length)await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;setTimeout(resolve,1500)})));

   return await html2canvas(page,{

    backgroundColor:'#ffffff',
    logging:false,
    width:page.offsetWidth,
    height:page.offsetHeight,
    scrollX:0,
    scrollY:0
   })
  }finally{
   host.remove()
  }
 };

 try{

  for(let i=0;i<sourcePages.length;i++){
   if(i)pdf.addPage(isPresentation?[slideW,slideH]:'letter',isPresentation?'landscape':'portrait');
   const canvas=await capturePage(sourcePages[i],isPresentation);
   if(isPresentation){
    pdf.addImage(canvas.toDataURL('image/jpeg',.97),'JPEG',0,0,slideW,slideH,undefined,'FAST')
   }else{

   }
  }

  const safe=String(role.title||'Plaza').replace(/[\\/:*?"<>|]+/g,'-').trim();
  pdf.save(label+' - '+safe+'.pdf');
  await logRoleHistoryEvent(
   'Capacitación',

  );
  if(type==='presentation'||type==='guide')await trainingMarkExportSnapshot(type)
 }catch(err){
  console.error('Error exportando capacitación:',err);
  alert('No se pudo generar el PDF: '+(err?.message||err))
 }finally{
  stage.innerHTML=''
 }

 try{return new Intl.DateTimeFormat('es-CU',{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(value))}catch(_){return String(value)}
}
function trainingInformationStatus(cfg=trainingMasterData()){
 const ex=cfg.export_status||{},ph=trainingCurrentSourceHash('presentation'),gh=trainingCurrentSourceHash('guide');
 const p=ex.presentation||{},g=ex.guide||{},k=ex.kit||{};
 const pState=!p.at?'new':p.hash===ph?'current':'changed';
 const gState=!g.at?'new':g.hash===gh?'current':'changed';
 const dates=[p.at,g.at,k.at].filter(Boolean).sort(),lastExport=dates.length?dates[dates.length-1]:'';
 let state='current',title='Información sincronizada',detail='La presentación y la guía coinciden con la información vigente de la plaza.';
 if(pState==='new'&&gState==='new'){state='new';title='Sin exportaciones registradas';detail='Cuando exportes, los documentos se generarán con la información vigente de la plaza.'}
 else if(pState==='changed'||gState==='changed'||pState==='new'||gState==='new'){state='changed';title='Información actualizada desde la última exportación';detail='Hay materiales que conviene volver a exportar para reflejar los cambios más recientes de la plaza.'}
 return {state,title,detail,lastExport,pState,gState,pAt:p.at||'',gAt:g.at||''}
}

async function saveOnboardingScript(){const current=role.work_content&&typeof role.work_content==='object'?role.work_content:{},old=trainingOnboardingData(),script=(document.getElementById('onboardingScript')?.value||'').trim();const{data,error}=await sb.from('hr_roles').update({work_content:{...current,onboarding:{...old,script}},updated_at:new Date().toISOString()}).eq('id',role.id).select().single();if(error){alert('No se pudo guardar el guion: '+error.message);return false}role=data;await logRoleHistoryEvent('Capacitación','training_updated','Guion de onboarding actualizado','Se actualizó el guion de onboarding de la plaza.',{});renderPanel();return true}
async function uploadOnboardingVideo(input){
 const file=input.files&&input.files[0];if(!file)return;
 const ext=(file.name.split('.').pop()||'').toLowerCase(),isMp4=ext==='mp4'||String(file.type||'').toLowerCase()==='video/mp4';
 if(!isMp4){alert('El video final debe estar en formato MP4.');input.value='';return}
 const maxBytes=15*1024*1024;
 if(file.size>maxBytes){alert('El video no puede superar 15 MB. Optimízalo antes de subirlo.');input.value='';return}
 let meta;
 try{meta=await inspectOnboardingVideoFile(file)}catch(err){alert(err.message||'No se pudo analizar el video.');input.value='';return}
 if(meta.width>720||meta.height>1280){alert('La resolución es demasiado alta. Para onboarding usa como máximo 720×1280; recomendado: 540×960.');input.value='';return}
 if(meta.width>=meta.height){alert('El video de onboarding debe ser vertical. Usa una relación cercana a 9:16.');input.value='';return}
 const old=trainingOnboardingData(),path='onboarding/'+role.id+'/video.mp4';
 const{error}=await sb.storage.from('hr-role-documents').upload(path,file,{upsert:true,contentType:'video/mp4'});
 if(error){alert('No se pudo subir el video: '+error.message);input.value='';return}
 if(old.video_path&&old.video_path!==path)await sb.storage.from('hr-role-documents').remove([old.video_path]);
 const current=role.work_content&&typeof role.work_content==='object'?role.work_content:{},script=(document.getElementById('onboardingScript')?.value||old.script).trim();
 const next={
  ...old,
  script,
  video_path:path,
  video_name:file.name,
  video_size:file.size,
  video_width:meta.width,
  video_height:meta.height,
  video_duration:meta.duration,
  video_uploaded_at:new Date().toISOString(),
  video_mime:'video/mp4'
 };
 if(await saveRole({work_content:{...current,onboarding:next}})){
  await logRoleHistoryEvent('Capacitación','video_uploaded','Video de onboarding actualizado','Se cargó el video final aprobado de onboarding.',{video_name:file.name,video_size:file.size,video_width:meta.width,video_height:meta.height,video_duration:meta.duration});
  render()
 }
 input.value=''
}

async function persistEvaluationMaster(next){
 const total=evaluationWeightTotal(next);
 if(total>100.0001){alert('La distribución de la evaluación suma '+total+' %. Debe mantenerse en 100 % o menos. Reduce el peso de uno de los parámetros antes de guardar.');return false}
 const current=role.work_content&&typeof role.work_content==='object'?role.work_content:{};
 const payload={...next,version:3};
 const{data,error}=await sb.from('hr_roles').update({work_content:{...current,evaluation_master:payload},updated_at:new Date().toISOString()}).eq('id',role.id).select().single();
 if(error){alert('No se pudo guardar la matriz de evaluación: '+error.message);return false}
 role=data;return true
}

async function saveEvaluationCriterion(id,index){
 const cfg=evaluationMaster(),i=cfg.criteria.findIndex(x=>x.id===id);if(i<0)return;const current=cfg.criteria[i],input=document.getElementById('evalCriterionWeight-'+index),weight=Number(input?.value||0),safeWeight=Math.max(0,Number.isFinite(weight)?weight:0),limit=evaluationWeightLimit(cfg,id);
 if(safeWeight>limit+0.0001){alert(evaluationWeightLimitMessage(current.name,safeWeight,limit));if(input)input.value=current.weight;return}
 if(current.master_id)cfg.criteria[i]={...current,weight:safeWeight};
 else{const name=(document.getElementById('evalCriterionName-'+index)?.value||'').trim(),desc=(document.getElementById('evalCriterionDesc-'+index)?.value||'').trim();if(!name){alert('Escribe el nombre del parámetro a evaluar.');return}cfg.criteria[i]={...current,name,desc,weight:safeWeight}}
 if(await persistEvaluationMaster(cfg)){evaluationEditingCriterionId=null;renderPanel()}
}
async function saveEvaluationWeight(id,value){
 const cfg=evaluationMaster(),i=cfg.criteria.findIndex(x=>x.id===id);if(i<0)return;const current=cfg.criteria[i],n=Number(value),safeWeight=Math.max(0,Number.isFinite(n)?n:0),limit=evaluationWeightLimit(cfg,id);
 if(safeWeight>limit+0.0001){alert(evaluationWeightLimitMessage(current.name,safeWeight,limit));renderPanel();return}
 cfg.criteria[i].weight=safeWeight;if(await persistEvaluationMaster(cfg))renderPanel()
}
async function saveEvaluationScaleText(id,score,value){

}

}

to y estímulo dentro de la empresa.</p></div></div><div class="eval-system-flow"><article><span>01</span><div><b>Indicadores ponderados</b><p>Cada aspecto que se evalúa tiene un peso porcentual según su importancia dentro de la plaza. Los indicadores globales se combinan con los específicos del puesto para formar el 100 % de la evaluación.</p></div></article><article><span>02</span><div><b>Escala uniforme del 1 al 5</b><p>El responsable asigna una puntuación del 1 al 5 a cada indicador. Cada valor tiene una definición concreta para evitar evaluaciones subjetivas: 5 representa el nivel más alto de cumplimiento y 1 el nivel más bajo.</p></div></article><article><span>03</span><div><b>Cálculo automatizado</b><p>El sistema convierte las puntuaciones obtenidas en un nivel de cumplimiento y aplica el peso de cada indicador. Con esa ponderación calcula automáticamente un promedio global que refleja el desempeño real alcanzado durante el período.</p></div></article><article><span>04</span><div><b>Impacto y seguimiento</b><p>Al cierre del período, antes de completar el flujo de pago, este resultado funciona como referencia para aplicar las reglas económicas asociadas al desempeño cuando existan indicadores deficientes y, al mismo tiempo, para identificar resultados altos o sostenidos que puedan justificar estímulos y reconocimientos.</p></div></article></div></section><section class="eval-general-config"><div class="eval-config-card"><span class="eval-config-icon yellow">↻</span><div class="eval-config-copy"><small>Periodicidad</small><select onchange="saveEvaluationFrequency(this.value)"><option '+(cfg.frequency==='Diaria'?'selected':'')+'>Diaria</option><option '+(cfg.frequency==='Semanal'?'selected':'')+'>Semanal</option><option '+(cfg.frequency==='Quincenal'?'selected':'')+'>Quincenal</option><option '+(cfg.frequency==='Mensual'?'selected':'')+'>Mensual</option><option '+(cfg.frequency==='Trimestral'?'selected':'')+'>Trimestral</option></select></div></div><div class="eval-config-card evaluator"><span class="eval-config-icon violet">👤</span><div class="eval-config-copy"><small>Quién evalúa</small><select onchange="evaluationEvaluatorChanged(this.value)"><option value="">Seleccionar plaza…</option>'+evaluatorOptions+'<option value="__manual__" '+(cfg.evaluator_mode==='manual'?'selected':'')+'>Escribir manualmente…</option></select>'+(cfg.evaluator_mode==='manual'?'<div class="eval-manual-evaluator"><input id="evaluationManualEvaluator" value="'+e(cfg.evaluator_manual)+'" placeholder="Nombre de la plaza o responsable"><button onclick="saveEvaluationManualEvaluator()">Guardar</button></div>':'')+'</div></div></section><section class="eval-weight-map"><div class="eval-weight-head"><div><b>Distribución de la evaluación</b><small>La suma de los pesos debe completar el 100 %. Para aumentar un indicador, primero libera porcentaje reduciendo otro.</small></div><div class="eval-weight-metrics"><div><small>Asignado</small><strong class="'+totalClass+'">'+total+'%</strong></div><div><small>Disponible</small><strong class="'+(available===0?'locked':'free')+'">'+available+'%</strong></div></div></div><div class="eval-weight-bar">'+segments+'</div><div class="eval-distribution-grid">'+distributionCards+'</div><div class="eval-weight-rule '+(available===0?'locked':'free')+'"><span>↔</span><div><b>'+(available===0?'Distribución completa':'Porcentaje disponible: '+available+' %')+'</b><small>'+(available===0?'Para subir el peso de un parámetro, reduce primero otro. El sistema no permitirá superar el 100 %.':'Puedes asignar hasta '+available+' % adicional sin superar el 100 %.')+'</small></div></div>'+(totalClass==='warn'?'<div class="eval-total-warning">⚠ La ponderación actual suma '+total+' %. Ajusta los pesos hasta completar 100 %.</div>':'')+(zeroWeight?'<div class="eval-total-warning neutral">Hay '+zeroWeight+' parámetro'+(zeroWeight===1?'':'s')+' activo'+(zeroWeight===1?'':'s')+' con peso 0 %. Asígnale ponderación si debe influir en la evaluación.</div>':'')+'</section><div class="eval-note"><span>i</span><div><b>Parámetros globales + parámetros específicos</b><small>Los globales se heredan automáticamente desde el nomenclador. Los específicos pueden activarse para esta plaza o crearse directamente aquí. Esta matriz será heredada por el flujo de evaluación del trabajador y Finanzas.</small></div></div><div class="eval-criteria-grid">'+cards+'</div>'
}

async function saveSpecificItem(id,index){const title=(document.getElementById('specific-title-'+index)?.value||'').trim(),textValue=(document.getElementById('specific-text-'+index)?.value||'').trim();if(!title){alert('Escribe un encabezado para este contenido.');return}const w=workData(),standard={...w.standard},standard_titles={...w.standard_titles},custom=normalizedSpecificCustom(w);if(id.startsWith('std:')){const key=id.slice(4);standard_titles[key]=title;standard[key]=textValue}else{const cid=id.slice(7),i=custom.findIndex(x=>String(x.id)===cid);if(i<0)return;custom[i]={...custom[i],title,text:textValue}}if(await persistSpecificWork({standard,standard_titles,custom})){specificEditingId=null;refreshSpecificContent()}}
async function deleteSpecificItem(id){const items=specificWorkItems(),item=items.find(x=>x.id===id);if(!item)return;if(!confirm('¿Eliminar "'+(item.title||'este contenido')+'" de esta plaza?'))return;const w=workData(),hidden=[...w.hidden_standard_keys],custom=normalizedSpecificCustom(w);let nextCustom=custom,nextHidden=hidden;if(id.startsWith('std:')){const key=id.slice(4);if(!nextHidden.includes(key))nextHidden.push(key)}else{const cid=id.slice(7);nextCustom=custom.filter(x=>String(x.id)!==cid)}const nextOrder=w.content_order.filter(x=>x!==id);if(await persistSpecificWork({hidden_standard_keys:nextHidden,custom:nextCustom,content_order:nextOrder})){if(specificEditingId===id)specificEditingId=null;refreshSpecificContent()}}

function buildDefinitionPreviewPages(box){
 box.innerHTML='';
 const groups=definitionDocumentSections(),pages=document.createElement('div');pages.className='contract-pages';box.appendChild(pages);
 let pageNo=0;
 const PAGE_CAPACITY=3200,MIN_POINT_START=760;
 const addCover=()=>{pageNo++;const tmp=document.createElement('div');tmp.innerHTML=documentationCoverPageShell('Definición de la plaza');pages.appendChild(tmp.firstElementChild)};
 const addPage=html=>{pageNo++;const tmp=document.createElement('div');tmp.innerHTML=documentationInformativePageShell('Definición de la plaza',pageNo);const page=tmp.firstElementChild;page.classList.add('definition-doc-page');page.querySelector('.doc-info-content').innerHTML=html;pages.appendChild(page)};
 const sectionTitle=(title,major)=>'<section class="doc-info-section doc-info-section-title '+(major?'doc-major-section-title':'')+'"><h3>'+e(title)+'</h3></section>';
 const continuation=title=>'<div class="doc-info-continuation">'+e(title)+' · Continuación</div>';
 const splitText=(value,maxChars=950)=>{
  const text=String(value||'').trim();if(!text)return[];
  if(text.length<=maxChars)return[text];
  const units=text.split(/(?<=[.!?])\s+|\n{2,}/).filter(Boolean),out=[];let cur='';
  units.forEach(unit=>{
   if(unit.length>maxChars){
    if(cur){out.push(cur);cur=''}
    let rest=unit;
    while(rest.length>maxChars){
     let cut=rest.lastIndexOf(' ',maxChars);if(cut<maxChars*.55)cut=maxChars;
     out.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trim()
    }
    if(rest)cur=rest;return
   }
   const next=cur?(cur+' '+unit):unit;
   if(next.length>maxChars){if(cur)out.push(cur);cur=unit}else cur=next
  });
  if(cur)out.push(cur);return out
 };
 const tokens=[];
 groups.forEach(g=>{
  const section=g.title,major=!!g.major,content=[];
  if(g.kind==='grouped_fields'){
   if(String(g.intro||'').trim()){
    const text=String(g.intro||'');
    content.push({html:'<div class="doc-info-intro"><p>'+e(text).replace(/\\n/g,'<br>')+'</p></div>',weight:220+text.length*.45,pointStart:false})
   }
   (g.groups||[]).forEach(group=>{
    const items=group.items||[],chars=items.reduce((n,x)=>n+String(x[0]||'').length+String(x[1]||'').length,0),weight=230+items.length*88+chars*.32;
    content.push({html:'<section class="doc-info-data-group"><h4>'+e(group.title)+'</h4><div class="doc-info-fields">'+items.map(x=>'<div><small>'+e(x[0])+'</small><p>'+e(x[1]).replace(/\\n/g,'<br>')+'</p></div>').join('')+'</div></section>',weight,pointStart:true,minStart:Math.min(980,Math.max(MIN_POINT_START,weight+80))})
   })
  }else if(g.kind==='grouped_blocks'){
   (g.groups||[]).forEach(group=>{
    const items=(group.items||[]).filter(item=>String(item[1]||'').trim());
    const chars=items.reduce((n,item)=>n+String(item[0]||'').length+String(item[1]||'').length,0);
    const weight=260+items.length*115+chars*.46;
    content.push({
     html:'<section class="doc-info-data-group doc-info-agency-group definition-atomic-point"><h4>'+e(group.title)+'</h4><div class="doc-info-agency-items">'+items.map(item=>'<div class="doc-info-agency-item"><small>'+e(item[0])+'</small><p>'+e(item[1]).replace(/\\n/g,'<br>')+'</p></div>').join('')+'</div></section>',
     weight,
     pointStart:true,
     minStart:Math.min(PAGE_CAPACITY,Math.max(900,weight+120)),
     atomic:true
    })
   })
  }else{
   const compactListSection=['Normas y políticas generales de la agencia','Régimen disciplinario','Contenido específico de la plaza'].includes(section);
   (g.items||[]).filter(x=>String(x[1]||'').trim()).forEach(item=>{
    const parts=splitText(item[1],compactListSection?1050:850);
    parts.forEach((part,i)=>{
     const weight=compactListSection?(135+part.length*.48):(195+part.length*.72);
     const minStart=compactListSection?Math.min(820,weight+70):Math.min(950,Math.max(700,weight+90));
     content.push({html:'<div class="doc-info-block">'+(item[0]?'<h4>'+e(item[0])+(i?' · Continuación':'')+'</h4>':'')+'<p>'+e(part).replace(/\\n/g,'<br>')+'</p></div>',weight,pointStart:i===0,minStart})
    })
   })
  }
  if(!content.length)content.push({html:'<div class="doc-info-empty">No hay información configurada en esta sección.</div>',weight:260,pointStart:false});
  tokens.push({section,major,content})
 });
 addCover();
 let pageHtml='',used=0;
 const flush=()=>{if(!pageHtml.trim())return;addPage(pageHtml);pageHtml='';used=0};
 tokens.forEach((group,groupIndex)=>{
  const headerHtml=sectionTitle(group.section,group.major),headerWeight=180;
  if(groupIndex>0&&pageHtml)flush();
  pageHtml+=headerHtml;used+=headerWeight;
  group.content.forEach((piece,index)=>{
   const remaining=PAGE_CAPACITY-used;
   if(piece.pointStart&&pageHtml&&remaining<(piece.minStart||MIN_POINT_START)){
    flush();
    if(index>0){pageHtml+=continuation(group.section);used+=70}
   }
   const extra=(index>0&&used===0)?70:0;
   if(pageHtml&&used+piece.weight+extra>PAGE_CAPACITY){
    flush();
    if(index>0){pageHtml+=continuation(group.section);used+=70}
   }
   pageHtml+=piece.html;used+=piece.weight
  })
 });
 flush();
 return [...pages.querySelectorAll('.contract-paper-page')]
}

   {id:'tc4',title:'Condiciones',source:'role:trial_conditions',included:true,text:''},
   {id:'tc5',title:'Contenido de trabajo',source:'specific',included:true,text:''},
   {id:'tc6',title:'Límites de autoridad',source:'custom',included:true,text:'Sin autorización expresa, la persona candidata no podrá contratar personas o servicios, asumir obligaciones en nombre de El Cartel Studio, aprobar presupuestos, precios o descuentos, ordenar pagos, contraer deudas, modificar acuerdos, entregar información reservada, compartir accesos, publicar contenido, realizar declaraciones en nombre de la empresa ni utilizar contactos o recursos empresariales para fines personales.'},
   {id:'tc7',title:'Evaluación',source:'custom',included:true,text:'Durante esta etapa se evaluarán organización, puntualidad, responsabilidad, comunicación, seguimiento, autonomía, priorización, resolución de imprevistos, criterio para consultar, discreción, atención al detalle, cumplimiento de instrucciones, aprendizaje de herramientas digitales, cuidado de recursos, manejo documental y adaptación.'},
   {id:'tc8',title:'Confidencialidad',source:contractPolicySource('confid'),included:true,text:'',use_override:true,override_text:'Se considera confidencial toda información no pública conocida por razón de esta etapa, incluyendo información de artistas, clientes, colaboradores, proyectos, presupuestos, precios, contratos, proveedores, contactos, bases de datos, facturación, pagos, salarios, fotografías, videos, diseños, estrategias, calendarios, conversaciones, agenda de Dirección, documentos, procedimientos, archivos, claves y credenciales. La persona candidata no podrá copiar, divulgar, reenviar, fotografiar, grabar, publicar, entregar a terceros, transferir a cuentas personales, conservar innecesariamente ni utilizar dicha información para beneficio propio o ajeno.'},
   {id:'tc9',title:'Seguridad digital e incidentes',source:contractPolicySource('acces'),included:true,text:'',use_override:true,override_text:'Los accesos concedidos durante esta etapa serán exclusivamente para las funciones autorizadas. La persona candidata deberá proteger contraseñas y dispositivos y comunicar inmediatamente pérdidas, exposición de claves, accesos sospechosos, documentos extraviados, envíos erróneos o cualquier incidente que pueda comprometer información o recursos de El Cartel Studio.'},
   {id:'tc10',title:'Medios y responsabilidad material',source:contractPolicySource('responsabilidad material'),included:true,text:'',use_override:true,override_text:'Los bienes entregados podrán documentarse mediante acta de entrega y devolución. La persona candidata deberá utilizarlos diligentemente y exclusivamente para fines autorizados. Cualquier responsabilidad material derivada de pérdida, daño, deterioro o uso indebido se determinará atendiendo a las circunstancias, la causa, el grado real de responsabilidad y el procedimiento correspondiente.'},
   {id:'tc11',title:'Dinero, gastos y conflictos de interés',source:'custom',included:true,text:'La persona candidata no podrá utilizar fondos de El Cartel Studio sin autorización. Todo recurso recibido para una gestión deberá destinarse al fin indicado y justificarse. No podrá solicitar o recibir comisiones, pagos, favores o beneficios personales derivados de gestiones realizadas en nombre de El Cartel Studio y deberá informar cualquier posible conflicto de interés.'},
   {id:'tc12',title:'Documentos, devolución y cierre',source:contractPolicySource('medios'),included:true,text:'',use_override:true,override_text:'Los documentos, listados, informes, bases y archivos creados durante las tareas deberán quedar disponibles para El Cartel Studio. Al finalizar la etapa, la persona candidata deberá devolver equipos, llaves, documentos y demás recursos recibidos, entregar los archivos de trabajo y eliminar de cuentas o dispositivos personales cualquier copia no autorizada. El Cartel Studio podrá revocar los accesos concedidos.'},
   {id:'tc13',title:'Confidencialidad posterior',source:contractPolicySource('confid'),included:true,text:'',use_override:true,override_text:'Las obligaciones respecto de la información que conserve carácter confidencial continuarán después de finalizar esta etapa, independientemente de que exista o no una relación laboral o contractual posterior con El Cartel Studio.'},
   {id:'tc14',title:'Terminación y evaluación final',source:'custom',included:true,text:'Cualquiera de las partes podrá comunicar que no desea continuar con la etapa. Al cierre se devolverán los recursos, se revocarán los accesos y se determinará la remuneración que corresponda por el tiempo efectivamente realizado. Finalizado el período de prueba, El Cartel Studio evaluará el desempeño y comunicará la decisión correspondiente. Cualquier relación posterior deberá formalizarse de manera independiente.'},
   {id:'tc15',title:'Aceptación y firmas',source:'candidate',included:true,text:'',use_override:true,override_text:'Con su firma, las partes manifiestan haber leído y comprendido este acuerdo. La persona candidata declara conocer la duración, horario, sede y remuneración; el contenido general de las actividades; los límites de autoridad; las obligaciones sobre medios, seguridad y confidencialidad; y que esta etapa no garantiza una contratación posterior.\n\nPERSONA CANDIDATA\nNombre: ________________________________________________\nCarné de Identidad: ______________________________\nFirma: ______________________________\nFecha: ____ / ____ / ________\n\nPOR EL CARTEL STUDIO\nNombre: ________________________________________________\nCargo: ______________________________\nFirma: ______________________________\nFecha: ____ / ____ / ________'}
  ]},
  {key:'trial_close',title:'Acta de cierre del período de prueba',subtitle:'Constancia de culminación, entrega y cierre de la etapa',closure_version:4,agreement_text:'Las partes dejan constancia de la culminación del período de prueba y del cumplimiento de las entregas, pagos y obligaciones asociadas a su cierre:',blocks:[
   {id:'tcl1',title:'Identificación de El Cartel Studio',source:'company',included:true,text:''},
   {id:'tcl2',title:'Identificación de la persona evaluada',source:'candidate',included:true,text:''},
   {id:'tcl3',title:'Período evaluado y fecha efectiva de cierre',source:'custom',included:true,text:'Se deja constancia de que el período de prueba correspondiente a la plaza indicada en este documento se desarrolló desde el ____ / ____ / ______ hasta el ____ / ____ / ______. La fecha efectiva de cierre de esta etapa es el ____ / ____ / ______.'},
   {id:'tcl4',title:'Constancia de culminación del período de prueba',source:'custom',included:true,text:'Por medio de la presente se deja constancia de que la persona identificada en este documento culminó el período de prueba correspondiente a la plaza indicada, quedando formalizado el cierre de esta etapa. Cualquier relación laboral o contractual posterior deberá formalizarse mediante el documento correspondiente.'},
   {id:'tcl5',title:'Entrega de avances, trámites y gestiones',source:'custom',included:true,text:'Se deja constancia de que la persona evaluada hizo entrega a El Cartel Studio de los avances realizados durante el período de prueba, incluyendo los trámites, gestiones, archivos, listados, comunicaciones, documentos y demás información de trabajo generada o administrada durante esta etapa, de manera que queden disponibles para la continuidad de los procesos correspondientes.'},
   {id:'tcl6',title:'Remuneración, gastos y obligaciones económicas',source:'custom',included:true,text:'Las partes revisan los pagos correspondientes al tiempo efectivamente realizado durante el período de prueba, así como los anticipos, gastos autorizados, reembolsos, fondos entregados para trámites o gestiones y cualquier otro concepto económico vinculado a esta etapa. Ambas partes declaran que, a la fecha de firma de la presente acta, no existen saldos, pagos, reembolsos, anticipos ni cantidades de dinero pendientes entre El Cartel Studio y la persona evaluada, y que todo importe entregado para la ejecución de trámites o gestiones fue utilizado, justificado y/o reintegrado según correspondía. De existir alguna excepción o asunto económico pendiente, deberá quedar expresamente consignado en la cláusula «Asuntos pendientes u observaciones» de esta acta.'},
   {id:'tcl7',title:'Devolución de medios, recursos y documentación',source:'custom',included:true,text:'La persona evaluada declara haber devuelto, o deja identificados como pendientes de devolución, los medios, recursos, documentos, llaves, credenciales físicas, uniformes, accesorios y demás bienes recibidos para el desarrollo de la etapa.\n\nCantidad | Medio / recurso | Estado de devolución | Responsable / firma\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n\nCualquier incidencia, pérdida, daño o diferencia detectada se documentará y tramitará de acuerdo con las circunstancias y el procedimiento aplicable, sin presumir responsabilidad por el solo hecho de su existencia.'},
   {id:'tcl8',title:'Cierre de accesos, archivos y seguridad digital',source:'custom',included:true,text:'Al cierre de la etapa, El Cartel Studio podrá revocar o modificar los accesos, permisos y credenciales concedidos. La persona evaluada deberá cerrar sesiones abiertas, devolver dispositivos o soportes que correspondan y eliminar de cuentas o dispositivos personales cualquier copia no autorizada de archivos, datos, claves o información perteneciente a El Cartel Studio, sus clientes, artistas, proveedores o colaboradores.'},
   {id:'tcl9',title:'Confidencialidad, propiedad intelectual y obligaciones que subsisten',source:'custom',included:true,text:'La finalización del período de prueba no extingue las obligaciones que, por su naturaleza, deban mantenerse después del cierre, especialmente las relacionadas con confidencialidad, protección de información, devolución de bienes, responsabilidad por recursos recibidos y titularidad o uso autorizado de materiales, documentos, diseños, fotografías, videos, bases de datos, procedimientos u otros contenidos generados o conocidos durante la etapa, en la medida que corresponda.'},
   {id:'tcl10',title:'Asuntos pendientes u observaciones',source:'custom',included:true,text:'Este espacio se utilizará para dejar constancia, a modo de resumen, de cualquier asunto que permanezca pendiente al momento del cierre, incluyendo pagos, reembolsos, medios, documentos, entregas, accesos, trámites, gestiones u otras observaciones que las partes consideren necesario registrar. Si no existen asuntos pendientes, podrá dejarse constancia expresa de ello.\n\nResumen de asuntos pendientes u observaciones:\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________'},
   {id:'tcl11',title:'Declaración final y firmas',source:'candidate',included:true,text:'',use_override:true,override_text:'Las partes manifiestan haber revisado el contenido de la presente acta y firman en señal de constancia del cierre del período de prueba. Se emiten las copias que correspondan para cada parte.\n\nPERSONA EVALUADA\nNombre: ________________________________________________\nCarné de Identidad: ______________________________\nFirma: ______________________________\nFecha: ____ / ____ / ________\n\nPOR EL CARTEL STUDIO\nNombre: ________________________________________________\nCargo: ______________________________\nFirma: ______________________________\nFecha: ____ / ____ / ________'}
  ]}
 ]},

  {key:'employment_close',title:'Documento de terminación de la relación laboral',subtitle:'Cierre integral de la relación de trabajo',closure_version:2,agreement_text:'Las partes dejan constancia de la terminación de la relación laboral y del estado de las obligaciones, entregas y responsabilidades asociadas a su cierre:',blocks:[
   {id:'ecl1',title:'Identificación de El Cartel Studio y del contrato que finaliza',source:'company',included:true,text:''},
   {id:'ecl2',title:'Identificación del trabajador',source:'candidate',included:true,text:''},
   {id:'ecl3',title:'Antecedentes del vínculo y fecha efectiva de terminación',source:'custom',included:true,text:'Se deja constancia de que entre las partes existió una relación laboral correspondiente a la plaza indicada en este documento, formalizada mediante contrato suscrito el ____ / ____ / ______. La relación laboral termina de manera efectiva el ____ / ____ / ______.\n\nFecha de inicio del vínculo: ____ / ____ / ______\nFecha de terminación: ____ / ____ / ______\nÚltimo día efectivamente trabajado: ____ / ____ / ______'},
   {id:'ecl4',title:'Causa o modalidad de terminación',source:'custom',included:true,text:'La terminación se documenta por la siguiente causa o modalidad, según corresponda:\n☐ Mutuo acuerdo\n☐ Decisión del trabajador\n☐ Decisión del empleador en supuesto legalmente procedente\n☐ Vencimiento del término pactado\n☐ Imposibilidad o causa sobrevenida\n☐ Otra causa aplicable: ________________________________________________\n\nDescripción o fundamento que deba quedar consignado:\n________________________________________________________________________________\n________________________________________________________________________________'},
   {id:'ecl5',title:'Entrega de funciones, asuntos en curso y documentación',source:'custom',included:true,text:'EL TRABAJADOR entrega a El Cartel Studio la información necesaria para dar continuidad a las funciones que se encontraban bajo su responsabilidad, incluyendo documentos, archivos, listados, estados de situación, contactos de trabajo, pendientes, cronogramas, materiales, versiones y demás elementos que correspondan.\n\nAsuntos o proyectos en curso al momento del cierre:\n________________________________________________________________________________\n________________________________________________________________________________\n\nPersona o área que recibe la entrega: ____________________________________________'},
   {id:'ecl6',title:'Devolución de medios básicos, recursos y bienes',source:'custom',included:true,text:'EL TRABAJADOR declara haber devuelto, o deja identificados como pendientes de devolución, los medios básicos, equipos, accesorios, uniformes, llaves, documentos, credenciales físicas y demás bienes recibidos para el desempeño de sus funciones.\n\nCantidad | Medio / recurso | Estado de devolución | Firma del responsable\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n________ | ______________________________ | ____________________ | __________________\n\nLas incidencias, pérdidas, daños o diferencias que se detecten deberán documentarse y analizarse conforme a las circunstancias y al procedimiento aplicable, sin presumir responsabilidad por su sola existencia.'},
   {id:'ecl7',title:'Cierre de accesos, credenciales y archivos digitales',source:'custom',included:true,text:'Con motivo de la terminación, El Cartel Studio podrá revocar, modificar o reasignar accesos, permisos, correos, cuentas, claves y credenciales vinculadas al trabajo. EL TRABAJADOR deberá cerrar sesiones abiertas, entregar dispositivos o soportes que correspondan y eliminar de cuentas o dispositivos personales cualquier copia no autorizada de información, archivos o credenciales pertenecientes a El Cartel Studio o a terceros vinculados con la actividad.\n\nAccesos o incidencias pendientes de cierre:\n________________________________________________________________________________'},
   {id:'ecl8',title:'Liquidación económica y obligaciones pendientes',source:'custom',included:true,text:'Las partes revisan los conceptos económicos vinculados al cierre de la relación laboral: salario devengado pendiente, pagos por trabajos ya realizados, anticipos, gastos autorizados, reembolsos, descuentos o cualquier otro concepto que corresponda documentar.\n\nEstado de la liquidación:\n☐ Sin importes pendientes entre las partes\n☐ Existen importes pendientes, detallados a continuación\n\nConcepto: __________________________________  Importe: __________________\nEstado / fecha prevista de liquidación: __________________________________________\nObservaciones: __________________________________________________________________\n\nLa constancia de pago o liquidación de un concepto específico no deberá interpretarse como renuncia a derechos que legalmente sean irrenunciables.'},
   {id:'ecl9',title:'Confidencialidad y obligaciones posteriores al cierre',source:'custom',included:true,text:'La terminación de la relación laboral no extingue las obligaciones que, por su naturaleza, deban permanecer vigentes después del cierre, especialmente las relativas a confidencialidad, protección de información no pública, devolución de bienes, uso de credenciales, responsabilidad sobre recursos recibidos y cualquier otra obligación expresamente pactada que resulte aplicable después de la terminación.'},
   {id:'ecl10',title:'Propiedad intelectual, materiales y contenidos de trabajo',source:'custom',included:true,text:'Los archivos, documentos, diseños, fotografías, videos, bases de datos, procedimientos, guiones, presupuestos, informes, piezas gráficas, materiales de producción y demás contenidos creados, recopilados o gestionados durante la relación laboral deberán quedar entregados y disponibles para El Cartel Studio en la medida que corresponda según los acuerdos aplicables. No deberán conservarse ni utilizarse copias no autorizadas después del cierre.'},
   {id:'ecl11',title:'Incidencias, responsabilidades y reclamaciones pendientes',source:'custom',included:true,text:'Las partes podrán dejar expresamente consignada cualquier incidencia, reclamación, investigación, entrega, responsabilidad material, documento o asunto pendiente al momento de la terminación. La firma de este documento acredita los hechos y declaraciones que se consignan, pero no impide documentar posteriormente hechos que no hubieran podido ser conocidos al momento de la firma ni supone renuncia a derechos u obligaciones legalmente exigibles.\n\nAsuntos pendientes u observaciones:\n________________________________________________________________________________\n________________________________________________________________________________'},
   {id:'ecl12',title:'Documentación de cierre y constancias entregadas',source:'custom',included:true,text:'Se deja constancia de la documentación entregada o pendiente de entregar con motivo de la terminación, según corresponda: copia del presente documento, constancias de pago, documentos de entrega y devolución, certificaciones o comprobantes relacionados con el vínculo laboral y cualquier otro documento requerido para completar el expediente de cierre.\n\nDocumentos pendientes, si existen:\n________________________________________________________________________________'},
   {id:'ecl13',title:'Declaración final, conformidad y firmas',source:'candidate',included:true,text:'',use_override:true,override_text:'Las partes declaran haber revisado el contenido del presente documento y firman para dejar constancia de la terminación de la relación laboral y del estado de los asuntos expresamente reflejados en él. Se emiten las copias que correspondan para cada parte.\n\nEL EMPLEADOR / REPRESENTANTE DE EL CARTEL STUDIO\nNombre: ________________________________________________\nCargo: ______________________________\nCarné de Identidad: ______________________________\nFirma: ______________________________\nFecha: ____ / ____ / ________\n\nEL TRABAJADOR\nNombre: ________________________________________________\nCarné de Identidad: ______________________________\nFirma: ______________________________\nFecha: ____ / ____ / ________'}
  ]}
 ]},

   {id:'tr3',title:'Objeto e identificación del medio de transporte',source:'custom',included:true,text:'El Cartel Studio asigna a la persona identificada en este documento el uso y custodia del medio de transporte descrito en el Anexo 1, para apoyar el cumplimiento de las funciones, traslados y necesidades operativas autorizadas por la empresa. La identificación técnica, valor declarado, estado inicial y demás características del vehículo forman parte integral de este contrato.'},
   {id:'tr4',title:'Entrega, inventario y estado inicial',source:'custom',included:true,text:'La entrega material del vehículo, sus llaves, documentos, cargadores, baterías, mandos, accesorios y demás medios asociados quedará documentada en los anexos de este contrato. La persona asignada declara recibirlos en el estado que allí se describe y que tuvo oportunidad de revisar su condición visible. La existencia de marcas, daños o defectos preexistentes deberá dejarse consignada para evitar que se atribuyan posteriormente a la persona asignada. La recepción del vehículo no equivale a declarar que carece de defectos ocultos o fallas técnicas no detectables mediante una revisión ordinaria.'},
   {id:'tr5',title:'Uso autorizado y restricciones',source:'custom',included:true,text:'El medio de transporte deberá utilizarse prioritariamente para las funciones y gestiones autorizadas por El Cartel Studio. Sin autorización expresa, no podrá cederse, prestarse o entregarse a terceros; utilizarse para actividades comerciales ajenas, competencias o maniobras imprudentes; transportar cargas o personas en condiciones no permitidas; ni destinarse a fines incompatibles con su naturaleza, seguridad o con las instrucciones de la empresa.'},
   {id:'tr6',title:'Custodia, conservación, parqueo y seguridad',source:'custom',included:true,text:'La persona asignada deberá mantener una custodia diligente del vehículo, utilizar los sistemas de cierre y seguridad disponibles y procurar su estacionamiento en lugares razonablemente seguros y protegidos. Deberá mantenerlo limpio y en condiciones de uso adecuadas, evitar exposiciones innecesarias a riesgos, humedad, agua a presión u otras condiciones que puedan dañarlo y comunicar de inmediato cualquier pérdida de llaves, documentos, mandos o accesorios.'},
   {id:'tr7',title:'Requisitos para la conducción y normas de tránsito',source:'custom',included:true,text:'La persona asignada deberá contar con la licencia, permiso, habilitación o requisito que resulte aplicable al tipo de vehículo y deberá respetar las normas de tránsito, seguridad vial y uso de medios de protección correspondientes. No podrá conducir bajo efectos de alcohol, drogas o sustancias que afecten la capacidad de conducción. Las multas o infracciones atribuibles a su conducta serán tratadas conforme a las circunstancias y a la normativa aplicable.'},
   {id:'tr8',title:'Combustible, carga eléctrica, gastos y fondos',source:'custom',included:true,text:'Los gastos de combustible, carga eléctrica, parqueo, peajes, mantenimiento o gestiones vinculadas al vehículo serán asumidos por la persona a la cual le fue asignado el medio de transporte. En vehículos eléctricos, la carga deberá realizarse en puntos y condiciones seguras, utilizando cargadores y conexiones compatibles y evitando prácticas que puedan comprometer la batería, el cargador o la instalación eléctrica.'},
   {id:'tr9',title:'Inspecciones y mantenimiento preventivo',source:'custom',included:true,text:'Una vez al mes, El Cartel Studio realizará un «Día de la Técnica», durante el cual el personal designado por la empresa efectuará una inspección del estado mecánico, eléctrico, estético, documental y general del medio de transporte. La persona asignada deberá presentar el vehículo para dicha revisión y facilitar las comprobaciones necesarias. Si durante la inspección se detectan ajustes, mantenimientos o reparaciones que no representen un riesgo inmediato para la seguridad, estos quedarán señalados y se otorgará como plazo máximo para su corrección la fecha de la siguiente revisión mensual del «Día de la Técnica». Cuando se detecte una condición que pueda comprometer la seguridad, la integridad del vehículo o de terceros, El Cartel Studio podrá disponer la suspensión inmediata de su uso hasta que sea corregida. Si, llegada la siguiente revisión, los arreglos indicados no hubieran sido realizados y no existiera una causa debidamente justificada, El Cartel Studio o el personal designado evaluará las circunstancias y podrá adoptar medidas proporcionales a la gravedad, reiteración y riesgo generado, incluyendo advertencias, suspensión temporal del uso y, en los casos más graves o reiterados, el retiro definitivo de la asignación del medio de transporte. La persona asignada también deberá realizar las comprobaciones rutinarias razonables antes y durante el uso y comunicar oportunamente cualquier ruido, daño, alerta, desgaste anormal, pérdida de presión, problema de frenos, luces, batería, cargador, neumáticos, suspensión, cableado u otra condición que requiera revisión.'},
   {id:'tr10',title:'Reparaciones, modificaciones y sustitución de componentes',source:'custom',included:true,text:'No podrán realizarse modificaciones estructurales, eléctricas, mecánicas, estéticas o de software, ni sustituirse piezas o accesorios relevantes sin autorización de El Cartel Studio, salvo actuaciones de emergencia estrictamente necesarias para evitar un daño mayor. Las reparaciones y compras de piezas deberán documentarse y, cuando corresponda, ser previamente autorizadas.'},
   {id:'tr11',title:'Accidentes, robo, pérdida, averías e inmovilización',source:'custom',included:true,text:'Ante accidente, robo, intento de robo, pérdida, avería grave, incendio, daño relevante o inmovilización del vehículo, la persona asignada deberá informar a El Cartel Studio tan pronto como resulte razonablemente posible, proteger el medio y la evidencia disponible, evitar reparaciones no autorizadas salvo urgencia y realizar los reportes ante las autoridades cuando corresponda. Deberá aportar la información, fotografías, documentos o testimonios disponibles que permitan esclarecer lo ocurrido.'},
   {id:'tr12',title:'Daños, desgaste y responsabilidad material',source:'custom',included:true,text:'El desgaste normal derivado del uso autorizado no será tratado como daño imputable. Cuando exista pérdida, daño, deterioro anormal o falta de un accesorio, se documentarán las circunstancias y se determinará la causa y el grado real de responsabilidad antes de establecer cualquier obligación de reparación, reposición o compensación. La responsabilidad no se presumirá por la sola existencia del daño y deberá atender a la existencia de negligencia, mal uso, incumplimiento de instrucciones u otra causa debidamente constatada.'},
   {id:'tr13',title:'Obligaciones de El Cartel Studio',source:'custom',included:true,text:'El Cartel Studio deberá entregar el vehículo en condiciones razonables para el uso previsto. Si al momento de la entrega existiera algún fallo, defecto, daño, limitación o condición particular conocida, deberá dejarse expresamente declarada en la documentación de entrega para conocimiento y transparencia de la persona asignada. Asimismo, El Cartel Studio deberá entregar la documentación correspondiente al vehículo debidamente actualizada, vigente y sin incidencias conocidas que impidan o comprometan su uso conforme a lo previsto.'},
   {id:'tr14',title:'Disponibilidad, inspección y retiro temporal',source:'custom',included:true,text:'El medio continúa siendo propiedad o estando bajo control de El Cartel Studio. La empresa podrá solicitar su presentación para inspección, mantenimiento, reparación, inventario, reasignación o necesidad operativa. La persona asignada deberá facilitar su entrega en un plazo razonable, salvo imposibilidad debidamente comunicada. El retiro temporal del vehículo por mantenimiento, seguridad o necesidad operativa no constituye por sí mismo una sanción.'},
   {id:'tr15',title:'Vigencia, modificación y terminación de la asignación',source:'custom',included:true,text:'La asignación comenzará en la fecha indicada en el Anexo 1 y se mantendrá mientras exista la necesidad operativa, la relación que le da origen y el cumplimiento de las condiciones establecidas. El Cartel Studio podrá finalizar o modificar la asignación por cambio de funciones, necesidad operativa, mantenimiento, seguridad, incumplimiento, terminación de la relación principal o cualquier otra causa legítima que corresponda. Cualquier modificación sustancial deberá quedar documentada.'},
   {id:'tr16',title:'Devolución y cierre de la asignación',source:'custom',included:true,text:'Al finalizar la asignación, la persona deberá devolver el vehículo, llaves, documentos, accesorios y demás medios relacionados y participar en la revisión de entrega. El estado del vehículo será comparado con el registrado al inicio, considerando el desgaste normal. La devolución se documentará mediante el Acta de cierre / devolución de transportación, en la que se consignarán el estado final, faltantes, incidencias, gastos o asuntos pendientes. La recepción física del vehículo podrá quedar sujeta a una comprobación técnica posterior cuando resulte necesario.'},
   {id:'tr17',title:'Declaraciones, integridad documental y comunicaciones',source:'custom',included:true,text:'Los anexos, inventarios, fotografías, reportes de mantenimiento, incidencias y actas de entrega o devolución que se incorporen a este expediente forman parte de la documentación de la asignación. Las autorizaciones, gastos extraordinarios, modificaciones o acuerdos relevantes deberán poder acreditarse por escrito o por los canales internos utilizados por El Cartel Studio.'},
   {id:'tr18',title:'Aceptación y firmas',source:'candidate',included:true,text:'',use_override:true,override_text:'Con su firma, las partes manifiestan haber leído y comprendido el contenido de este contrato y sus anexos. La persona asignada reconoce haber recibido el medio y los elementos relacionados en el estado consignado, así como conocer las reglas de uso, custodia, seguridad, mantenimiento, reporte de incidencias y devolución.\n\nPERSONA ASIGNADA\nNombre: ________________________________________________\nCarné de Identidad: ______________________________\nCargo / función: ______________________________\nFirma: ______________________________\nFecha: ____ / ____ / ________\n\nPOR EL CARTEL STUDIO\nNombre: ________________________________________________\nCargo: ______________________________\nFirma: ______________________________\nFecha: ____ / ____ / ________'}

   {id:'trl6',title:'Estado del vehículo al momento de la devolución',source:'custom',included:true,text:'El estado mecánico, eléctrico, estético y general del vehículo será comparado con el estado inicial documentado al momento de su entrega, teniendo en cuenta el desgaste normal derivado del uso autorizado. La recepción física del vehículo no implica automáticamente la aceptación definitiva de su estado técnico cuando sea necesaria una revisión posterior. El Cartel Studio podrá realizar una comprobación técnica complementaria dentro de un plazo razonable cuando existan condiciones que no puedan verificarse adecuadamente durante la entrega inicial.'},

   {id:'trl8',title:'Documentación y situación administrativa del vehículo',source:'custom',included:true,text:'Se deja constancia de la devolución de la documentación entregada junto con el vehículo y de cualquier documento, trámite, multa, incidencia o situación administrativa conocida que se encuentre pendiente al momento del cierre. Cualquier asunto de esta naturaleza deberá quedar expresamente relacionado en la cláusula «Asuntos pendientes u observaciones».'},

function contractPolicyByKey(key){return agencyPolicies.find(x=>x.key===key)||null}
function normalizeEmploymentPolicyBlocks(doc){
 if(!doc||!Array.isArray(doc.blocks))return doc;
 const dedicatedDefs=[
  {id:'ec9',key:'confidencialidad_manejo_informacion',legacyTitles:['Confidencialidad y manejo de información','Confidencialidad']},
  {id:'ec10',key:'medios_recursos_desempeno_trabajo',legacyTitles:['Medios y recursos para el trabajo']},
  {id:'ec13',key:'termino_relacion_laboral',legacyTitles:['Terminación de la relación laboral']}
 ];
 const dedicatedSources=new Set();
 dedicatedDefs.forEach(def=>{
   const p=contractPolicyByKey(def.key),b=doc.blocks.find(x=>x.id===def.id);
   if(!p||!b)return;
   const src='policy:'+p.id;
   dedicatedSources.add(src);
   if(def.legacyTitles.includes(b.title))b.title=p.label;
   if(def.id==='ec13'&&b.source==='custom'&&String(b.text||'').trim()==='Cláusula contractual de terminación pendiente de ajustar y validar.'){
     b.source=src;b.text='';b.use_override=false;delete b.override_text;
   }
 });
 const existingGenerated=new Map(doc.blocks.filter(b=>String(b.id||'').startsWith('policyblock:')).map(b=>[b.source,b]));
 const applicable=appliedPolicies().filter(p=>!dedicatedSources.has('policy:'+p.id));
 const policyBlocks=applicable.map(p=>{
   const src='policy:'+p.id,old=existingGenerated.get(src);
   return old?{...old,source:src}:{id:'policyblock:'+p.id,title:p.label,source:src,included:true,text:''}
 });
 const cleaned=doc.blocks.filter(b=>b.id!=='ec11'&&b.source!=='policies'&&!String(b.id||'').startsWith('policyblock:'));
 let insertAt=cleaned.findIndex(b=>b.id==='ec10');
 if(insertAt<0)insertAt=cleaned.findIndex(b=>b.id==='ec8');
 insertAt=insertAt<0?cleaned.length:insertAt+1;
 cleaned.splice(insertAt,0,...policyBlocks);
 doc.blocks=cleaned;
 return doc
}

 const mergeContractDoc=(d,sd)=>{if(!sd)return d;const version=Number(d.template_version||0);if(version&&Number(sd.template_version||0)<version){return {...d,...sd,template_version:version,blocks:d.blocks,annexes:d.annexes,presentation:{...(d.presentation||{}),...(sd.presentation||{})},agreement_text:d.agreement_text||sd.agreement_text}}const closure=Number(d.closure_version||0);if(closure&&Number(sd.closure_version||0)<closure){const defaultIds=new Set((d.blocks||[]).map(b=>b.id)),legacyIds=new Set(d.key==='trial_close'?['tcl1','tcl2','tcl3','tcl4','tcl5','tcl6']:d.key==='employment_close'?['ecl1','ecl2','ecl3','ecl4','ecl5','ecl6','ecl7']:[]),extras=(Array.isArray(sd.blocks)?sd.blocks:[]).filter(b=>!legacyIds.has(b.id)&&!defaultIds.has(b.id));return {...d,...sd,closure_version:closure,blocks:[...(d.blocks||[]),...extras],presentation:{...(d.presentation||{}),...(sd.presentation||{})},agreement_text:d.agreement_text||sd.agreement_text}}return {...d,...sd,blocks:Array.isArray(sd.blocks)?sd.blocks:d.blocks}};
 Object.keys(base).forEach(k=>{const sf=saved[k];if(!sf)return;base[k].applies=sf.applies!==undefined?!!sf.applies:base[k].applies;if(Array.isArray(sf.documents))base[k].documents=base[k].documents.map(d=>mergeContractDoc(d,sf.documents.find(x=>x.key===d.key))) });

function contractDisciplineStructuredText(items){

function contractParseSpecificStructuredText(text){
 const raw=String(text||'').trim(),parts=raw.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
 let intro='',items=[];
 for(const part of parts){
   if(part.startsWith('[[SUBCLAUSE]]')){
     const body=part.slice('[[SUBCLAUSE]]'.length),lines=body.split(/\n/),title=(lines.shift()||'').trim(),content=lines.join('\n').trim();
     items.push({title,text:content})
   }else if(!intro)intro=part;
   else{
     const m=part.match(/^([^:\n]{2,120}):\s*([\s\S]+)$/);
     if(m)items.push({title:m[1].trim(),text:m[2].trim()});else intro+=(intro?'\n\n':'')+part
   }
 }
 return {intro:intro||'EL TRABAJADOR desarrollará las funciones y responsabilidades propias de la plaza, entre ellas las siguientes:',items}
}

function activeContractDocumentGroups(){
 const data=contractTemplates();
 return Object.entries(data).filter(([,fam])=>fam&&fam.applies!==false).map(([familyKey,fam])=>({
  familyKey,
  title:String(fam.title||familyKey),
  documents:(fam.documents||[]).map(doc=>({familyKey,docKey:doc.key,title:doc.title,subtitle:doc.subtitle||'',doc}))
 })).filter(group=>group.documents.length)
}
function activeContractDocument(familyKey,docKey){

 if(!fam||fam.applies===false)return null;

}

async function exportRecruitmentPdf(){
 if(!window.html2canvas||!window.jspdf?.jsPDF){alert('No se cargó el generador de PDF.');return}
 let stage=document.getElementById('recruitmentPdfStage');
 if(!stage){
  stage=document.createElement('div');
  stage.id='recruitmentPdfStage';
  stage.className='recruitment-pdf-stage';
  document.body.appendChild(stage)
 }
 stage.innerHTML='';
 const pages=buildRecruitmentPreviewPages(stage);
 if(!pages.length)return;
 try{
  const{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'letter',compress:true});
  for(let i=0;i<pages.length;i++){
   if(i)pdf.addPage('letter','portrait');
   const canvas=await html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
   pdf.addImage(canvas.toDataURL('image/jpeg',.94),'JPEG',0,0,215.9,279.4,undefined,'FAST')
  }
  const safe=(role?.title||'Plaza').replace(/[\\/:*?"<>|]+/g,'-').trim();
  pdf.save('Convocatoria - '+safe+'.pdf');
  await logRoleHistoryEvent('Convocatoria','pdf_generated','PDF de convocatoria generado','Se generó el documento integral de Convocatoria.',{document_title:'Convocatoria'})
 }catch(err){alert('No se pudo generar el PDF: '+(err?.message||err))}
 finally{stage.innerHTML=''}
}
