RecruitmentInline(){const contacts=readRecruitmentContacts(),current=role.work_content&&typeof role.work_content==='object'?role.work_content:{},profiles={enabled:!!document.getElementById('recProfilesEnabled')?.checked,text:(document.getElementById('recProfilesText')?.value||'').trim()};await saveRole({recruitment_text:document.getElementById('recText').value.trim(),recruitment_responsibilities:readList('recResponsibilities'),recruitment_requirements:readList('recRequirements'),recruitment_contacts:contacts,recruitment_contact_phone:contacts[0]?.phone||'',work_content:{...current,recruitment_profiles:profiles}})}function chooseFlyer(){const input=document.getElementById('flyerInput');if(input){input.value='';input.click()}}async function uploadFlyer(input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Selecciona una imagen válida.');if(file.size>10485760)return alert('La imagen supera 10 MB.');const btn=[...document.querySelectorAll('button')].find(x=>x.textContent.includes('Adjuntar / cambiar flyer'));const oldText=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='Subiendo…'}try{const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path='flyers/'+role.id+'-'+Date.now()+'.'+ext;const{error}=await sb.storage.from('hr-recruitment-assets').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(error)throw error;const{data}=sb.storage.from('hr-recruitment-assets').getPublicUrl(path);if(!data||!data.publicUrl)throw new Error('No se pudo obtener la URL de la imagen.');const ok=await saveRole({recruitment_flyer_url:data.publicUrl});if(ok)alert('Flyer actualizado correctamente.')}catch(err){alert('No se pudo subir el flyer: '+(err.message||err))}finally{if(btn){btn.disabled=false;btn.textContent=oldText}}}async function moveApplicantQuestion(index,dir){const form=Array.isArray(role.application_form)?role.application_form.map(q=>typeof q==='object'&&q!==null?{...q}:q):[],target=index+dir;if(index<0||target<0||index>=form.length||target>=form.length)return;const tmp=form[index];form[index]=form[target];form[target]=tmp;const{data,error}=await sb.from('hr_roles').update({application_form:form,updated_at:new Date().toISOString()}).eq('id',role.id).select().single();if(error){alert(error.message);return}role=data;render()}
function rolePublicSlug(){return String(role?.title||'plaza').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
async function previewApplicantForm(){let slug=rolePublicSlug();try{const cycleIds=(cycles||[]).map(x=>x.id).filter(Boolean);if(cycleIds.length){const{data}=await sb.from('hr_vacancies').select('slug,updated_at').in('recruitment_cycle_id',cycleIds).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(data?.slug)slug=data.slug}}catch(_){}window.open('/aplicar.html?plaza='+encodeURIComponent(slug)+'&vista=admin&preview=1','_blank','noopener')}
function editForm(){const form=Array.isArray(role.application_form)?role.application_form:[];const card=[...document.querySelectorAll('.hiring-card')].find(x=>x.textContent.includes('Formulario del aplicante'));if(!card)return;card.innerHTML='<div class="section-head"><div><b>Editar formulario</b><small>Edita las preguntas y cambia su orden con las flechas. El nuevo orden se guarda al moverlas.</small></div><div><button class="btn" onclick="render()">Cancelar</button> <button class="btn primary" onclick="saveFormInline()">Guardar cambios</button></div></div><div id="formOrderStatus" style="display:none;margin:0 0 10px;padding:8px 11px;border-radius:9px;background:#f5f6f7;color:#59626d;font-size:11px;font-weight:800"></div><div id="formEditor">'+form.map((q,i)=>formEditorRow(q,i)).join('')+'</div><button class="btn add-question" onclick="addFormQuestion()">＋ Añadir pregunta</button>';syncFormOrderButtons()}function formEditorRow(q,i){q=typeof q==='string'?{label:q,type:'text',required:false}:q;const opts=Array.isArray(q.options)?q.options.join(', '):'',ph=q.placeholder||'',isInput=!['select','multiselect','yes_no','file'].includes(q.type),large=Number(q.min_height||0)>=180;return '<div class="form-edit-row" data-index="'+i+'" data-key="'+e(q.key||'')+'"><div class="drag">⋮⋮</div><div class="form-edit-main"><input class="edit-label" value="'+e(q.label||q.question||'')+'" placeholder="Escribe la pregunta"><div class="form-edit-controls"><select class="edit-type" onchange="toggleQuestionConfig(this)"><option value="text" '+(q.type==='text'?'selected':'')+'>Texto corto</option><option value="phone" '+(q.type==='phone'?'selected':'')+'>Teléfono numérico</option><option value="textarea" '+(q.type==='textarea'?'selected':'')+'>Texto largo</option><option value="number" '+(q.type==='number'?'selected':'')+'>Número</option><option value="url" '+(q.type==='url'?'selected':'')+'>Enlace</option><option value="file" '+(q.type==='file'?'selected':'')+'>Archivo</option><option value="yes_no" '+(q.type==='yes_no'?'selected':'')+'>Sí / No</option><option value="select" '+(q.type==='select'?'selected':'')+'>Selección única</option><option value="multiselect" '+(q.type==='multiselect'?'selected':'')+'>Selección múltiple</option></select><label class="required-check"><input class="edit-required" type="checkbox" '+(q.required?'checked':'')+'> Obligatoria</label><button class="icon-btn form-order-up" type="button" onclick="moveFormQuestion(this,-1)" title="Subir pregunta">↑</button><button class="icon-btn form-order-down" type="button" onclick="moveFormQuestion(this,1)" title="Bajar pregunta">↓</button><button class="icon-btn" type="button" onclick="removeFormQuestion(this)" title="Eliminar">×</button></div><input class="edit-options" value="'+e(opts)+'" placeholder="Opciones separadas por coma" style="display:'+(['select','multiselect'].includes(q.type)?'block':'none')+'"><input class="edit-placeholder" value="'+e(ph)+'" placeholder="Texto de ayuda dentro del campo (opcional)" style="display:'+(isInput?'block':'none')+';width:100%;border:1px solid #dcdcd7;border-radius:9px;background:#fff;padding:10px;font:inherit;margin-top:8px"><label class="required-check edit-large-wrap" style="display:'+(q.type==='textarea'?'inline-flex':'none')+';align-items:center;gap:7px;margin-top:9px"><input class="edit-large" type="checkbox" '+(large?'checked':'')+'> Campo de respuesta amplio</label></div></div>'}
function toggleQuestionConfig(sel){const row=sel.closest('.form-edit-row'),type=sel.value;row.querySelector('.edit-options').style.display=['select','multiselect'].includes(type)?'block':'none';row.querySelector('.edit-placeholder').style.display=!['select','multiselect','yes_no','file'].includes(type)?'block':'none';row.querySelector('.edit-large-wrap').style.display=type==='textarea'?'inline-flex':'none'}
function toggleOptionEditor(sel){toggleQuestionConfig(sel)}
function addFormQuestion(){const box=document.getElementById('formEditor');box.insertAdjacentHTML('beforeend',formEditorRow({label:'',type:'text',required:false},box.children.length));syncFormOrderButtons();box.lastElementChild.querySelector('.edit-label').focus()}
function removeFormQuestion(btn){btn.closest('.form-edit-row').remove();syncFormOrderButtons()}
function syncFormOrderButtons(){const rows=[...document.querySelectorAll('#formEditor .form-edit-row')];rows.forEach((row,i)=>{row.dataset.index=i;const up=row.querySelector('.form-order-up'),down=row.querySelector('.form-order-down');if(up)up.disabled=i===0;if(down)down.disabled=i===rows.length-1})}
function collectFormEditorData(){const old=Array.isArray(role.application_form)?role.application_form:[],oldByKey=Object.fromEntries(old.filter(q=>q&&typeof q==='object'&&q.key).map(q=>[q.key,q])),rows=[...document.querySelectorAll('#formEditor .form-edit-row')];return rows.map((row,i)=>{const type=row.querySelector('.edit-type').value,label=row.querySelector('.edit-label').value.trim(),existingKey=row.dataset.key||'',prev=oldByKey[existingKey]||{},q={...prev,key:prev.key||('question_'+Date.now()+'_'+i),label,type,required:row.querySelector('.edit-required').checked};if(['select','multiselect'].includes(type))q.options=row.querySelector('.edit-options').value.split(',').map(x=>x.trim()).filter(Boolean);else delete q.options;const placeholder=row.querySelector('.edit-placeholder').value.trim();if(placeholder&&!['select','multiselect','yes_no','file'].includes(type))q.placeholder=placeholder;else delete q.placeholder;if(type==='textarea'){if(row.querySelector('.edit-large').checked)q.min_height=220;else delete q.min_height}else delete q.min_height;if(type==='phone'){q.inputmode='numeric';q.max_length=Number(q.max_length)||15;delete q.min;delete q.max}else if(type==='number'){if(q.key==='age'){q.inputmode='numeric';q.max_length=2;q.min=16;q.max=99}}else{delete q.inputmode;delete q.max_length;delete q.min;delete q.max}return q}).filter(q=>q.label)}
async function persistFormEditorData({keepEditor=false,statusText=''}={}){const data=collectFormEditorData(),now=new Date().toISOString();const{data:updated,error}=await sb.from('hr_roles').update({application_form:data,updated_at:now}).eq('id',role.id).select().single();if(error){alert(error.message);return false}role=updated;if(keepEditor){const status=document.getElementById('formOrderStatus');if(status){status.textContent=statusText||'Orden actualizado en el formulario del candidato.';status.style.display='block';clearTimeout(window.formOrderStatusTimer);window.formOrderStatusTimer=setTimeout(()=>{if(status)status.style.display='none'},1800)}return true}render();return true}
async function moveFormQuestion(btn,dir){const row=btn.closest('.form-edit-row'),box=document.getElementById('formEditor');if(!row||!box)return;const target=dir<0?row.previousElementSibling:row.nextElementSibling;if(!target)return;if(dir<0)box.insertBefore(row,target);else box.insertBefore(target,row);syncFormOrderButtons();await persistFormEditorData({keepEditor:true,statusText:'Orden guardado. El formulario público ya usa esta secuencia.'})}
async function saveFormInline(){await persistFormEditorData()}
function replyEntries(){return Object.entries(role.automatic_replies||{}).sort((a,b)=>a[0].localeCompare(b[0],'es',{numeric:true}))}
function replyEditorRow(name,value=''){return '<div class="form-edit-row reply-edit-row" data-reply-original="'+e(name||'')+'"><div class="drag">⋮⋮</div><div class="form-edit-main"><input class="reply-name" value="'+e(name||'')+'" placeholder="Nombre de la respuesta, ej. 01 · Invitación a completar formulario"><textarea class="reply-text rec-textarea" onfocus="window.activeReply=this" placeholder="Escribe el mensaje automático">'+e(value||'')+'</textarea></div><button class="icon-btn" type="button" onclick="removeReplyRow(this)" title="Eliminar respuesta">×</button></div>'}
function editReplies(){const card=[...document.querySelectorAll('.hiring-card')].find(x=>x.textContent.includes('Respuestas automáticas'));if(!card)return;const vars=['NOMBRE','PLAZA','ENLACE_FORMULARIO','FECHA','HORA','DIRECCION','CONTACTO','TELEFONO','NOTA_LLEGADA','FECHA_INICIO','DURACION','HORARIO','REMUNERACION','REMUNERACION_PRUEBA','ACLARACION_REMUNERACION_PRUEBA','LUGAR'];card.innerHTML='<div class="section-head"><div><b>Comunicaciones automáticas</b><small>Cada plaza puede tener la cantidad de respuestas que necesite. La plantilla inicial es solo un punto de partida.</small></div><div><button class="btn" onclick="render()">Cancelar</button> <button class="btn primary" onclick="saveRepliesMaster()">Guardar cambios</button></div></div><div style="margin:12px 0;padding:12px;border:1px solid #ddd;border-radius:12px"><small class="section-label">Variables disponibles</small><div class="qoptions">'+vars.map(v=>'<span onclick="insertReplyVar(\'{{'+v+'}}\')" style="cursor:pointer">{{'+v+'}}</span>').join('')+'</div></div><div id="replyEditor">'+replyEntries().map(([k,v])=>replyEditorRow(k,v)).join('')+'</div><button class="btn" type="button" onclick="addReplyRow()" style="margin-top:12px">+ Añadir respuesta</button>'}
function addReplyRow(){const box=document.getElementById('replyEditor');if(!box)return;box.insertAdjacentHTML('beforeend',replyEditorRow('',''));const row=box.lastElementChild;row.querySelector('.reply-name')?.focus()}
function removeReplyRow(btn){btn.closest('.reply-edit-row')?.remove()}
function insertReplyVar(v){const t=window.activeReply;if(!t)return alert('Primero selecciona el mensaje donde quieres insertar la variable.');const s=t.selectionStart||0,en=t.selectionEnd||0;t.value=t.value.slice(0,s)+v+t.value.slice(en);t.focus();t.selectionStart=t.selectionEnd=s+v.length}
async function saveRepliesMaster(){const o={};for(const r of document.querySelectorAll('#replyEditor .reply-edit-row')){const name=(r.querySelector('.reply-name')?.value||'').trim(),value=(r.querySelector('.reply-text')?.value||'').trim();if(!name&&!value)continue;if(!name){alert('Ponle un nombre a todas las respuestas antes de guardar.');return}if(Object.prototype.hasOwnProperty.call(o,name)){alert('Hay dos respuestas con el mismo nombre: '+name);return}o[name]=value}await saveRole({automatic_replies:o})}async function editRole(){const description=prompt('Descripción general',role.description||'');if(description===null)return;const schedule=prompt('Horario',role.schedule||'');if(schedule===null)return;const{data,error}=await sb.from('hr_roles').update({description,schedule,updated_at:new Date().toISOString()}).eq('id',role.id).select().single();if(error)return alert(error.message);role=data;render()}boot();</script></body></html>
