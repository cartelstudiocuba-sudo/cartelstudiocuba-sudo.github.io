name: Contract master parity
on: [push, pull_request]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-contract-paper.cjs --check
      - run: node scripts/check-contract-renderer.cjs
