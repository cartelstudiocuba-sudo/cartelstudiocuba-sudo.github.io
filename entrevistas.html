g('es-ES',{weekday:'short',day:'numeric',month:'short'})}let interviewFilter='scheduled';function setInterviewFilter(value){interviewFilter=value;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===value));renderList()}function interviewState(x){const iv=interviews.find(v=>String(v.candidate_id)===String(x.id));if(iv?.attendance_status==='absent'||iv?.attendance_status==='no_show')return 'absent';if(iv?.completed_at||x.status==='interviewed')return 'done';return 'scheduled'}function renderList(){renderInterviewStats();if(document.getElementById('agendaView').style.display!=='none')renderAgenda();const query=(document.getElementById('interviewSearch')?.value||'').toLocaleLowerCase().trim();const rows=candidates.filter(x=>interviewState(x)===interviewFilter&&(!query||(String(x.full_name||'')+' '+interviewRole(x)+' '+String(x.municipality||'')).toLocaleLowerCase().includes(query)));candidateList.innerHTML=rows.map(x=>{const iv=interviews.find(v=>String(v.candidate_id)===String(x.id)),state=interviewState(x),initials=String(x.full_name||'').trim().split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase();return '<div class="card candidate"><div class="candidate-main"><div class="candidate-avatar">'+esc(initials)+'</div><div class="candidate-copy"><h3>'+esc(x.full_name)+'</h3><div class="candidate-role">'+esc(interviewRole(x))+'</div><div class="summary"><span class="chip">▦ '+esc(fmtDate(iv?.interview_date))+'</span><span class="chip">◷ '+esc(String(iv?.interview_time||'').slice(0,5)||'Hora pendiente')+'</span><span class="chip">♙ '+esc(iv?.interviewer||'Entrevistador pendiente')+'</span></div></div></div><div class="candidate-side"><span class="pill '+(state==='done'?'confirmed':'')+'">'+(state==='done'?'Realizada':state==='absent'?'No asistió':'Entrevista programada')+'</span><button class="btn dark" onclick="startInterview(&quot;'+x.id+'&quot;)">Ver ficha →</button></div></div>'}).join('')||'<div class="empty">No hay entrevistas en este filtro.</div>'}function renderInterviewStats(){const scheduled=candidates.filter(x=>interviewState(x)==='scheduled').length,done=candidates.filter(x=>interviewState(x)==='done').length,absent=candidates.filter(x=>interviewState(x)==='absent').length;interviewStats.textContent='Agenda y seguimiento de entrevistas';document.getElementById('metricScheduled').textContent=scheduled;document.getElementById('metricDone').textContent=done;document.getElementById('metricAbsent').textContent=absent}let agendaMode='week',agendaAnchor=new Date();
function agendaDayKey(v){return String(v||'').slice(0,10)}
function agendaShift(n){const d=new Date(agendaAnchor);d.setDate(d.getDate()+(agendaMode==='day'?n:agendaMode==='week'?n*7:n*30));agendaAnchor=d;renderAgenda()}
function agendaScope(date){const d=new Date(date+'T12:00:00'),a=new Date(agendaAnchor);if(Number.isNaN(d.getTime()))return false;if(agendaMode==='day')return d.toDateString()===a.toDateString();if(agendaMode==='month')return d.getFullYear()===a.getFullYear()&&d.getMonth()===a.getMonth();const monday=new Date(a);monday.setDate(a.getDate()-(a.getDay()+6)%7);monday.setHours(0,0,0,0);const end=new Date(monday);end.setDate(end.getDate()+7);return d>=monday&&d<end}
function agendaSetMode(mode){agendaMode=mode;agendaAnchor=new Date();renderAgenda()}
function toggleAgenda(){const el=document.getElementById('agendaView'),list=document.getElementById('listView'),showListNow=list.style.display==='none';list.style.display=showListNow?'block':'none';el.style.display=showListNow?'none':'block';document.getElementById('agendaToggle').textContent=showListNow?'📅 Ver agenda':'☷ Ver lista';if(!showListNow)renderAgenda();else renderList()}
function renderAgenda(){const el=document.getElementById('agendaView');if(!el)return;const all=candidates.map(x=>({x,iv:interviews.find(v=>String(v.candidate_id)===String(x.id))||{}}));const rows=all.filter(v=>agendaScope(agendaDayKey(v.iv.interview_date))).sort((a,b)=>String(a.iv.interview_date||'').localeCompare(String(b.iv.interview_date||''))||String(a.iv.interview_time||'').localeCompare(String(b.iv.interview_time||'')));const heading=agendaMode==='day'?agendaAnchor.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):agendaMode==='month'?agendaAnchor.toLocaleDateString('es-ES',{month:'long',year:'numeric'}):'Semana del '+(()=>{const d=new Date(agendaAnchor);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toLocaleDateString('es-ES',{day:'numeric',month:'long'})})();const count=all.filter(v=>!!v.iv.interview_date).length;let lastDay='';const cards=rows.map(({x,iv})=>{const day=agendaDayKey(iv.interview_date);let group='';if(day!==lastDay){lastDay=day;group='<h3 class="agenda-date-heading">'+esc(new Date(day+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))+'</h3>'}const state=interviewState(x);return group+'<div class="agenda-item"><div class="agenda-hour">'+esc(String(iv.interview_time||'').slice(0,5)||'—')+'</div><div class="agenda-person"><strong>'+esc(x.full_name||'Candidato')+'</strong><span>'+esc(vacancies.find(v=>String(v.id)===String(x.vacancy_id))?.title||'Plaza')+' · '+esc(iv.interviewer||'Entrevistador pendiente')+'</span></div><div class="agenda-item-side"><span class="agenda-state">'+(state==='done'?'Realizada':state==='absent'?'No asistió':'Programada')+'</span><button class="btn dark" onclick="startInterview('+JSON.stringify(String(x.id)).replace(/"/g,"'")+')">Abrir entrevista →</button></div></div>'}).join('');el.innerHTML='<div class="agenda-top"><div><div class="section-title">PLANIFICACIÓN</div><h2>Agenda de entrevistas</h2><div class="muted">'+count+' citas registradas · '+rows.length+' en este período</div></div><div class="agenda-view-modes">'+['day','week','month'].map((v,i)=>'<button class="btn '+(agendaMode===v?'primary':'dark')+'" onclick="agendaSetMode(\''+v+'\')">'+['Hoy','Semana','Mes'][i]+'</button>').join('')+'</div></div><div class="agenda-navigation"><button class="btn dark" onclick="agendaShift(-1)">← Anterior</button><b>'+esc(heading)+'</b><button class="btn dark" onclick="agendaShift(1)">Siguiente →</button></div>'+(cards||'<div class="agenda-empty">No hay entrevistas programadas para este período. Puedes cambiar de semana o consultar la lista completa.</div>')}
function showList(){interviewView.style.display='none';current=null;if(document.getElementById('agendaView').style.display==='none')listView.style.display='block';else renderAgenda()}function showInterviewTab(){if(!current)return;listView.style.display='none';document.getElementById('agendaView').style.display='none';interviewView.style.display='block'}async function startInterview(id){current=candidates.find(x=>String(x.id)===String(id));if(!current)return;showInterviewTab();interviewBody.innerHTML='<div class="panel" style="padding:22px">Cargando ficha de entrevista…</div>';const target=String(id);try{const {data,error}=await sb.from('hr_candidate_answers').select('candidate_id,question_key,answer').eq('candidate_id',id);if(error)throw error;if(!current||String(current.id)!==target)return;answers=answers.filter(a=>String(a.candidate_id)!==target).concat(data||[]);renderInterview()}catch(e){if(current&&String(current.id)===target)interviewBody.innerHTML='<div class="panel" style="padding:22px">No se pudieron cargar las respuestas. <button class="btn primary" onclick="startInterview('+JSON.stringify(String(id)).replace(/"/g,'&quot;')+')">Reintentar</button></div>';console.warn('Interview answers unavailable',e)}}function val(k){return localStorage.getItem('hrint:'+current.id+':'+k)||''}function save(k,v){localStorage.setItem('hrint:'+current.id+':'+k,v)}function renderInterview(){const x=current,a=amap(x.id),iv=interviews.find(v=>v.candidate_id===x.id)||{},notes=iv.interview_notes||{};interviewBody.innerHTML=`<div class="print-head"><b>EL CARTEL STUDIO · ENTREVISTA DE CANDIDATO</b><div>Plaza: ${esc(interviewRole(x))}</div></div>${OPENING_GUIDE}<div class="panel" style="padding:18px"><div class="brand">FICHA PARA ENTREVISTA</div><h1 style="font-size:28px">${esc(x.full_name)}</h1><div class="summary"><span class="chip">${iv.attendance_status==='confirmed'?'✓ Asistencia confirmada':'Confirmación pendiente'}</span><span class="chip">Edad: ${esc(a.age||'—')}</span><span class="chip">Municipio: ${esc(x.municipality||'—')}</span><span class="chip">Estudios: ${esc(a.education_level||'—')}</span><span class="chip">Experiencia: ${esc(x.experience_range||'—')}</span><span class="chip">Excel: ${esc(x.excel_level||'—')}</span></div><div class="candidate-context"><div class="context-box"><span class="context-label">Experiencia laboral declarada</span>${esc(a.experience_description||'No especificada')}</div><div class="context-box"><span class="context-label">Habilidad principal / punto fuerte</span>${esc(a.main_strength||'No especificada')}</div></div></div><div class="panel appointment no-print"><div class="section-title">Datos de la cita</div><div class="appointment-grid"><div><label>Fecha</label><input id="ivDate" type="date" value="${esc(iv.interview_date||'')}"></div><div><label>Hora</label><input id="ivTime" type="time" value="${esc(String(iv.interview_time||'').slice(0,5))}"></div><div><label>Entrevistador</label><input id="ivInterviewer" value="${esc(iv.interviewer||'')}" placeholder="Nombre del entrevistador"></div><div><label>Teléfono</label><input id="ivPhone" value="${esc(iv.contact_phone||'')}" placeholder="Teléfono de contacto"></div></div><label>Lugar</label><input id="ivPlace" value="${esc(iv.place||'')}" placeholder="Lugar de la entrevista"><div class="toolbar"><button class="btn primary" onclick="saveAppointment()">Guardar cambios</button></div></div>${Q.map((q,i)=>{const group=i===0||Q[i-1][0]!==q[0]?`<div class="group-title">${esc(q[0])}</div>`:'';return group+`<div class="question"><div class="section-title">${i+1}. ${esc(q[0])}</div><h3>${esc(q[1])}</h3><div class="follow">Repregunta / guía: ${esc(q[2])}</div><textarea class="no-print" placeholder="Notas de la respuesta…" onblur="saveInterviewNote('q${i}',this.value)">${esc(notes['q'+i]||'')}</textarea></div>`}).join('')}<div class="panel evaluation-panel"><div class="section-title">Evaluación interna del entrevistador</div><h2>Conclusiones de la entrevista</h2><div class="evaluation-help">Esta información es interna y alimentará automáticamente la sección Evaluación interna del perfil del candidato.</div><div class="evaluation-grid"><label class="evaluation-field"><span>Primera impresión</span><textarea id="evalFirstImpression" onblur="saveCandidateEvaluation()" placeholder="Impresión general obtenida durante la entrevista…">${esc(x.internal_first_impression||'')}</textarea></label><label class="evaluation-field"><span>Encaje con la plaza</span><textarea id="evalRoleFit" onblur="saveCandidateEvaluation()" placeholder="Cómo encaja el candidato con las necesidades de la plaza…">${esc(x.internal_role_fit||'')}</textarea></label><label class="evaluation-field"><span>Puntos fuertes</span><textarea id="evalStrengths" onblur="saveCandidateEvaluation()" placeholder="Fortalezas observadas durante la entrevista…">${esc(x.internal_strengths||'')}</textarea></label><label class="evaluation-field"><span>Validar en entrevista</span><textarea id="evalChecks" onblur="saveCandidateEvaluation()" placeholder="Aspectos comprobados o que requieren mayor profundización…">${esc(x.internal_interview_checks||'')}</textarea></label><label class="evaluation-field full"><span>Observaciones internas</span><textarea id="evalInternalNotes" onblur="saveCandidateEvaluation()" placeholder="Notas internas de RRHH. El candidato no ve esta información.">${esc(x.internal_notes||'')}</textarea></label></div></div><div class="panel final"><div class="section-title">Observaciones generales del entrevistador</div><textarea class="no-print" id="generalNotes" placeholder="Notas generales de la conversación…">${esc(iv.general_notes||'')}</textarea><div class="toolbar no-print"><button class="btn primary" onclick="markInterviewed()">Guardar y finalizar entrevista</button><button class="btn dark" onclick="window.print()">Imprimir / guardar PDF</button></div></div>`}async function saveAppointment(){const iv=interviews.find(v=>v.candidate_id===current.id);if(!iv)return alert('No existe una cita guardada.');const payload={interview_date:ivDate.value||null,interview_time:ivTime.value||null,interviewer:ivInterviewer.value.trim(),contact_phone:ivPhone.value.trim(),place:ivPlace.value.trim(),updated_at:new Date().toISOString()};const{data,error}=await sb.from('hr_interviews').update(payload).eq('candidate_id',current.id).select().single();if(error)return alert(error.message);interviews=interviews.filter(v=>v.candidate_id!==current.id);interviews.push(data);renderList();alert('Datos de la entrevista actualizados.')}async function saveInterviewNote(k,v){const iv=interviews.find(x=>x.candidate_id===current.id);if(!iv)return;const notes={...(iv.interview_notes||{}),[k]:v};const{data,error}=await sb.from('hr_interviews').update({interview_notes:notes,updated_at:new Date().toISOString()}).eq('candidate_id',current.id).select().single();if(!error){interviews=interviews.filter(x=>x.candidate_id!==current.id);interviews.push(data)}}function candidateEvaluationPayload(){return {internal_first_impression:(document.getElementById('evalFirstImpression')?.value||'').trim(),internal_role_fit:(document.getElementById('evalRoleFit')?.value||'').trim(),internal_strengths:(document.getElementById('evalStrengths')?.value||'').trim(),internal_interview_checks:(document.getElementById('evalChecks')?.value||'').trim(),internal_notes:(document.getElementById('evalInternalNotes')?.value||'').trim()}}
async function saveCandidateEvaluation(){if(!current)return;const patch=candidateEvaluationPayload(),{error}=await sb.from('hr_candidates').update(patch).eq('id',current.id);if(error){console.error('No se pudo guardar la evaluación interna',error);return}Object.assign(current,patch)}
async function markInterviewed(){if(!current)return;const iv=interviews.find(v=>v.candidate_id===current.id);if(!iv)return alert('No existe una entrevista guardada.');const now=new Date().toISOString();const{error:ie}=await sb.from('hr_interviews').update({general_notes:generalNotes.value.trim(),completed_at:now,updated_at:now}).eq('candidate_id',current.id);if(ie)return alert(ie.message);const evaluation=candidateEvaluationPayload();const{error}=await sb.from('hr_candidates').update({...evaluation,status:'interviewed',decision_status:'pending',decision_updated_at:now}).eq('id',current.id);if(error)return alert(error.message);alert('Entrevista y evaluación interna guardadas. El candidato quedó en Por decidir.');candidates=candidates.filter(x=>x.id!==current.id);current=null;showList();renderList()}function interviewPrintHtml(x){const a=amap(x.id),iv=interviews.find(v=>v.candidate_id===x.id)||{},notes=iv.interview_notes||{};return '<section class="all-print-interview"><div class="print-head" style="display:block"><b>EL CARTEL STUDIO · ENTREVISTA DE CANDIDATO</b><div>Plaza: '+esc(interviewRole(x))+'</div></div>'+OPENING_GUIDE+'<div class="panel" style="padding:18px"><div class="brand">FICHA PARA ENTREVISTA</div><h1 style="font-size:28px">'+esc(x.full_name)+'</h1><div class="summary"><span class="chip">Fecha: '+esc(fmtDate(iv.interview_date))+'</span><span class="chip">Hora: '+esc(String(iv.interview_time||'').slice(0,5)||'—')+'</span><span class="chip">Entrevistador: '+esc(iv.interviewer||'—')+'</span><span class="chip">Edad: '+esc(a.age||'—')+'</span><span class="chip">Municipio: '+esc(x.municipality||'—')+'</span></div><div class="candidate-context"><div class="context-box"><span class="context-label">Experiencia laboral declarada</span>'+esc(a.experience_description||'No especificada')+'</div><div class="context-box"><span class="context-label">Habilidad principal / punto fuerte</span>'+esc(a.main_strength||'No especificada')+'</div></div></div>'+Q.map((q,i)=>'<div class="question"><div class="section-title">'+(i+1)+'. '+esc(q[0])+'</div><h3>'+esc(q[1])+'</h3><div class="follow">Repregunta / guía: '+esc(q[2])+'</div><div class="saved-answer">'+esc(notes['q'+i]||'')+'</div></div>').join('')+'</section>'}function printAllInterviews(){if(!candidates.length)return alert('No hay entrevistas programadas para imprimir.');allPrintView.innerHTML=candidates.map(interviewPrintHtml).join('');document.body.classList.add('print-all');const cleanup=()=>{document.body.classList.remove('print-all');window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);window.print()}function printCurrent(){if(!current){alert('Abre primero la entrevista de un candidato.');return}window.print()}CartelLoad.run("boot",boot);</script></body></html>
