ew"></div></div><script>const U='https://jhumvctocphyiwhszeaz.supabase.co',K='sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn',MAIL='cartelstudiocuba@gmail.com';const OPENING_GUIDE='<div class="opening-guide"><div class="section-title">Guía de apertura</div><h3>Antes de comenzar la entrevista</h3><ol><li>Preséntate e indica tu cargo o función dentro de El Cartel Studio.</li><li>Ofrece una breve explicación de El Cartel Studio y de la plaza para la que se está realizando la entrevista.</li><li>Explica que se realizarán varias preguntas para completar y validar la información necesaria para el proceso de selección y el registro interno del candidato.</li><li>Indica que al finalizar la entrevista el candidato tendrá un espacio para realizar preguntas o aclarar cualquier duda.</li><li>Aclara que esta entrevista forma parte del proceso de selección y no implica una contratación ni una decisión inmediata. En caso de avanzar o ser seleccionado, se le notificará posteriormente.</li></ol><div class="opening-script"><b>Ejemplo de introducción:</b><br>“Hola, soy [nombre], [cargo] en El Cartel Studio. Antes de comenzar, te cuento brevemente sobre la agencia y sobre la plaza. Durante la entrevista vamos a hacerte algunas preguntas para completar la información que necesitamos dentro del proceso de selección. Al final tendrás un espacio para preguntarnos cualquier duda que tengas. Esta entrevista no significa que exista una decisión de contratación en este momento; si continúas avanzando en el proceso, te lo notificaremos posteriormente.”</div></div>';const sb=CartelLoad.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:localStorage}});let candidates=[],answers=[],interviews=[],vacancies=[],current=null;function interviewRole(x){return vacancies.find(v=>String(v.id)===String(x.vacancy_id))?.title||x.role_title||x.vacancy_title||'Plaza no indicada'}async function fetchInterviewAnswers(){const all=[],size=1000;for(let from=0;;from+=si ];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function amap(id){const o={};answers.filter(a=>String(a.candidate_id)===String(id)).forEach(a=>o[a.question_key]=a.answer);return o}async function boot(){const params=new URLSearchParams(location.search),vacancyParam=params.get('vacancy')||'',candidateParam=params.get('candidate')||'';const back=document.getElementById('backCandidates');if(back&&vacancyParam)back.href='/rrhh.html?embedded=1&vacancy='+encodeURIComponent(vacancyParam);const cPromise=sb.from('hr_candidates').select('id,full_name,status,vacancy_id,municipality,submitted_at,experience_range,excel_level').in('status',['interview_scheduled','interviewed']).order('submitted_at',{ascending:false});const iPromise=sb.from('hr_interviews').select('*').order('interview_date',{ascending:true});const vPromise=sb.from('hr_vacancies').select('id,title');const authPromise=sb.auth.getSession();const [c,i]=await Promise.all([cPromise,iPromise]);if(c.error||i.error)throw Object.assign(new Error('read_failed'),{code:'read_failed'});candidates=c.data||[];interviews=i.data||[];if(vacancyParam)candidates=candidates.filter(x=>String(x.vacancy_id||'')===String(vacancyParam));renderList();renderInterviewStats();renderAgenda();if(candidateParam&&candidates.some(x=>String(x.id)===String(candidateParam)))startInterview(candidateParam);vPromise.then(v=>{if(v.error)return;vacancies=v.data||[];document.getElementById('interviewTitle').textContent='Entrevistas · '+(vacancies.find(x=>String(x.id)===vacancyParam)?.title||'Todas las plazas');renderList();if(current)renderInterview()}).catch(e=>console.warn('Vacancies unavailable',e));authPromise.then(({data:{session}})=>{if(!session||String(session.user.email||'').toLowerCase()!==MAIL)location.href='/rrhh.html'}).catch(e=>console.warn('Session verification unavailable',e))}function fmtDate(v){if(!v)return 'Fecha pendiente';return new Date(v+'T12:00:00').toLocaleDateStrin function agendaDayKey(v){return String(v||'').slice(0,10)}

function agendaCalendarMarkup(all){const y=agendaAnchor.getFullYear(),m=agendaAnchor.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset),counts=new Set(all.map(v=>agendaDayKey(v.iv.interview_date)).filter(Boolean)),selected=agendaDayKey([agendaAnchor.getFullYear(),String(agendaAnchor.getMonth()+1).padStart(2,'0'),String(agendaAnchor.getDate()).padStart(2,'0')].join('-'));let cells=['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x=>'<span class="agenda-weekday">'+x+'</span>').join('');for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');cells+='<button type="button" class="agenda-day'+(d.getMonth()!==m?' outside':'')+(counts.has(key)?' has-cites':'')+(key===selected?' selected':'')+'" onclick="agendaSelectDate(\''+key+'\')" aria-label="'+esc(d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}))+'" aria-pressed="'+(key===selected)+'">'+d.getDate()+'</button>'}return '<div class="agenda-calendar"><div class="agenda-calendar-head"><button type="button" onclick="agendaChangeMonth(-1)" aria-label="Mes anterior">‹</button><strong>'+esc(agendaAnchor.toLocaleDateString('es-ES',{month:'long',year:'numeric'}))+'</strong><button type="button" onclick="agendaChangeMonth(1)" aria-label="Mes siguiente">›</button></div><div class="agenda-calendar-grid">'+cells+'</div></div>'}

full_name)+'"><div class="agenda-hour">'+esc(String(iv.interview_time||'').slice(0,5)||'—')+'</div><div class="agenda-avatar">'+esc(initials)+'</div><div class="agenda-person"><strong>'+esc(x.full_name||'Candidato')+'</strong><div class="agenda-role-line"><span class="agenda-role-badge"><span aria-hidden="true">▣</span>'+esc(vacancies.find(v=>String(v.id)===String(x.vacancy_id))?.title||'Plaza')+'</span><span class="agenda-interviewer">♙ '+esc(iv.interviewer||'Pendiente')+'</span></div></div><div class="agenda-item-side"><span class="agenda-state">'+(state==='done'?'Realizada':state==='absent'?'No asistió':'Programada')+'</span><span class="agenda-arrow" aria-hidden="true">›</span></div></div>'}).join('');el.innerHTML='<div class="agenda-top"><div><div class="agenda-banner-icon" aria-hidden="true">▦</div><div class="agenda-banner-copy"><h2>Agenda de entrevistas</h2><div class="muted">'+all.filter(v=>!!v.iv.interview_date).length+' citas registradas · '+rows.length+' en total</div></div></div><div class="agenda-view-modes"><button type="button" class="btn primary agenda-print-btn" onclick="printAllInterviews()">▣ Imprimir / PDF</button></div></div><div class="agenda-mixed"><aside class="agenda-sidebar">'+agendaCalendarMarkup(all)+'<div class="agenda-sidebar-stats"><div class="agenda-sidebar-stat"><span class="agenda-sidebar-stat-icon">▦</span><div><strong>'+scheduled+'</strong><small>Programadas</small></div></div><div class="agenda-sidebar-stat"><span class="agenda-sidebar-stat-icon">✓</span><div><strong>'+done+'</strong><small>Realizadas</small></div></div><div class="agenda-sidebar-stat"><span class="agenda-sidebar-stat-icon">♙</span><div><strong>'+absent+'</strong><small>Ausencias</small></div></div></div></aside><div class="agenda-main">'+(cards||'<div class="agenda-empty">No hay entrevistas registradas.</div>')+'</div></div>'}
function showList(){interviewView.style.display='none';current=null;if(document.getElementById('agendaView').style.display==='none')listView.style.display='block';else renderAgenda()}function showInterviewTab(){if(!current)return;listView.style.display='none';document.getElementById('agendaView').style.display='none';interviewView.style.display='block'}async function startInterview(id){current=candidates.find(x=>String(x.id)===String(id));if(!current)return;showInterviewTab();interviewBody.innerHTML='<div class="panel" style="padding:22px">Cargando ficha de entrevista…</div>';const target=String(id);try{const {data,error}=await sb.from('hr_candidate_answers').select('id,candidate_id,question_key,answer').eq('candidate_id',id);if(error)throw error;if(!current||String(current.id)!==target)return;answers=answers.filter(a=>String(a.candidate_id)!==target).concat(data||[]);renderInterview()}catch(e){if(current&&String(current.id)===target)interviewBody.innerHTML='<div class="panel" style="padding:22px">No se pudieron cargar las respuestas. <button class="btn primary" onclick="startInterview('+JSON.stringify(String(id)).replace(/"/g,'&quot;')+')">Reintentar</button></div>';console.warn('Interview answers unavailable',e)}}function val(k){return localStorage.getItem('hrint:'+current.id+':'+k)||''}function save(k,v){localStorage.setItem('hrint:'+current.id+':'+k,v)}function renderInterview(){const x=current,a=amap(x.id),iv=interviews.find(v=>v.candidate_id===x.id)||{},notes=iv.interview_notes||{};interviewBody.innerHTML=`<div class="print-head"><b>EL CARTEL STUDIO · ENTREVISTA DE CANDIDATO</b><div>Plaza: ${esc(interviewRole(x))}</div></div>${OPENING_GUIDE}<div class="panel interview-brief"><div class="brand">FICHA PARA ENTREVISTA</div><h1 class="interview-brief-name">${esc(x.full_name)}</h1><div class="summary"><span class="chip">${iv.attendance_status==='confirmed'?'✓ Asistencia confirmada':'Confirmación pendiente'}</span><span class="chip">Edad: ${esc(a.age||'—')}</span><span class="chip">Municipio: ${esc(x.municipality||'—')}</span><span class="chip">Estudios: ${esc(a.education_level||'—')}</span><span class="chip">Experiencia: ${esc(x.experience_range||'—')}</span><span class="chip">Excel: ${esc(x.excel_level||'—')}</span></div><div class="interview-brief-facts"><div><small>Edad</small><strong>${esc(a.age||"—")}</strong></div><div><small>Sexo</small><strong>${esc(a.sex||"—")}</strong></div><div><small>Residencia</small><strong>${esc(a.address||x.municipality||"—")}</strong></div><div><small>Formación</small><strong>${esc(a.education_level||"—")}</strong></div><div><small>Experiencia</small><strong>${esc(x.experience_range||"—")}</strong></div><div><small>Plaza</small><strong>${esc(interviewRole(x))}</strong></div></div><div class="candidate-context"><div class="context-box"><span class="context-label">Experiencia laboral declarada</span>${esc(a.experience_description||"No especificada")}</div><div class="context-box"><span class="context-label">Habilidad principal / punto fuerte</span>${esc(a.main_strength||"No especificada")}</div></div><details class="interview-profile-optional"><summary>Completar o consultar otros datos del candidato</summary><p class="muted">Información adicional y campos pendientes del expediente.</p>${renderCandidateProfile(a)}</details></div>${Q.map((q,i)=>{const group=i===0||Q[i-1][0]!==q[0]?`<div class="group-title">${esc(q[0])}</div>`:'';return group+`<div class="question"><div class="section-title">${i+1}. ${esc(q[0])}</div><h3>${esc(q[1])}</h3><div class="follow">Repregunta / guía: ${esc(q[2])}</div><textarea class="no-print" placeholder="Notas de la respuesta…" onblur="saveInterviewNote('q${i}',this.value)">${esc(notes['q'+i]||'')}</textarea></div>`}).join('')}<div class="panel evaluation-panel"><div class="section-title">Evaluación interna del entrevistador</div><h2>Conclusiones de la entrevista</h2><div class="evaluation-help">Esta información es interna y alimentará automáticamente la sección Evaluación interna del perfil del candidato.</div><div class="evaluation-grid"><label class="evaluation-field"><span>Primera impresión</span><textarea id="evalFirstImpression" onblur="saveCandidateEvaluation()" placeholder="Impresión general obtenida durante la entrevista…">${esc(x.internal_first_impression||'')}</textarea></label><label class="evaluation-field"><span>Encaje con la plaza</span><textarea id="evalRoleFit" onblur="saveCandidateEvaluation()" placeholder="Cómo encaja el candidato con las necesidades de la plaza…">${esc(x.internal_role_fit||'')}</textarea></label><label class="evaluation-field"><span>Puntos fuertes</span><textarea id="evalStrengths" onblur="saveCandidateEvaluation()" placeholder="Fortalezas observadas durante la entrevista…">${esc(x.internal_strengths||'')}</textarea></label><label class="evaluation-field"><span>Validar en entrevista</span><textarea id="evalChecks" onblur="saveCandidateEvaluation()" placeholder="Aspectos comprobados o que requieren mayor profundización…">${esc(x.internal_interview_checks||'')}</textarea></label><label class="evaluation-field full"><span>Observaciones internas</span><textarea id="evalInternalNotes" onblur="saveCandidateEvaluation()" placeholder="Notas internas de RRHH. El candidato no ve esta información.">${esc(x.internal_notes||'')}</textarea></label></div></div><div class="panel final"><div class="section-title">Observaciones generales del entrevistador</div><textarea class="no-print" id="generalNotes" placeholder="Notas generales de la conversación…">${esc(iv.general_notes||'')}</textarea><div class="toolbar no-print"><button class="btn primary" onclick="markInterviewed()">Guardar y finalizar entrevista</button><button class="btn dark" onclick="window.print()">Imprimir / guardar PDF</button></div></div>`}async function saveAppointment(){const iv=interviews.find(v=>v.candidate_id===current.id);if(!iv)return alert('No existe una cita guardada.');const payload={interview_date:ivDate.value||null,interview_time:ivTime.value||null,interviewer:ivInterviewer.value.trim(),contact_phone:ivPhone.value.trim(),place:ivPlace.value.trim(),updated_at:new Date().toISOString()};const{data,error}=await sb.from('hr_interviews').update(payload).eq('candidate_id',current.id).select().single();if(error)return alert(error.message);interviews=interviews.filter(v=>v.candidate_id!==current.id);interviews.push(data);renderList();alert('Datos de la entrevista actualizados.')}const interviewProfileGroups=[['Información personal y contacto',[['age','Edad'],['sex','Sexo'],['address','Zona de residencia'],['social_link','Red social']]],['Formación y experiencia',[['education_level','Nivel escolar'],['education','Formación académica'],['professional_profile','Perfil profesional'],['technical_studies','Estudios técnicos'],['technical_training','Formación técnica'],['postgraduate','Posgrado'],['experience_description','Experiencia laboral'],['technical_experience','Experiencia técnica'],['av_experience','Experiencia audiovisual']]],['Habilidades y disponibilidad',[['main_strength','Principal fortaleza'],['case_autonomy','Autonomía'],['own_transport','Transporte propio'],['commute_impediment','Dificultad para trasladarse'],['commute_details','Detalles del traslado']]]];
function renderCandidateProfile(a){const filled=v=>v!=null&&String(v).trim()!=='';const all=interviewProfileGroups.map(([title,fields])=>{const present=fields.filter(([k])=>filled(a[k]));return present.length?'<section class="profile-section"><h3>'+esc(title)+'</h3><div class="interview-profile-grid">'+present.map(([k,label])=>'<div class="context-box"><span class="context-label">'+esc(label)+'</span><div>'+esc(a[k])+'</div></div>').join('')+'</div></section>':''}).join('');const missing=[['age','Edad'],['sex','Sexo'],['address','Zona de residencia'],['education_level','Nivel escolar'],['experience_description','Experiencia laboral'],['main_strength','Principal fortaleza']].filter(([k])=>!filled(a[k]));return all+(missing.length?'<section class="profile-section profile-pending"><h3>Datos pendientes de completar · '+missing.length+'</h3><p class="muted">Puedes registrar estos datos en el expediente antes de la entrevista.</p><div class="interview-profile-grid">'+missing.map(([k,label])=>'<label class="context-box"><span class="context-label">'+esc(label)+'</span><input type="text" data-profile-key="'+esc(k)+'" placeholder="Completar información"></label>').join('')+'</div><button type="button" class="btn" onclick="saveInterviewProfileMissing(this)">Guardar datos pendientes</button></section>':'<p class="muted">Los datos esenciales del perfil están completos.</p>')}
async function saveInterviewProfileMissing(button){if(!current)return;const fields=[...button.closest('.profile-pending').querySelectorAll('[data-profile-key]')].filter(el=>el.value.trim());if(!fields.length)return alert('Introduce al menos un dato.');button.disabled=true;try{for(const el of fields){const key=el.dataset.profileKey,value=el.value.trim();const existing=answers.find(row=>String(row.candidate_id)===String(current.id)&&row.question_key===key);const query=existing?sb.from('hr_candidate_answers').update({answer:value}).eq('id',existing.id):sb.from('hr_candidate_answers').insert({candidate_id:current.id,question_key:key,answer:value});const {data,error}=await query.select().single();if(error)throw error;if(existing)Object.assign(existing,data);else answers.push(data)}renderInterview();}catch(e){console.error(e);alert('No se pudieron guardar todos los datos: '+e.message)}finally{button.disabled=false}}
async function saveInterviewNote(k,v){const iv=interviews.find(x=>x.candidate_id===current.id);if(!iv)return;const notes={...(iv.interview_notes||{}),[k]:v};const{data,error}=await sb.from('hr_interviews').update({interview_notes:notes,updated_at:new Date().toISOString()}).eq('candidate_id',current.id).select().single();if(!error){interviews=interviews.filter(x=>x.candidate_id!==current.id);interviews.push(data)}}function candidateEvaluationPayload(){return {internal_first_impression:(document.getElementById('evalFirstImpression')?.value||'').trim(),internal_role_fit:(document.getElementById('evalRoleFit')?.value||'').trim(),internal_strengths:(document.getElementById('evalStrengths')?.value||'').trim(),internal_interview_checks:(document.getElementById('evalChecks')?.value||'').trim(),internal_notes:(document.getElementById('evalInternalNotes')?.value||'').trim()}}
async function saveCandidateEvaluation(){if(!current)return;const patch=candidateEvaluationPayload(),{error}=await sb.from('hr_candidates').update(patch).eq('id',current.id);if(error){console.error('No se pudo guardar la evaluación interna',error);return}Object.assign(current,patch)}
async function markInterviewed(){if(!current)return;const iv=interviews.find(v=>v.candidate_id===current.id);if(!iv)return alert('No existe una entrevista guardada.');const now=new Date().toISOString();const{error:ie}=await sb.from('hr_interviews').update({general_notes:generalNotes.value.trim(),completed_at:now,updated_at:now}).eq('candidate_id',current.id);if(ie)return alert(ie.message);const evaluation=candidateEvaluationPayload();const{error}=await sb.from('hr_candidates').update({...evaluation,status:'interviewed',decision_status:'pending',decision_updated_at:now}).eq('id',current.id);if(error)return alert(error.message);alert('Entrevista y evaluación interna guardadas. El candidato quedó en Por decidir.');candidates=candidates.filter(x=>x.id!==current.id);current=null;showList();renderList()}function interviewPrintHtml(x){const a=amap(x.id),iv=interviews.find(v=>v.candidate_id===x.id)||{},notes=iv.interview_notes||{};return '<section class="all-print-interview"><div class="print-head" style="display:block"><b>EL CARTEL STUDIO · ENTREVISTA DE CANDIDATO</b><div>Plaza: '+esc(interviewRole(x))+'</div></div>'+OPENING_GUIDE+'<div class="panel" style="padding:18px"><div class="brand">FICHA PARA ENTREVISTA</div><h1 style="font-size:28px">'+esc(x.full_name)+'</h1><div class="summary"><span class="chip">Fecha: '+esc(fmtDate(iv.interview_date))+'</span><span class="chip">Hora: '+esc(String(iv.interview_time||'').slice(0,5)||'—')+'</span><span class="chip">Entrevistador: '+esc(iv.interviewer||'—')+'</span><span class="chip">Edad: '+esc(a.age||'—')+'</span><span class="chip">Municipio: '+esc(x.municipality||'—')+'</span></div><div class="candidate-context"><div class="context-box"><span class="context-label">Experiencia laboral declarada</span>'+esc(a.experience_description||'No especificada')+'</div><div class="context-box"><span class="context-label">Habilidad principal / punto fuerte</span>'+esc(a.main_strength||'No especificada')+'</div></div></div>'+Q.map((q,i)=>'<div class="question"><div class="section-title">'+(i+1)+'. '+esc(q[0])+'</div><h3>'+esc(q[1])+'</h3><div class="follow">Repregunta / guía: '+esc(q[2])+'</div><div class="saved-answer">'+esc(notes['q'+i]||'')+'</div></div>').join('')+'</section>'}function printAllInterviews(){if(!candidates.length)return alert('No hay entrevistas programadas para imprimir.');allPrintView.innerHTML=candidates.map(interviewPrintHtml).join('');document.body.classList.add('print-all');const cleanup=()=>{document.body.classList.remove('print-all');window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);window.print()}function printCurrent(){if(!current){alert('Abre primero la entrevista de un candidato.');return}window.print()}CartelLoad.run("boot",boot);</script></body></html>
