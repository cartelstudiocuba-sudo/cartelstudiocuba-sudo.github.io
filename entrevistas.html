wInterviewTab()}function val(k){return localStorage.getItem('hrint:'+current.id+':'+k)||''}function save(k,v){localStorage.setItem('hrint:'+current.id+':'+k,v)}function renderInterview(){const x=current,a=amap(x.id),iv=interviews.find(v=>v.candidate_id===x.id)||{},notes=iv.interview_notes||{};interviewBody.innerHTML=`<div class="print-head"><b>EL CARTEL STUDIO · ENTREVISTA DE CANDIDATO</b><div>Plaza: Asistente Personal / Ejecutivo</div></div>${OPENING_GUIDE}<div class="panel" style="padding:18px"><div class="brand">FICHA PARA ENTREVISTA</div><h1 style="font-size:28px">${esc(x.full_name)}</h1><div class="summary"><span class="chip">${iv.attendance_status==='confirmed'?'✓ Asistencia confirmada':'Confirmación pendiente'}</span><span class="chip">Edad: ${esc(a.age||'—')}</span><span class="chip">Municipio: ${esc(x.municipality||'—')}</span><span class="chip">Estudios: ${esc(a.education_level||'—')}</span><span class="chip">Experiencia: ${esc(x.experience_range||'—')}</span><span class="chip">Excel: ${esc(x.excel_level||'—')}</span></div><div class="candidate-context"><div class="context-box"><span class="context-label">Experiencia laboral declarada</span>${esc(a.experience_description||'No especificada')}</div><div class="context-box"><span class="context-label">Habilidad principal / punto fuerte</span>${esc(a.main_strength||'No especificada')}</div></div></div><div class="panel appointment no-print"><div class="section-title">Datos de la cita</div><div class="appointment-grid"><div><label>Fecha</label><input id="ivDate" type="date" value="${esc(iv.interview_date||'')}"></div><div><label>Hora</label><input id="ivTime" type="time" value="${esc(String(iv.interview_time||'').slice(0,5))}"></div><div><label>Entrevistador</label><input id="ivInterviewer" value="${esc(iv.interviewer||'')}" placeholder="Nombre del entrevistador"></div><div><label>Teléfono</label><input id="ivPhone" value="${esc(iv.contact_phone||'')}" placeholder="Teléfono de contacto"></div></div><label>Lugar</label><input id="ivPlace" value="${esc(iv.place||'')}" placeholder="Lugar de la entrevista"><div class="toolbar"><button class="btn primary" onclick="saveAppointment()">Guardar cambios</button></div></div>${Q.map((q,i)=>{const group=i===0||Q[i-1][0]!==q[0]?`<div class="group-title">${esc(q[0])}</div>`:'';return group+`<div class="question"><div class="section-title">${i+1}. ${esc(q[0])}</div><h3>${esc(q[1])}</h3><div class="follow">Repregunta / guía: ${esc(q[2])}</div><textarea class="no-print" placeholder="Notas de la respuesta…" onblur="saveInterviewNote('q${i}',this.value)">${esc(notes['q'+i]||'')}</textarea></div>`}).join('')}<div class="panel evaluation-panel"><div class="section-title">Evaluación interna del entrevistador</div><h2>Conclusiones de la entrevista</h2><div class="evaluation-help">Esta información es interna y alimentará automáticamente la sección Evaluación interna del perfil del candidato.</div><div class="evaluation-grid"><label class="evaluation-field"><span>Primera impresión</span><textarea id="evalFirstImpression" onblur="saveCandidateEvaluation()" placeholder="Impresión general obtenida durante la entrevista…">${esc(x.internal_first_impression||'')}</textarea></label><label class="evaluation-field"><span>Encaje con la plaza</span><textarea id="evalRoleFit" onblur="saveCandidateEvaluation()" placeholder="Cómo encaja el candidato con las necesidades de la plaza…">${esc(x.internal_role_fit||'')}</textarea></label><label class="evaluation-field"><span>Puntos fuertes</span><textarea id="evalStrengths" onblur="saveCandidateEvaluation()" placeholder="Fortalezas observadas durante la entrevista…">${esc(x.internal_strengths||'')}</textarea></label><label class="evaluation-field"><span>Validar en entrevista</span><textarea id="evalChecks" onblur="saveCandidateEvaluation()" placeholder="Aspectos comprobados o que requieren mayor profundización…">${esc(x.internal_interview_checks||'')}</textarea></label><label class="evaluation-field full"><span>Observaciones internas</span><textarea id="evalInternalNotes" onblur="saveCandidateEvaluation()" placeholder="Notas internas de RRHH. El candidato no ve esta información.">${esc(x.internal_notes||'')}</textarea></label></div></div><div class="panel final"><div class="section-title">Observaciones generales del entrevistador</div><textarea class="no-print" id="generalNotes" placeholder="Notas generales de la conversación…">${esc(iv.general_notes||'')}</textarea><div class="toolbar no-print"><button class="btn primary" onclick="markInterviewed()">Guardar y finalizar entrevista</button><button class="btn dark" onclick="window.print()">Imprimir / guardar PDF</button></div></div>`}async function saveAppointment(){const iv=interviews.find(v=>v.candidate_id===current.id);if(!iv)return alert('No existe una cita guardada.');const payload={interview_date:ivDate.value||null,interview_time:ivTime.value||null,interviewer:ivInterviewer.value.trim(),contact_phone:ivPhone.value.trim(),place:ivPlace.value.trim(),updated_at:new Date().toISOString()};const{data,error}=await sb.from('hr_interviews').update(payload).eq('candidate_id',current.id).select().single();if(error)return alert(error.message);interviews=interviews.filter(v=>v.candidate_id!==current.id);interviews.push(data);alert('Datos de la entrevista actualizados.')}async function saveInterviewNote(k,v){const iv=interviews.find(x=>x.candidate_id===current.id);if(!iv)return;const notes={...(iv.interview_notes||{}),[k]:v};const{data,error}=await sb.from('hr_interviews').update({interview_notes:notes,updated_at:new Date().toISOString()}).eq('candidate_id',current.id).select().single();if(!error){interviews=interviews.filter(x=>x.candidate_id!==current.id);interviews.push(data)}}function candidateEvaluationPayload(){return {internal_first_impression:(document.getElementById('evalFirstImpression')?.value||'').trim(),internal_role_fit:(document.getElementById('evalRoleFit')?.value||'').trim(),internal_strengths:(document.getElementById('evalStrengths')?.value||'').trim(),internal_interview_checks:(document.getElementById('evalChecks')?.value||'').trim(),internal_notes:(document.getElementById('evalInternalNotes')?.value||'').trim()}}
async function saveCandidateEvaluation(){if(!current)return;const patch=candidateEvaluationPayload(),{error}=await sb.from('hr_candidates').update(patch).eq('id',current.id);if(error){console.error('No se pudo guardar la evaluación interna',error);return}Object.assign(current,patch)}
async function markInterviewed(){if(!current)return;const iv=interviews.find(v=>v.candidate_id===current.id);if(!iv)return alert('No existe una entrevista guardada.');const now=new Date().toISOString();const{error:ie}=await sb.from('hr_interviews').update({general_notes:generalNotes.value.trim(),completed_at:now,updated_at:now}).eq('candidate_id',current.id);if(ie)return alert(ie.message);const evaluation=candidateEvaluationPayload();const{error}=await sb.from('hr_candidates').update({...evaluation,status:'interviewed',decision_status:'pending',decision_updated_at:now}).eq('id',current.id);if(error)return alert(error.message);alert('Entrevista y evaluación interna guardadas. El candidato quedó en Por decidir.');candidates=candidates.filter(x=>x.id!==current.id);current=null;showList();renderList()}function interviewPrintHtml(x){const a=amap(x.id),iv=interviews.find(v=>v.candidate_id===x.id)||{},notes=iv.interview_notes||{};return '<section class="all-print-interview"><div class="print-head" style="display:block"><b>EL CARTEL STUDIO · ENTREVISTA DE CANDIDATO</b><div>Plaza: Asistente Personal / Ejecutivo</div></div>'+OPENING_GUIDE+'<div class="panel" style="padding:18px"><div class="brand">FICHA PARA ENTREVISTA</div><h1 style="font-size:28px">'+esc(x.full_name)+'</h1><div class="summary"><span class="chip">Fecha: '+esc(fmtDate(iv.interview_date))+'</span><span class="chip">Hora: '+esc(String(iv.interview_time||'').slice(0,5)||'—')+'</span><span class="chip">Entrevistador: '+esc(iv.interviewer||'—')+'</span><span class="chip">Edad: '+esc(a.age||'—')+'</span><span class="chip">Municipio: '+esc(x.municipality||'—')+'</span></div><div class="candidate-context"><div class="context-box"><span class="context-label">Experiencia laboral declarada</span>'+esc(a.experience_description||'No especificada')+'</div><div class="context-box"><span class="context-label">Habilidad principal / punto fuerte</span>'+esc(a.main_strength||'No especificada')+'</div></div></div>'+Q.map((q,i)=>'<div class="question"><div class="section-title">'+(i+1)+'. '+esc(q[0])+'</div><h3>'+esc(q[1])+'</h3><div class="follow">Repregunta / guía: '+esc(q[2])+'</div><div class="saved-answer">'+esc(notes['q'+i]||'')+'</div></div>').join('')+'</section>'}function printAllInterviews(){if(!candidates.length)return alert('No hay entrevistas programadas para imprimir.');allPrintView.innerHTML=candidates.map(interviewPrintHtml).join('');document.body.classList.add('print-all');const cleanup=()=>{document.body.classList.remove('print-all');window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);window.print()}function printCurrent(){if(!current){alert('Abre primero la entrevista de un candidato.');return}window.print()}boot();</script></body></html>
