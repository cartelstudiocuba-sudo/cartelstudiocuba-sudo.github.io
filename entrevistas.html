function goInterviewStep(n){const view=document.getElementById('interviewView');if(!view)return;const panes={1:'interviewStepPresentation',2:'interviewStepReview',3:'interviewStepMissing',4:'interviewStepQuestionnaire',5:'interviewStepEvaluation',6:'interviewStepDecision'};Object.entries(panes).forEach(([step,id])=>{const el=document.getElementById(id);if(el)el.hidden=Number(step)!==n});view.querySelectorAll('.interview-step').forEach(btn=>{const active=Number(btn.dataset.interviewStep)===n;btn.classList.toggle('active',active);btn.setAttribute('aria-current',active?'step':'false')});if(n===2){const f=document.getElementById('candidateReviewFrame');if(f?.contentDocument&&!f.contentDocument.getElementById('interviewReviewExact'))prepareCandidateReviewFrame(f)}if(n===6){const head=document.querySelector('#interviewStepDecision .interview-quick-head');if(head&&head.getAttribute('aria-expanded')!=='true')head.click()}const top=view.querySelector('.interview-brief');if(top)top.scrollIntoView({behavior:'smooth',block:'start'})}function initializeInterviewSteps(){goInterviewStep(1)}
