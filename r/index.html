<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Inventario · El Cartel Studio</title><style>body{margin:0;padding:24px;background:#111820;color:#eef3f7;font:16px/1.6 system-ui}main{max-width:460px;margin:12vh auto;padding:28px;border:1px solid #ffffff25;border-radius:20px}small{color:#ffda03}h1{font-size:26px}a{display:inline-block;padding:12px 18px;border-radius:12px;background:#ffda03;color:#161b20;text-decoration:none;font-weight:700}[hidden]{display:none!important}</style></head><body><main><small>EL CARTEL STUDIO</small><h1>Inventario de Nevera Audiovisual</h1><p id="status" role="status">Preparando descarga del PDF…</p><a id="download" hidden>Descargar PDF</a><p>Siempre positivo</p></main><script>
