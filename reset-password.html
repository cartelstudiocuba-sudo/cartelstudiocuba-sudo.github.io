<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Nueva contraseña · El Cartel Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><style>:root{--y:#FFDA03;--bg:#090909;--card:#151515;--line:#303030;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:470px;margin:7vh auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}.brand{font-size:13px;font-weight:950;letter-spacing:.05em;color:var(--y)}h1{font-size:31px;margin:9px 0}.muted{color:var(--muted);line-height:1.5}.field{margin-top:16px}label{display:block;font-size:13px;font-weight:850;margin-bottom:7px}input{width:100%;background:#0d0d0d;color:#fff;border:1px solid #3a3a3a;border-radius:13px;padding:15px;font-size:16px}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:19px;background:var(--y);color:#080808;font-size:16px;font-weight:900}.msg{display:none;margin-top:15px;padding:13px;border-radius:13px;background:#111;border:1px solid #555;line-height:1.45}.ok{border-color:#376a3f;color:#b8ffc1}.bad{border-color:#743737;color:#ffb6b6}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><div class="brand">CARTEL STUDIO · RRHH</div><h1>Crear nueva contraseña</h1><p id="intro" class="muted">Comprobando el enlace de recuperación…</p><form id="form" class="hidden"><div class="field"><label>Nueva contraseña</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>Confirmar contraseña</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required></div><button id="btn">Guardar nueva contraseña</button></form><div id="msg" class="msg"></div></div></div><script>const U='https://jhumvctocphyiwhszeaz.supabase.co',K='sb_publishable_ZHV-5dlsjfamQpfUOsgumg_G-vN84Gn';const sb=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),form=document.getElementById('form'),intro=document.getElementById('intro'),msg=document.getElementById('msg'),btn=document.getElementById('btn');function showMsg(ok,t){msg.style.display='block';msg.className='msg '+(ok?'ok':'bad');msg.textContent=t}async function ready(){try{let session=null;const hash=new URLSearchParams(location.hash.replace(/^#/,''));const access=hash.get('access_token'),refresh=hash.get('refresh_token');if(access&&refresh){const r=await sb.auth.setSession({access_token:access,refresh_token:refresh});if(r.error)throw r.error;session=r.data.session}else{const r=await sb.auth.getSession();if(r.error)throw r.error;session=r.data.session}if(!session){intro.textContent='Este enlace de recuperación no contiene una sesión válida o ya expiró.';showMsg(false,'Solicita un nuevo correo de recuperación desde Supabase y abre el enlace más reciente.');return}intro.textContent='Escribe la nueva contraseña que utilizarás para acceder al panel privado de Recursos Humanos.';form.classList.remove('hidden')}catch(e){intro.textContent='No se pudo validar el enlace de recuperación.';showMsg(false,e.message||String(e))}}form.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1!==p2)return showMsg(false,'Las dos contraseñas no coinciden.');if(p1.length<8)return showMsg(false,'La contraseña debe tener al menos 8 caracteres.');btn.disabled=true;btn.textContent='Guardando…';try{const{error}=await sb.auth.updateUser({password:p1});if(error)throw error;showMsg(true,'Contraseña actualizada correctamente. Ya puedes iniciar sesión en RRHH con esta nueva contraseña.');form.classList.add('hidden');intro.textContent='Cambio completado.'}catch(e){showMsg(false,'No se pudo actualizar: '+(e.message||String(e)))}finally{btn.disabled=false;btn.textContent='Guardar nueva contraseña'}});ready();</script></body></html>
